<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The League Ledger</title>
<meta name="description" content="Standings, playoff odds, weekly high-score money and league history for our Sleeper fantasy football league.">
<meta property="og:title" content="The League Ledger">
<meta property="og:description" content="Standings, playoff odds, weekly high-score money and league history for our Sleeper fantasy football league.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#171512">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23171512'/%3E%3Ctext x='32' y='47' font-family='Georgia,serif' font-size='42' font-weight='900' text-anchor='middle' fill='%23f3efe6'%3EL%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,800;0,8..60,900;1,8..60,400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f3efe6; --paper-2: #e9e3d6; --ink: #171512; --ink-2: #3f3a33; --muted: #625b4b;
    --rule: #171512; --hair: #d5cdbb; --hair-2: #b9b09b;
    --accent: #4b2a7b; --gold: #7d5600; --gold-bar: #e2b23a; --up: #2c6a3d; --down: #a3361f;
    --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
    --cond: "Barlow Condensed", "Arial Narrow", sans-serif;
    --sans: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #141311; --paper-2: #1e1c19; --ink: #eee8da; --ink-2: #cdc5b4; --muted: #a39b88;
      --rule: #eee8da; --hair: #35312b; --hair-2: #4d473e;
      --accent: #b89df0; --gold: #e8b931; --gold-bar: #c99a22; --up: #72c286; --down: #ea8064;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 var(--sans); }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px 72px; overflow-x: clip; }

  /* Scoreboard strip */
  .strip { background: var(--ink); color: var(--paper); }
  .strip-in { display: flex; overflow-x: auto; max-width: 1180px; margin: 0 auto; scrollbar-width: none; }
  .strip-in::-webkit-scrollbar { display: none; }
  .strip .tag { flex: none; display: flex; align-items: center; padding: 0 14px 0 16px; font: 700 12px/1 var(--cond);
                letter-spacing: .14em; text-transform: uppercase; border-right: 1px solid color-mix(in srgb, var(--paper) 25%, transparent); }
  .strip .tag b { color: var(--gold-bar); margin-left: 6px; }
  .game { flex: 1 1 0; min-width: 140px; padding: 7px 12px; font-size: 13px; line-height: 1.35;
          border-right: 1px solid color-mix(in srgb, var(--paper) 18%, transparent); }
  .game .r { display: flex; justify-content: space-between; gap: 10px; opacity: .78; }
  .game .r span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .game .r.ahead { opacity: 1; font-weight: 600; }
  .game .r span:last-child { font-variant-numeric: tabular-nums; }

  /* Masthead */
  .mast { padding-top: 14px; }
  .mast .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;
               font: 600 12px/1 var(--cond); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2);
               border-bottom: 1px solid var(--rule); padding-bottom: 8px; }
  .mast .ctl { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .mast select, .mast button, .warn button { font: 600 13px/1 var(--cond); letter-spacing: .1em; text-transform: uppercase; color: var(--ink);
               background: transparent; border: 1px solid var(--hair-2); padding: 0 10px; min-height: 40px; cursor: pointer; border-radius: 0; }
  .mast select { max-width: 11em; }
  .mast .upd { text-transform: none; letter-spacing: 0; font: 400 12px/1.2 var(--sans); color: var(--muted); }
  .mast h1 { font: 900 clamp(34px, 9vw, 92px)/.95 var(--serif); letter-spacing: -0.025em; text-align: center; margin: 18px 0 6px; text-wrap: balance; }
  .mast .motto { text-align: center; font: italic 400 16px/1.3 var(--serif); color: var(--ink-2); margin-bottom: 14px; }
  @media (max-width: 600px) {
    .mast h1 { margin: 12px 0 4px; }
    .mast .motto { font-size: 14px; margin-bottom: 10px; }
  }
  .mast .rule2 { border-top: 4px double var(--rule); }
  nav.tabs { display: flex; justify-content: center; border-bottom: 1px solid var(--rule); overflow-x: auto; scrollbar-width: none; }
  nav.tabs::-webkit-scrollbar { display: none; }
  nav.tabs a { font: 700 14px/1 var(--cond); letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
               text-decoration: none; padding: 13px 14px 10px; border-bottom: 3px solid transparent; white-space: nowrap; }
  nav.tabs a:hover { color: var(--ink); }
  nav.tabs a.on { color: var(--ink); border-bottom-color: var(--accent); }
  /* Phones: all six tabs visible in a 3x2 grid instead of a hidden sideways scroll. */
  @media (max-width: 700px) {
    nav.tabs { display: grid; grid-template-columns: repeat(3, 1fr); }
    nav.tabs a { text-align: center; padding: 12px 4px 9px; font-size: 13px; letter-spacing: .08em; }
    nav.tabs .long { display: none; }
  }

  /* Sections */
  .sec { margin-top: 34px; }
  .sec-h { border-top: 3px solid var(--rule); padding-top: 7px; margin-bottom: 12px; display: flex; flex-wrap: wrap;
           align-items: baseline; gap: 4px 14px; }
  .sec-h h2 { font: 700 21px/1.1 var(--cond); letter-spacing: .06em; text-transform: uppercase; margin: 0; }
  .sec-h .dek { color: var(--muted); font-size: 13px; }
  .sub-h { font: 700 15px/1.2 var(--cond); letter-spacing: .08em; text-transform: uppercase; margin: 26px 0 8px;
           padding-top: 6px; border-top: 1px solid var(--rule); }
  .cols { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 0 30px; }
  .cols > .side { border-left: 1px solid var(--hair); padding-left: 30px; }
  .cols.even { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  @media (max-width: 880px) { .cols, .cols.even { grid-template-columns: minmax(0, 1fr); } .cols > .side { border-left: 0; padding-left: 0; margin-top: 28px; } }
  .note { font-size: 13px; color: var(--muted); margin-top: 10px; max-width: 80ch; }
  .muted { color: var(--muted); }
  .up { color: var(--up); } .down { color: var(--down); }
  .money { color: var(--gold); font-weight: 700; }
  .loading { padding: 60px 0; text-align: center; font: italic 18px var(--serif); color: var(--muted); }
  .err { margin-top: 24px; padding: 14px; border: 1px solid var(--down); color: var(--down); }
  .warn { margin-top: 16px; padding: 10px 12px; border: 1px solid var(--down); color: var(--ink); display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; font-size: 14px; }
  details.how { margin-top: 10px; font-size: 13px; color: var(--muted); max-width: 80ch; }
  details.how summary { cursor: pointer; font: 600 13px/1 var(--cond); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); padding: 8px 0; min-height: 32px; }
  details.how p { margin: 4px 0 8px; }
  /* My team */
  .mine { margin-top: 22px; padding: 14px 16px; background: var(--paper-2); border-top: 3px solid var(--accent); }
  .mine .row { display: flex; flex-wrap: wrap; gap: 8px 26px; margin-top: 10px; }
  .mine .stat .label { color: var(--muted); }
  .mine .stat .v { font: 700 24px/1.1 var(--cond); font-variant-numeric: tabular-nums; }
  .mine .stat .s { font-size: 13px; color: var(--ink-2); }
  .t tr.me td, .race tr.me td { background: color-mix(in srgb, var(--accent) 12%, var(--paper)); }
  .t tr.me td:first-child { box-shadow: inset 3px 0 0 var(--accent); }

  /* Front page */
  .lead .kicker, .brief .kicker, .label { font: 700 12px/1.2 var(--cond); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
  .lead { padding-top: 22px; }
  .lead h3 { font: 800 clamp(30px, 4.8vw, 50px)/1.04 var(--serif); letter-spacing: -0.018em; margin: 8px 0 12px; text-wrap: balance; }
  .lead .dek { font: 400 19px/1.45 var(--serif); color: var(--ink-2); margin: 0; }
  .byline { font: 600 12px/1 var(--cond); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-top: 14px; }
  .briefs { display: grid; grid-template-columns: 1fr 1fr; gap: 0 26px; margin-top: 22px; border-top: 1px solid var(--rule); }
  @media (max-width: 600px) { .briefs { grid-template-columns: 1fr; } }
  .brief { padding: 13px 0 14px; border-bottom: 1px solid var(--hair); }
  .brief h4 { font: 700 19px/1.2 var(--serif); margin: 4px 0 5px; text-wrap: balance; }
  .brief p { margin: 0; font-size: 14px; color: var(--ink-2); }
  .side { padding-top: 22px; }
  .race { width: 100%; border-collapse: collapse; font-size: 14px; }
  .race td { padding: 5px 0; border-bottom: 1px solid var(--hair); }
  .race td.p { text-align: right; width: 5.6em; white-space: nowrap; font-variant-numeric: tabular-nums; font-weight: 600; }
  .race td.b { width: 32%; padding-left: 10px; }
  .race tr.cut td { border-bottom: 2px solid var(--rule); }
  .side .block + .block { margin-top: 26px; }
  .side .label { color: var(--ink); margin-bottom: 6px; display: block; }

  /* Stakes */
  .stake { display: grid; grid-template-columns: minmax(0, 1fr) 200px minmax(0, 1fr); gap: 14px; align-items: center;
           padding: 14px 0; border-bottom: 1px solid var(--hair); }
  .stake.gotw { border-bottom: 2px solid var(--rule); background: var(--paper-2); padding: 16px 14px; margin: 0 -14px; }
  .stake .side-a { text-align: right; } .stake .side-a .team { flex-direction: row-reverse; text-align: right; }
  .stake .if { font-size: 13px; color: var(--muted); margin-top: 3px; font-variant-numeric: tabular-nums; }
  .stake .if b { color: var(--ink); font-weight: 600; }
  .stake .mid { text-align: center; }
  .stake .mid .pp { display: flex; justify-content: space-between; font: 700 20px/1 var(--cond); font-variant-numeric: tabular-nums; }
  .stake .mid .live { font: 600 12px/1 var(--cond); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
  .stake .mid .done { font: 700 12px/1 var(--cond); letter-spacing: .12em; text-transform: uppercase; color: var(--ink); margin-top: 8px; }
  .split { display: flex; height: 6px; margin-top: 6px; gap: 2px; }
  .split i { display: block; height: 100%; }
  .split i:first-child { background: var(--accent); } .split i:last-child { background: var(--hair-2); }
  .gotw-tag { font: 700 11px/1 var(--cond); letter-spacing: .16em; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; grid-column: 1 / -1; text-align: center; }
  @media (max-width: 680px) {
    .stake { grid-template-columns: 1fr 1fr; }
    .stake .mid { grid-column: 1 / -1; order: -1; }
    .gotw-tag { order: -2; }
  }

  /* Tables */
  /* Scrolling tables: shadows show there's more to the side; the team column stays put. */
  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch;
    background: linear-gradient(to right, var(--paper) 30%, transparent) left / 32px 100% no-repeat local,
                linear-gradient(to left, var(--paper) 30%, transparent) right / 32px 100% no-repeat local,
                radial-gradient(farthest-side at 0 50%, rgb(0 0 0 / .22), transparent) left / 10px 100% no-repeat scroll,
                radial-gradient(farthest-side at 100% 50%, rgb(0 0 0 / .22), transparent) right / 10px 100% no-repeat scroll; }
  .scroll .t th:first-child, .scroll .t td:first-child { position: sticky; left: 0; z-index: 1; background: var(--paper); }
  @media (max-width: 600px) {
    .t .opt, .t .cellbar .bar { display: none; }
    .scroll .t td:first-child .team { max-width: 9.5em; }
    .scroll .t td:first-child .nm { white-space: normal; }
  }
  table.t { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  .t th { font: 600 12px/1.2 var(--cond); letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
          text-align: right; padding: 8px 9px; border-bottom: 1px solid var(--rule); white-space: nowrap; vertical-align: bottom; }
  .t td { text-align: right; padding: 7px 9px; border-bottom: 1px solid var(--hair); white-space: nowrap; }
  .t th.l, .t td.l { text-align: left; }
  .t.wrapcells td, .t.wrapcells th { white-space: normal; }
  .t tr.cut td { border-bottom: 2px solid var(--rule); }
  .t td.strong, .t .strong { font-weight: 700; }
  .t tr[data-team] { cursor: pointer; }
  .t tr.on td { background: var(--paper-2); }
  .t td.wrap { white-space: normal; min-width: 9em; }
  .scroll .t tr.on td:first-child { background: var(--paper-2); }
  .scroll .t tr.me td:first-child { background: color-mix(in srgb, var(--accent) 12%, var(--paper)); }
  .rk { display: inline-block; width: 1.7em; color: var(--muted); font-variant-numeric: tabular-nums; }
  .team { display: inline-flex; align-items: center; gap: 9px; vertical-align: middle; text-align: left; }
  .team img, .team .ph { width: 24px; height: 24px; border-radius: 50%; flex: none; background: var(--paper-2); object-fit: cover; border: 1px solid var(--hair); }
  .team .nm { font-weight: 600; line-height: 1.15; }
  .team .own { color: var(--muted); font-size: 12px; line-height: 1.1; }
  .bar { height: 5px; background: var(--hair); min-width: 60px; }
  .bar > i { display: block; height: 100%; background: var(--accent); }
  .bar.gold > i { background: var(--gold-bar); }
  .cellbar { display: flex; align-items: center; gap: 9px; justify-content: flex-end; }
  .cellbar .bar { flex: 1; max-width: 120px; }
  .cellbar span { min-width: 3em; text-align: right; }
  td.hi { color: var(--gold); font-weight: 700; } td.lo { color: var(--down); }
  td.hi::after { content: "▲"; font-size: 8px; vertical-align: 2px; margin-left: 2px; }

  /* Matrices */
  .mx td, .mx th { padding: 6px 7px; text-align: center; }
  .mx td.l, .mx th.l { text-align: left; }
  .mx td.self { outline: 2px solid var(--ink); outline-offset: -2px; font-weight: 700; }
  .mx th.vert { writing-mode: vertical-rl; transform: rotate(180deg); text-align: left; height: 120px; padding: 6px 4px; }

  /* Superlatives */
  .sup { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); border-top: 1px solid var(--rule); }
  .sup > div { padding: 12px 14px 14px 0; border-bottom: 1px solid var(--hair); }
  .sup .v { font: 700 30px/1.1 var(--cond); font-variant-numeric: tabular-nums; margin: 3px 0; }
  .sup .d { font-size: 13px; color: var(--ink-2); }

  /* Trades */
  .trade { border-bottom: 1px solid var(--hair); padding: 12px 0; display: grid; grid-template-columns: 70px 1fr; gap: 12px; }
  .trade .sides { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .trade ul { margin: 4px 0 0; padding-left: 18px; font-size: 14px; }

  /* Bump chart */
  .bump-wrap { position: relative; }
  .bump { display: block; font: 500 12px var(--sans); }
  .bump .ax { fill: var(--muted); font-variant-numeric: tabular-nums; }
  .bump .gl { stroke: var(--hair); stroke-width: 1; }
  .bump .ln { fill: none; stroke: var(--hair-2); stroke-width: 2; stroke-linejoin: round; }
  .bump .hit { fill: none; stroke: transparent; stroke-width: 14; cursor: pointer; }
  .bump .pt { fill: var(--hair-2); stroke: var(--paper); stroke-width: 2; cursor: pointer; }
  .bump .lb { fill: var(--ink-2); cursor: pointer; }
  .bump.focus .bl { opacity: .16; }
  .bump.focus .bl.on { opacity: 1; }
  .bump .bl.on .ln { stroke: var(--accent); stroke-width: 3; }
  .bump .bl.on .pt { fill: var(--accent); }
  .bump .bl.on .lb { fill: var(--ink); font-weight: 700; }
  .tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--paper); font-size: 12px;
         padding: 5px 8px; white-space: nowrap; z-index: 3; }
</style>
</head>
<body>
<div class="strip"><div class="strip-in" id="strip"></div></div>
<div class="wrap">
  <header class="mast">
    <div class="top">
      <span id="dateline">Loading</span>
      <span class="ctl"><select id="mine" aria-label="My team"><option value="">My team…</option></select><select id="season" aria-label="Season"></select><button id="refresh" type="button">Refresh</button><span class="upd" id="updated" aria-live="polite"></span></span>
    </div>
    <h1 id="title">The League Ledger</h1>
    <div class="motto" id="motto">Standings, money, and grudges, kept honest.</div>
    <div class="rule2"></div>
    <nav class="tabs" id="tabs">
      <a href="#front" data-tab="front">Front<span class="long"> Page</span></a>
      <a href="#rankings" data-tab="rankings">Rankings<span class="long"> &amp; Odds</span></a>
      <a href="#standings" data-tab="standings">Standings</a>
      <a href="#money" data-tab="money">Money</a>
      <a href="#managers" data-tab="managers">Managers</a>
      <a href="#history" data-tab="history">History</a>
    </nav>
  </header>
  <main id="app"><div class="loading">Fetching the latest from Sleeper…</div></main>
</div>

<script>
// ============================== CONFIG ==============================
const CONFIG = {
  leagueId: '1384626278153322496',   // current season's Sleeper league ID
  highScorePayout: 10,               // $ per week to the top scorer
  payPlayoffWeeks: false,            // true = keep paying high score during playoff weeks
  splitTies: true,                   // tie for high score splits the payout
  sims: 10000,                       // playoff simulations
};
const qs = new URLSearchParams(location.search);
if (qs.get('league')) CONFIG.leagueId = qs.get('league');
if (qs.get('payout')) CONFIG.highScorePayout = Number(qs.get('payout'));
// ====================================================================

const API = 'https://api.sleeper.app/v1';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const f1 = n => (+n).toFixed(1), f2 = n => (+n).toFixed(2);
const usd = n => '$' + (Number.isInteger(n) ? n : n.toFixed(2));
const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
const range = (a, b) => { const r = []; for (let i = a; i <= b; i++) r.push(i); return r; };
const ord = n => { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };
const get = async path => {
  const r = await fetch(API + path);
  if (!r.ok) throw new Error(`${path} returned HTTP ${r.status}`);
  return r.json();
};
const erf = x => { const s = Math.sign(x); x = Math.abs(x); const t = 1 / (1 + 0.3275911 * x);
  return s * (1 - ((((1.061405429 * t - 1.453152027) * t + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x)); };
const phi = z => 0.5 * (1 + erf(z / Math.SQRT2));
// Simulated 0%/100% isn't a mathematical lock, so it reads <0.1% / >99.9% unless the math proves it.
const pct = (p, exact) => {
  if (p == null) return '–';
  if (exact) return `${Math.round(p * 100)}%`;
  if (p >= 0.9995) return '>99.9%';
  if (p <= 0.0005) return '<0.1%';
  return p >= 0.98 || p <= 0.02 ? `${(p * 100).toFixed(1)}%` : `${Math.round(p * 100)}%`;
};
// Playoff odds text: proven clinches/eliminations beat simulated percentages.
const oddsTxt = (odds, id) => odds.final ? pct(odds.made[id], true) : odds.clinched.has(id) ? 'Clinched' : odds.eliminated.has(id) ? 'Eliminated' : pct(odds.made[id]);

const TABS = ['front', 'rankings', 'standings', 'money', 'managers', 'history'];
const tabFromHash = () => { const t = location.hash.slice(1); return TABS.includes(t) ? t : 'front'; };
const state = { chain: [], chainDone: Promise.resolve(), cache: {}, cur: null, tab: tabFromHash(), history: null };
const margin = g => Math.abs(g.pa - g.pb);
const winLose = g => g.pa >= g.pb ? [g.a, g.b, g.pa, g.pb] : [g.b, g.a, g.pb, g.pa];
// The viewer's own team, remembered by Sleeper user ID so it carries across seasons.
const MINE_KEY = 'ledger.myteam';
const myUid = () => { try { return localStorage.getItem(MINE_KEY) || ''; } catch { return ''; } };
const myTeam = d => { const u = myUid(); return u ? Object.values(d.teams).find(t => t.uid === u) || null : null; };

// ============================== LOADING ==============================
async function seasonChain(startId) {
  const out = [];
  let id = startId;
  while (id && id !== '0' && out.length < 15) {
    const lg = await get(`/league/${id}`);
    if (!lg) break;
    out.push({ id: lg.league_id, season: lg.season, league: lg });
    id = lg.previous_league_id;
  }
  return out;
}

async function load(leagueId, opts = {}) {
  const [league, users, rosters, nfl] = await Promise.all([
    opts.league || get(`/league/${leagueId}`), get(`/league/${leagueId}/users`), get(`/league/${leagueId}/rosters`), get('/state/nfl'),
  ]);
  const s = league.settings;

  const ids = Object.keys(d.teams).map(Number);
  const m = scoreModel(tally(d, w - 1), ids);
  return phi((m.mu[a] - m.mu[b]) / (m.sd * Math.SQRT2));
}

// ============================== LINEUPS ==============================
const SLOT_ELIG = { QB: ['QB'], RB: ['RB'], WR: ['WR'], TE: ['TE'], K: ['K'], DEF: ['DEF'], DL: ['DL'], LB: ['LB'], DB: ['DB'],
  FLEX: ['RB', 'WR', 'TE'], WRRB_FLEX: ['RB', 'WR'], REC_FLEX: ['WR', 'TE'], SUPER_FLEX: ['QB', 'RB', 'WR', 'TE'], IDP_FLEX: ['DL', 'LB', 'DB'] };
function lineups(d, players) {
  const posOf = id => players[id]?.p?.length ? players[id].p : (/^[A-Z]+$/.test(id) ? ['DEF'] : []);
  const best = row => bestLineupTotal(d, (row.players || []).map(id => ({ id, pts: row.players_points?.[id] ?? 0, pos: posOf(id) })));
  const per = {}, blunders = [], benchMvp = {};
  for (const id in d.teams) per[id] = { act: 0, opt: 0, blown: 0, perfect: 0, weeks: 0, worst: null };
  for (const w of d.weeks) {
    if (w >= d.playoffStart) continue;
    const rows = regRows(d, w);
    const pts = Object.fromEntries(rows.map(r => [r.roster_id, r.points ?? 0]));
    for (const r of rows) {
      const act = r.points ?? 0, opt = Math.max(best(r), act), left = opt - act, x = per[r.roster_id];
      x.act += act; x.opt += opt; x.weeks++;
      if (left < 0.01) x.perfect++;
      if (!x.worst || left > x.worst.left) x.worst = { w, left };
      const opp = d.opp[w]?.[r.roster_id];
      if (opp != null && act < pts[opp] && opt > pts[opp]) {
        x.blown++;
        blunders.push({ w, id: r.roster_id, opp, act, opt, oppPts: pts[opp], left });
      }
      const starters = new Set(r.starters || []);
      for (const pid of r.players || []) {
        const p = r.players_points?.[pid] ?? 0;
        if (!starters.has(pid) && (!benchMvp[w] || p > benchMvp[w].pts)) benchMvp[w] = { pid, pts: p, id: r.roster_id };
      }
    }
  }
  for (const id in per) per[id].eff = per[id].opt ? per[id].act / per[id].opt : 0;
  blunders.sort((a, b) => b.left - a.left);
  return { per, blunders, benchMvp };
}

// ============================== MOVES ==============================
function moves(d, players) {
  const tx = [...d.transactions].sort((a, b) => a.created - b.created);
  // Points a team started from a player, from the week it got him until it dropped or traded him (regular season).
  const startedFor = (rid, pid, fromWeek, created) => {
    const gone = tx.find(t => t.created > created && t.drops?.[pid] === rid);
    let s = 0;
    for (const w of d.weeks) {
      if (w < fromWeek || w >= d.playoffStart || (gone && w > gone.leg)) continue;
      const r = regRows(d, w).find(x => x.roster_id === rid);
      const i = r?.starters?.indexOf(pid) ?? -1;
      if (i >= 0) s += r.starters_points?.[i] ?? 0;
    }
    return s;
  };
  const pName = pid => players?.[pid] ? players[pid].n : `Player ${pid}`;
  const pMeta = pid => players?.[pid] ? `${(players[pid].p || [])[0] || ''} · ${players[pid].t}` : '';
  const perTeam = {};
  for (const id in d.teams) perTeam[id] = { adds: 0, faab: 0, pts: 0, best: null };
  const pickups = [], trades = [];
  for (const t of tx) {
    if (t.type === 'waiver' || t.type === 'free_agent') {
      for (const [pid, rid] of Object.entries(t.adds || {})) {
        if (!perTeam[rid]) continue;
        const bid = t.type === 'waiver' ? (t.settings?.waiver_bid ?? 0) : null;
        const pts = startedFor(rid, pid, t.leg, t.created);
        const pk = { pid, name: pName(pid), meta: pMeta(pid), rid, w: t.leg, bid, pts };
        pickups.push(pk);
        const x = perTeam[rid]; x.adds++; x.faab += bid || 0; x.pts += pts;
        if (!x.best || pts > x.best.pts) x.best = pk;
      }
    } else if (t.type === 'trade') {
      const sides = (t.roster_ids || []).map(rid => ({
        rid,
        got: Object.entries(t.adds || {}).filter(([, r]) => r === rid).map(([pid]) => ({ pid, name: pName(pid), meta: pMeta(pid), pts: startedFor(rid, pid, t.leg, t.created) })),
        picks: (t.draft_picks || []).filter(p => p.owner_id === rid).map(p => `${p.season} round ${p.round} pick`),
        faab: (t.waiver_budget || []).filter(b => b.receiver === rid).reduce((s, b) => s + b.amount, 0),
      }));
      trades.push({ w: t.leg, created: t.created, sides });
    }
  }
  pickups.sort((a, b) => b.pts - a.pts);
  return { perTeam, pickups, trades, faabBudget: d.league.settings.waiver_type === 2 ? d.league.settings.waiver_budget : null };
}

// ============================== SCHEDULE SWAP ==============================
// Row team's H2H record if it had played the column team's schedule.
function swapMatrix(d) {
  const ids = Object.keys(d.teams).map(Number);
  const weeks = Object.keys(d.opp).map(Number);
  const sc = (id, w) => d.teams[id].scores[w];
  const m = {};
  for (const a of ids) {
    m[a] = {};
    for (const b of ids) {
      let w = 0, l = 0;
      for (const wk of weeks) {
        let o = d.opp[wk][b];
        if (o == null) continue;
        if (o === a) o = b;
        if (sc(a, wk) > sc(o, wk)) w++; else if (sc(a, wk) < sc(o, wk)) l++;
      }
      m[a][b] = { w, l };
    }
  }
  return m;
}

// ============================== HEADLINES ==============================
// Templated from the data. Past tense dodges "59ers wins/win" agreement problems.
function headlines(b) {
  const { d, c, power, lu, players } = b;
  const out = [];
  const N = id => esc(d.teams[id].name);
  if (d.complete && d.champion != null) {
    const ru = d.runnerUp != null ? ` They beat ${N(d.runnerUp)} in the final.` : '';
    out.push({ s: 1000, k: 'Champions', h: `${N(d.champion)} won the ${esc(d.league.season)} title`, p: `The season is in the books.${ru}` });
  }
  if (!power) return out;
  const W = power.last;
  const games = c.games.filter(g => g.week === W);
  const rows = regRows(d, W);
  const payWeek = c.payouts.find(p => p.week === W);
  if (rows.length > 1) {
    const sorted = [...rows].sort((a, b) => b.points - a.points);
    const top = sorted[0];
    const allScores = Object.values(d.teams).flatMap(t => Object.entries(t.scores).filter(([w]) => +w < d.playoffStart).map(([, p]) => p)).sort((a, b) => b - a);
    const rank = allScores.indexOf(top.points) + 1;
    out.push({ s: 40 + (rank === 1 ? 25 : 0), k: payWeek ? `High score · ${usd(payWeek.each)}` : 'High score',
      h: `${N(top.roster_id)} put up ${f2(top.points)}, the best score of Week ${W}`,
      p: `${rank === 1 ? 'That is the highest score of the season so far.' : `The ${ord(rank)}-best score of the season.`} ${N(sorted[1].roster_id)} was next at ${f2(sorted[1].points)}.` });
  }
  if (W >= 3) for (const g of games) {
    const [win, lose, a, bb] = winLose(g);
    // Same model as the playoff odds: last week's simulation of this week. Season averages are the fallback.
    const p = power.prevOdds?.firstWeek === W && power.prevOdds.pair[win] ? power.prevOdds.pair[win].p : preWeekProb(d, W, win, lose);
    if (p < 0.38) out.push({ s: 60 + (0.5 - p) * 100, k: 'Upset', h: `${N(win)} upset ${N(lose)}`,
      p: `Given a ${pct(p)} chance before kickoff, ${N(win)} won ${f2(a)}–${f2(bb)}.` });
  }
  if (games.length) {
    const blow = games.reduce((x, y) => margin(y) > margin(x) ? y : x);
    const [w1, l1, a1, b1] = winLose(blow);
    if (margin(blow) >= 35) out.push({ s: 28 + margin(blow) / 4, k: 'Blowout', h: `${N(w1)} ran ${N(l1)} off the field`, p: `${f2(a1)}–${f2(b1)}, a ${f1(margin(blow))}-point margin.` });
    const close = games.reduce((x, y) => margin(y) < margin(x) ? y : x);
    const [w2, l2, a2, b2] = winLose(close);
    if (margin(close) < 6) out.push({ s: 45 + (6 - margin(close)) * 3, k: 'Photo finish', h: `${N(w2)} edged ${N(l2)} by ${f2(margin(close))}`, p: `Final: ${f2(a2)}–${f2(b2)}.` });
  }
  if (lu) {
    const bl = lu.blunders.filter(x => x.w === W).sort((a, b) => b.left - a.left)[0];
    if (bl) out.push({ s: 55 + bl.left / 4, k: 'Bench blunder', h: `${N(bl.id)} lost with the winning points on the bench`,
      p: `Their best possible lineup would have scored ${f2(bl.opt)}. ${N(bl.opp)} scored ${f2(bl.oppPts)}. ${f1(bl.left)} points sat on the bench.` });
    const mvp = lu.benchMvp[W];
    if (mvp && mvp.pts >= 15 && players) out.push({ s: 32 + mvp.pts / 3, k: 'Wasted', h: `${esc(players[mvp.pid]?.n || 'A benched player')} scored ${f1(mvp.pts)} on ${N(mvp.id)}'s bench`,
      p: `The highest-scoring benched player of Week ${W}.` });
  }
  if (power.prevOdds && !power.odds.final) {
    const sw = Object.keys(d.teams).map(Number).map(id => ({ id, dp: power.odds.made[id] - power.prevOdds.made[id] })).sort((a, b) => Math.abs(b.dp) - Math.abs(a.dp))[0];
    if (sw && Math.abs(sw.dp) >= 0.1) {
      const t = d.teams[sw.id];
      out.push({ s: 40 + Math.abs(sw.dp) * 60, k: 'Playoff race', h: `${N(sw.id)}'s playoff odds ${sw.dp > 0 ? 'climbed' : 'fell'} to ${oddsTxt(power.odds, sw.id)}`,
        p: `${sw.dp > 0 ? 'Up' : 'Down'} ${Math.round(Math.abs(sw.dp) * 100)} points after Week ${W}. Now ${t.totW}-${t.totL}.` });
    }
  }
  if (power.history.length > 1) {
    const cur = power.history.at(-1).rows, prev = power.history.at(-2).rows;
    const mv = cur.map(r => ({ r, m: (prev.find(z => z.id === r.id)?.rank ?? r.rank) - r.rank })).sort((a, b) => b.m - a.m)[0];
    if (mv && mv.m >= 3) out.push({ s: 30 + mv.m * 3, k: 'Power rankings', h: `${N(mv.r.id)} jumped ${mv.m} spots to No. ${mv.r.rank}`, p: `Power score: ${f1(mv.r.score)}.` });
  }
  const rich = [...c.list].sort((a, b) => b.winnings - a.winnings)[0];
  if (rich && rich.highs >= 2) out.push({ s: 22 + rich.highs * 3, k: 'The money', h: `${N(rich.id)} has banked ${usd(rich.winnings)} in weekly high scores`,
    p: `${rich.highs} weekly wins so far. Nobody else has more than ${Math.max(0, ...c.list.filter(t => t !== rich).map(t => t.highs))}.` });
  return out.sort((a, b) => b.s - a.s);
}

// ============================== RENDER HELPERS ==============================
const teamCell = (t, sub = true) => `<span class="team">${t.avatar
  ? `<img src="${esc(t.avatar)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'ph'}))">`
  : '<span class="ph"></span>'}<span><span class="nm">${esc(t.name)}</span>${sub && t.owner !== t.name ? `<br><span class="own">${esc(t.owner)}</span>` : ''}</span></span>`;
const sec = (title, dek, body) => `<section class="sec"><div class="sec-h"><h2>${title}</h2>${dek ? `<span class="dek">${dek}</span>` : ''}</div>${body}</section>`;
const bar = (p, cls = '') => `<div class="bar ${cls}"><i style="width:${Math.max(0, Math.min(1, p)) * 100}%"></i></div>`;
const rec = t => `${t.totW}-${t.totL}`;
// Method detail lives behind a "How this works" toggle; `key` keeps it open across live refreshes.
const how = (key, ...paras) => `<details class="how" data-k="${key}"><summary>How this works</summary>${paras.filter(Boolean).map(p => `<p>${p}</p>`).join('')}</details>`;
function setLoading(msg) { $('#app').innerHTML = `<div class="loading">${esc(msg)}</div>`; }

// ============================== STRIP & MAST ==============================
function renderChrome(b) {
  const { d, power } = b;
  $('#title').textContent = d.league.name;
  const today = new Date().toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
  const wk = d.complete ? 'Final edition' : d.liveWeek ? `Week ${d.liveWeek}` : d.weeks.length ? `After week ${d.weeks.at(-1)}` : 'Preseason';
  $('#dateline').textContent = `${d.league.season} season · ${wk} · ${today}`;
  $('#motto').textContent = `${Object.keys(d.teams).length} teams, ${d.leagueAvg ? 'two games a week, ' : ''}${usd(CONFIG.highScorePayout)} to the week's top score.`;
  $('#updated').textContent = b.updated ? `Updated ${b.updated.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}` : '';
  const mine = $('#mine'), uid = myUid();
  mine.innerHTML = '<option value="">My team…</option>' + Object.values(d.teams).filter(t => t.uid).sort((x, y) => x.name.localeCompare(y.name))
    .map(t => `<option value="${esc(t.uid)}">${esc(t.name)}</option>`).join('');
  mine.value = Object.values(d.teams).some(t => t.uid === uid) ? uid : '';
  // Scoreboard: live week, else next week, else last completed week
  const w = d.liveWeek || d.remaining[0] || d.weeks.at(-1), mode = d.liveWeek ? 'live' : d.remaining[0] ? 'next' : 'final';
  const rows = regRows(d, w), pairs = pairsOf(rows);
  const odds = power?.odds;
  const anyPts = rows.some(r => r.points > 0);
  const label = mode === 'live' ? `Week ${w} <b>Live</b>` : mode === 'next' ? `Week ${w} <b>Next</b>` : `Week ${w} <b>Final</b>`;
  $('#strip').innerHTML = pairs.length ? `<div class="tag">${label}</div>` + pairs.map(([a, bb]) => {
    const scored = anyPts || mode === 'final';
    const val = r => scored ? f2(r.points ?? 0) : (odds?.firstWeek === w && odds.pair[r.roster_id] ? pct(odds.pair[r.roster_id].p) : '');
    const leadA = scored ? a.points >= bb.points : (odds?.pair[a.roster_id]?.p ?? 0.5) >= 0.5;
    return `<div class="game"><div class="r ${leadA ? 'ahead' : ''}"><span title="${esc(d.teams[a.roster_id].name)}">${esc(d.teams[a.roster_id].name)}</span><span>${val(a)}</span></div>
      <div class="r ${!leadA ? 'ahead' : ''}"><span title="${esc(d.teams[bb.roster_id].name)}">${esc(d.teams[bb.roster_id].name)}</span><span>${val(bb)}</span></div></div>`;
  }).join('') : '';
  document.querySelectorAll('#tabs a').forEach(a => {
    const on = a.dataset.tab === state.tab;
    a.classList.toggle('on', on);
    if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
}

// ============================== TABS ==============================
function tabFront(b) {
  const { d, c, power, heads } = b;
  if (!power) return sec('Front page', '', `<p class="lead"><span class="dek">The season hasn't kicked off yet. Check back after Week 1.</span></p>`);
  const [lead, ...rest] = heads;
  const odds = power.odds;
  const byOdds = [...c.list].sort((x, y) => odds.made[y.id] - odds.made[x.id] || y.totW - x.totW);
  const race = `<table class="race">${byOdds.map((t, i) => `<tr data-tid="${t.id}" class="${i === odds.seeds - 1 ? 'cut' : ''}">
    <td>${esc(t.name)} <span class="muted">${rec(t)}</span></td><td class="p">${oddsTxt(odds, t.id)}</td><td class="b">${bar(odds.made[t.id])}</td></tr>`).join('')}</table>`;
  const maxChamp = odds.champ ? Math.max(...Object.values(odds.champ)) : 1;
  const titleBlock = odds.champ ? `<div class="block"><span class="label">Title odds</span><table class="race">${[...c.list].sort((x, y) => odds.champ[y.id] - odds.champ[x.id]).slice(0, 5)
    .map(t => `<tr data-tid="${t.id}"><td>${esc(t.name)}</td><td class="p">${pct(odds.champ[t.id])}</td><td class="b">${bar(odds.champ[t.id] / maxChamp, 'gold')}</td></tr>`).join('')}</table></div>` : '';
  const front = `${myTeamCard(b)}<div class="cols">
    <div>
      ${lead ? `<article class="lead"><div class="kicker">${lead.k}</div><h3>${lead.h}</h3><p class="dek">${lead.p}</p>
        <div class="byline">Week ${power.last} in review</div></article>` : ''}
      <div class="briefs">${rest.slice(0, 6).map(x => `<div class="brief"><div class="kicker">${x.k}</div><h4>${x.h}</h4><p>${x.p}</p></div>`).join('')}</div>
    </div>
    <aside class="side">
      <div class="block"><span class="label">The playoff race</span>${race}
        <div class="note">${odds.final ? 'Final regular-season seeding.' : `Top ${odds.seeds} make it. Odds are on the <a href="#rankings">Rankings</a> tab.`}</div></div>
      ${titleBlock}
    </aside>
  </div>`;
  return front + stakesSection(b) + superlatives(b);
}

// A short card for the viewer's own team, picked with "My team" in the header.
function myTeamCard(b) {
  const { d, c, power } = b;
  const t = myTeam(d);
  if (!t || !power) return '';
  const odds = power.odds, place = c.list.indexOf(t) + 1;
  const stat = (k, v, s = '') => `<div class="stat"><div class="label">${k}</div><div class="v">${v}</div>${s ? `<div class="s">${s}</div>` : ''}</div>`;
  const items = [stat('Record', rec(t), `${ord(place)} place`)];
  if (!odds.final) {
    const dp = power.prevOdds ? odds.made[t.id] - power.prevOdds.made[t.id] : 0;
    items.push(stat('Playoffs', oddsTxt(odds, t.id), Math.abs(dp) >= 0.005 ? `${dp > 0 ? 'Up' : 'Down'} ${Math.round(Math.abs(dp) * 100)} since last week` : ''));
    if (odds.champ) items.push(stat('Title', pct(odds.champ[t.id])));
  }
  const pair = odds.pair[t.id];
  if (pair) {
    const rows = regRows(d, odds.firstWeek), pts = id => rows.find(r => r.roster_id === id)?.points ?? 0;
    const live = d.liveWeek === odds.firstWeek && (pts(t.id) > 0 || pts(pair.opp) > 0), m = odds.firstModel;
    const final = live && m?.live?.[t.id] && m?.live?.[pair.opp] && m.sd[t.id] < 0.5 && m.sd[pair.opp] < 0.5;
    const status = pair.p >= 0.999 ? (final ? 'won' : 'all but won') : pair.p <= 0.001 ? (final ? 'lost' : 'all but lost') : `${pct(pair.p)} to win`;
    items.push(stat(`Week ${odds.firstWeek}`, live ? `${f2(pts(t.id))}–${f2(pts(pair.opp))}` : `${pct(pair.p)} to win`,
      `vs ${esc(d.teams[pair.opp].name)}${live ? ` · ${status}` : ''}`));
  }
  items.push(stat('Money', usd(t.winnings), `${t.highs} weekly high${t.highs === 1 ? '' : 's'}`));
  return `<section class="mine" aria-label="My team"><div class="label">My team</div><div style="font: 700 22px/1.2 var(--serif); margin-top: 4px">${esc(t.name)}</div>
    <div class="row">${items.join('')}</div></section>`;
}

function stakesSection(b) {
  const { d, power } = b;
  const odds = power.odds;
  if (!odds.firstWeek || !odds.firstPairs.length) return '';
  const w = odds.firstWeek, rows = regRows(d, w), m = odds.firstModel;
  const ptsOf = id => rows.find(r => r.roster_id === id)?.points ?? 0;
  const live = d.liveWeek === w && rows.some(r => r.points > 0);
  const started = (a, b2) => live && (ptsOf(a) > 0 || ptsOf(b2) > 0);
  // Expected movement in both teams' playoff odds: the win/loss swing times 2p(1-p), so a close game with a lot
  // riding on it beats a lopsided one. Taken from pre-kickoff odds so the order holds while games are played.
  const pre = power.preKick || odds;
  const swing = id => (pre.cond[id]?.win ?? 0) - (pre.cond[id]?.lose ?? 0);
  const games = odds.firstPairs.map(([a, bb]) => { const p = pre.pair[a]?.p ?? 0.5;
    return { a, b: bb, lev: 2 * p * (1 - p) * (swing(a) + swing(bb)) }; }).sort((x, y) => y.lev - x.lev);
  const ifTxt = (id, decided) => {
    if (odds.clinched.has(id)) return 'Playoffs: clinched';
    if (odds.eliminated.has(id)) return 'Playoffs: eliminated';
    const k = odds.cond[id];
    const med = k?.med != null ? `Top-half score: <b>${pct(k.med)}</b><br>` : '';
    // Once the head-to-head game is settled, the what-ifs collapse to the current odds.
    if (decided || !k || k.win == null || k.lose == null) return `${med}Playoff odds: <b>${oddsTxt(odds, id)}</b>`;
    const shown = k.rec.map((r, n) => ({ ...r, n })).filter(r => r.p >= 0.005 && r.made != null);
    if (shown.every(r => r.made >= 0.995)) return `${med}Playoffs: all but locked either way`;
    if (shown.every(r => r.made < 0.005)) return `${med}Playoffs: a long shot either way`;
    if (k.med == null) return `Playoffs: <b>${pct(k.win)}</b> with a win · <b>${pct(k.lose)}</b> with a loss`;
    const label = n => ['lose both', 'split', 'win both'][n];
    return `${med}Playoffs if they ${shown.slice().reverse().map(r => `${label(r.n)}: <b>${pct(r.made)}</b>`).join(' · ')}`;
  };
  const row = (g, i) => {
    const pa = odds.pair[g.a].p, A = d.teams[g.a], B = d.teams[g.b];
    const decided = live && (pa >= 0.999 || pa <= 0.001);
    const final = decided && m?.live?.[g.a] && m?.live?.[g.b] && m.sd[g.a] < 0.5 && m.sd[g.b] < 0.5;
    const mid = decided
      ? `<div class="pp"><span>${f2(ptsOf(g.a))}</span><span>${f2(ptsOf(g.b))}</span></div>
         <div class="done">${final ? 'Final' : 'All but over'} · ${esc((pa >= 0.5 ? A : B).name)} ${final ? 'won' : 'leads'}</div>`
      : `<div class="pp"><span>${pct(pa)}</span><span>${pct(1 - pa)}</span></div>
         <div class="split"><i style="width:${pa * 100}%"></i><i style="width:${(1 - pa) * 100}%"></i></div>
         <div class="live">Win chance${m ? ` · projected ${f1(m.mu[g.a])}–${f1(m.mu[g.b])}` : ''}</div>
         ${started(g.a, g.b) ? `<div class="live">Live: ${f2(ptsOf(g.a))} – ${f2(ptsOf(g.b))}</div>` : ''}`;
    return `<div class="stake ${i === 0 ? 'gotw' : ''}">${i === 0 ? '<div class="gotw-tag">Game of the week</div>' : ''}
      <div class="side-a">${teamCell(A, false)}<div class="if">${ifTxt(g.a, decided)}</div></div>
      <div class="mid">${mid}</div>
      <div>${teamCell(B, false)}<div class="if">${ifTxt(g.b, decided)}</div></div>
    </div>`;
  };
  const dek = `Biggest games first.${d.leagueAvg ? ' Every team also plays the league median: a top-half score is a second win.' : ''}`;
  return sec(`Week ${w}: what's at stake`, dek, games.map(row).join('') + how('stakes',
    `The big percentages are each team's chance to win its matchup, from the same ${CONFIG.sims.toLocaleString()} simulations as the playoff race.`,
    d.leagueAvg && '"Top-half score" is the chance of finishing in the top half of all scores this week, which counts as a second win. "Playoffs if they win both / split / lose both" are the playoff odds after each possible result this week.',
    'Games are ordered by how much they\'re expected to move both teams\' playoff odds: what\'s riding on the result, times how close the game is. The order is set from the odds before kickoff, so it doesn\'t shuffle as scores come in.',
    m && `Projections use each team's actual Week ${w} lineup and Sleeper's player projections${live ? ', with points from finished games locked in, so win chances update as games are played' : ''}.`));
}

function superlatives(b) {
  const { d, c } = b;
  const T = id => d.teams[id];
  const all = c.list.flatMap(t => Object.entries(t.scores).map(([w, p]) => ({ t, w: +w, p }))).filter(x => x.w < d.playoffStart && x.p > 0);
  if (!all.length) return '';
  const best = all.reduce((x, y) => y.p > x.p ? y : x), worst = all.reduce((x, y) => y.p < x.p ? y : x);
  const items = [['Season high', f2(best.p), `${best.t.name}, week ${best.w}`], ['Season low', f2(worst.p), `${worst.t.name}, week ${worst.w}`]];
  if (c.games.length) {
    const blow = c.games.reduce((x, y) => margin(y) > margin(x) ? y : x), close = c.games.reduce((x, y) => margin(y) < margin(x) ? y : x);
    let [w, l, a, bb] = winLose(blow); items.push(['Biggest blowout', `+${f1(margin(blow))}`, `${T(w).name} over ${T(l).name}, ${f2(a)}–${f2(bb)}, week ${blow.week}`]);
    [w, l, a, bb] = winLose(close); items.push(['Closest game', f2(margin(close)), `${T(w).name} over ${T(l).name}, ${f2(a)}–${f2(bb)}, week ${close.week}`]);
  }
  const lucky = [...c.list].sort((x, y) => y.luck - x.luck)[0], unlucky = [...c.list].sort((x, y) => x.luck - y.luck)[0];
  items.push(['Luckiest', `+${f1(lucky.luck)} wins`, `${lucky.name}: ${lucky.w}-${lucky.l} head to head, but ${lucky.apW}-${lucky.apL} against the whole league`]);
  items.push(['Unluckiest', `${f1(unlucky.luck)} wins`, `${unlucky.name}: ${unlucky.w}-${unlucky.l} head to head, but ${unlucky.apW}-${unlucky.apL} against the whole league`]);
  return sec('Season superlatives', 'Regular season', `<div class="sup">${items.map(([k, v, dd]) => `<div><div class="label">${k}</div><div class="v">${v}</div><div class="d">${esc(dd)}</div></div>`).join('')}</div>`);
}

function tabRankings(b) {

  const cur = history.at(-1).rows, prev = history.length > 1 ? history.at(-2).rows : null;

    const po = odds.made[r.id], dp = prevOdds ? po - prevOdds.made[r.id] : 0;
    const dTxt = Math.abs(dp) < 0.005 ? '<span class="muted">0</span>' : `<span class="${dp > 0 ? 'up' : 'down'}">${dp > 0 ? '+' : '−'}${Math.round(Math.abs(dp) * 100)}</span>`;
    return `<tr data-team="${r.id}" data-tid="${r.id}" tabindex="0"><td class="l"><span class="rk">${r.rank}</span>${teamCell(t)}</td><td class="opt">${move}</td>

      ${showD ? `<td class="opt">${dTxt}</td>` : ''}${odds.byes ? `<td class="opt">${pct(odds.bye[r.id], odds.final)}</td>` : ''}${odds.champ ? `<td>${pct(odds.champ[r.id])}</td>` : ''}</tr>`;
  }).join('');
  const table = `<div class="scroll"><table class="t">
    <tr><th class="l">Team</th><th class="opt">Move</th><th class="opt">Power</th><th>Record</th><th class="opt">Last 3 avg</th><th>Playoffs</th>${showD ? '<th class="opt" title="Change in playoff odds since last week, in percentage points">Change</th>' : ''}${odds.byes ? '<th class="opt">Bye</th>' : ''}${odds.champ ? '<th>Title</th>' : ''}</tr>
    ${rows}</table></div>
    <div class="note">${odds.final ? 'The regular season is over, so the playoff and bye columns show the final result.'
      : `Playoff odds come from ${CONFIG.sims.toLocaleString()} simulations of the rest of the season. The top ${odds.seeds} make it${odds.byes ? ` and the top ${odds.byes} get a first-round bye` : ''}.`}</div>`
    + how('rankings',
      `Power is a 0–100 score: season all-play win rate (50%), the last three weeks of all-play (25%) and actual record including median games (25%). All-play is your record if you'd played every team every week.`,
      showD && '"Change" is how much a team\'s playoff odds moved since last week, in percentage points.',
      !odds.final && `Each simulation plays out the real remaining schedule${d.leagueAvg ? ', counting both weekly games: the head-to-head matchup and the league median (a top-half score wins)' : ''}. Seeds go by total wins, then points for. "Clinched" and "Eliminated" are mathematically certain. Title odds play each simulated season through Sleeper's playoff bracket${odds.playoffProj ? ', using each team\'s projected lineup for that playoff week' : ''}.`,
      !odds.final && (odds.usesProj
        ? `A team's expected score each week is ${Math.round(PROJ_WEIGHT * 100)}% its Sleeper projection (its best lineup from the current roster; this week, its actual lineup with finished games locked in) and ${Math.round(100 - PROJ_WEIGHT * 100)}% its season scoring average. Scores vary about ${WEEKLY_SD} points week to week, and each simulated season also gives every team a lasting shift, typically within ${TEAM_SD} points either way, since a roster can beat or miss its projections all year. That mix forecast best when tested on the league's 2020–2025 seasons. Projections can't see future trades or pickups.`
        : 'Sleeper projections were unavailable, so each team scores around its season average, blended heavily with the league average (the setting that tested best on the league\'s 2020–2025 seasons).'));
  return sec('Power rankings', `After week ${power.last}`, table) + sec('The climb', 'Power rank after each week. Tap a team to follow it.', bumpChart(d, power));
}

function bumpChart(d, power) {
  const { history } = power;
  const n = Object.keys(d.teams).length;
  const rowH = 27, padT = 14, padB = 28, padL = 30, padR = 190;
  const colW = Math.max(56, Math.min(100, 760 / Math.max(1, history.length - 1)));
  const W = padL + padR + colW * Math.max(1, history.length - 1), H = padT + padB + rowH * (n - 1);
  const x = i => padL + i * colW, y = r => padT + (r - 1) * rowH;
  const series = Object.keys(d.teams).map(id => ({ id: +id, pts: history.map((h, i) => {
    const r = h.rows.find(z => z.id === +id); return r ? { i, w: h.w, r: r.rank, s: r.score } : null; }).filter(Boolean) }));
  const grid = range(1, n).map(k => `<text x="${padL - 12}" y="${y(k) + 4}" class="ax" text-anchor="end">${k}</text>`).join('')
    + history.map((h, i) => `<line x1="${x(i)}" x2="${x(i)}" y1="${padT - 8}" y2="${H - padB + 6}" class="gl"/><text x="${x(i)}" y="${H - 6}" class="ax" text-anchor="middle">W${h.w}</text>`).join('');
  const lines = series.map(s => {
    const path = s.pts.map((p, k) => `${k ? 'L' : 'M'}${x(p.i)},${y(p.r)}`).join('');
    const end = s.pts.at(-1);
    return `<g class="bl" data-id="${s.id}"><path d="${path}" class="hit"/><path d="${path}" class="ln"/>
      ${s.pts.map(p => `<circle cx="${x(p.i)}" cy="${y(p.r)}" r="4" class="pt" data-tip="${esc(d.teams[s.id].name)} · Week ${p.w}: No. ${p.r} (power ${f1(p.s)})"/>`).join('')}
      ${end ? `<text x="${x(end.i) + 12}" y="${y(end.r) + 4}" class="lb">${esc(d.teams[s.id].name)}</text>` : ''}</g>`;
  }).join('');
  const now = history.at(-1).rows.map(r => `${r.rank}. ${d.teams[r.id].name}`).join(', ');
  return `<div class="scroll bump-wrap"><svg class="bump" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(`Power rank by week for each team. Latest: ${now}`)}">${grid}${lines}</svg><div class="tip" hidden></div></div>`;
}
function wireBump() {
  const wrap = document.querySelector('.bump-wrap'); if (!wrap) return;
  const svg = wrap.querySelector('svg'), tip = wrap.querySelector('.tip');
  // On narrow screens, start at the latest weeks so the team labels are in view.
  wrap.scrollLeft = wrap.scrollWidth;
  let pinned = null;
  const focus = id => {
    svg.classList.toggle('focus', id != null);
    svg.querySelectorAll('.bl').forEach(g => g.classList.toggle('on', g.dataset.id === String(id)));
    document.querySelectorAll('tr[data-team]').forEach(tr => tr.classList.toggle('on', tr.dataset.team === String(id)));
  };
  const bind = (el, id) => {
    el.addEventListener('mouseenter', () => pinned == null && focus(id));
    el.addEventListener('mouseleave', () => pinned == null && focus(null));
    el.addEventListener('click', () => { pinned = pinned === id ? null : id; focus(pinned); });
  };
  svg.querySelectorAll('.bl').forEach(g => bind(g, g.dataset.id));
  document.querySelectorAll('tr[data-team]').forEach(tr => {
    bind(tr, tr.dataset.team);
    tr.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tr.click(); } });
  });
  svg.querySelectorAll('.pt').forEach(c => {
    c.addEventListener('mouseenter', () => {
      tip.textContent = c.dataset.tip; tip.hidden = false;
      const r = c.getBoundingClientRect(), wr = wrap.getBoundingClientRect();
      tip.style.left = (r.left - wr.left + wrap.scrollLeft + 10) + 'px'; tip.style.top = (r.top - wr.top - 32) + 'px';
    });
    c.addEventListener('mouseleave', () => tip.hidden = true);
  });
}

function tabStandings(b) {

    ${c.list.map((t, i) => `<tr data-tid="${t.id}" class="${i === seeds - 1 ? 'cut' : ''}"><td class="l"><span class="rk">${i + 1}</span>${teamCell(t)}</td>

  </table></div><div class="note">The heavy line is the playoff cut (top ${seeds}).</div>`
    + how('standings',

      d.leagueAvg && '"vs Median" is the second weekly game: a top-half score that week is a win.',
      '"All-play" is your record if you\'d played every team every week. "Luck" is how many more (or fewer) head-to-head wins you have than that all-play rate predicts: positive means your opponents happened to have off weeks.');

  const ids = c.list.map(t => t.id);
  const maxW = Math.max(1, ...ids.flatMap(a => ids.map(bb => sw[a][bb].w)));

    ${ids.map(a => `<tr data-tid="${a}"><td class="l">${esc(d.teams[a].name)}</td>${ids.map(bb => { const v = sw[a][bb];
      return `<td class="${a === bb ? 'self' : ''}" style="background:color-mix(in srgb, var(--accent) ${Math.round(v.w / maxW * 42)}%, transparent)" title="${esc(d.teams[a].name)} with ${esc(d.teams[bb].name)}'s schedule: ${v.w}-${v.l}">${v.w}-${v.l}</td>`; }).join('')}
      <td>${f1(avgSwap(a))}</td></tr>`).join('')}
  </table></div><div class="note">Each row is a team's head-to-head record if it had played the column team's schedule. Outlined cells are the real schedule. Median games don't depend on the schedule, so they're left out.</div>` : '';

  const weeks = d.weeks.filter(w => c.weekStats[w]);

  return sec('Standings', 'Regular season', standings) + (swap ? sec('Schedule swap', 'What if you\'d had someone else\'s schedule?', swap) : '') + sec('Every score', '', grid);

        ${s.got.map(g => `<li><b>${esc(g.name)}</b> <span class="muted">${esc(g.meta)} · ${f1(g.pts)} pts</span></li>`).join('')}
        ${s.picks.map(p => `<li>${esc(p)}</li>`).join('')}${s.faab ? `<li>${usd(s.faab)} FAAB</li>` : ''}
        ${!s.got.length && !s.picks.length && !s.faab ? '<li class="muted">Nothing</li>' : ''}</ul></div>`; }).join('')}</div></div>`).join('')
    : '<p class="muted" style="font: italic 17px var(--serif)">No trades yet this season. The phones are open.</p>');
  return html;
}

// ============================== HISTORY ==============================
// Every season loads in parallel. A season that fails is left out and flagged, rather than breaking the tab.
async function loadHistory() {
  if (state.history) return state.history;
  await state.chainDone;
  const all = await Promise.all(state.chain.map(async x => {
    if (state.cache[x.id]) return state.cache[x.id];
    try { const d = await load(x.id, { light: true, league: x.league }); return { d, c: compute(d) }; }
    catch (e) { console.warn('history', x.season, e); return null; }
  }));
  const seasons = all.filter(Boolean);
  seasons.missing = all.length - seasons.length + seasons.filter(s => s.d.failed).length;
  state.history = seasons;
  return seasons;
}

function tabHistory(seasons) {
  const cur = state.cur.d;
  const latest = {};
  for (const { d } of [...seasons].reverse()) for (const t of Object.values(d.teams)) if (t.uid) latest[t.uid] = { name: t.name, owner: t.owner };
  const who = uid => latest[uid]?.name || 'Former manager';
  // Old seasons show each manager's current name, with the name they used that year alongside.
  const nm = t => !t ? '<span class="muted">–</span>' : !t.uid || who(t.uid) === t.name ? esc(t.name)
    : `${esc(who(t.uid))} <span class="muted">(as ${esc(t.name)})</span>`;
  const byUid = {};
  const rowFor = uid => byUid[uid] ||= { uid, seasons: 0, titles: 0, finals: 0, playoffs: 0, w: 0, l: 0, t: 0, mw: 0, ml: 0, pf: 0, games: 0, highs: 0 };
  const records = [], results = [], h2h = {}, trophies = [];
  for (const { d, c } of seasons) {
    const seeds = d.league.settings.playoff_teams || 6;
    const done = d.complete;
    c.list.forEach((t, i) => {
      if (!t.uid) return;
      const r = rowFor(t.uid);
      r.seasons++; r.w += t.w; r.l += t.l; r.t += t.t; r.mw += t.mw; r.ml += t.ml; r.pf += t.pf; r.highs += t.highs;
      r.games += Object.keys(t.scores).filter(w => +w < d.playoffStart).length;
      if (done && i < seeds) r.playoffs++;
    });
    if (done && d.champion != null && d.teams[d.champion]?.uid) { rowFor(d.teams[d.champion].uid).titles++; rowFor(d.teams[d.champion].uid).finals++; }
    if (done && d.runnerUp != null && d.teams[d.runnerUp]?.uid) rowFor(d.teams[d.runnerUp].uid).finals++;
    for (const t of c.list) for (const [w, p] of Object.entries(t.scores)) if (+w < d.playoffStart && p > 0) records.push({ season: d.league.season, w: +w, p, t });
    for (const g of c.games) {
      const A = d.teams[g.a], B = d.teams[g.b];
      const [win, lose, a, bb] = g.pa >= g.pb ? [A, B, g.pa, g.pb] : [B, A, g.pb, g.pa];
      results.push({ season: d.league.season, w: g.week, win, lose, m: a - bb });
      if (A.uid && B.uid) {
        const k1 = (h2h[A.uid] ||= {}), k2 = (h2h[B.uid] ||= {});
        k1[B.uid] ||= { w: 0, l: 0 }; k2[A.uid] ||= { w: 0, l: 0 };
        if (g.pa > g.pb) { k1[B.uid].w++; k2[A.uid].l++; } else if (g.pb > g.pa) { k2[A.uid].w++; k1[B.uid].l++; }
      }
    }
    trophies.push({ season: d.league.season, done, champ: d.champion != null ? d.teams[d.champion] : null, ru: d.runnerUp != null ? d.teams[d.runnerUp] : null,
      top: c.list[0], most: [...c.list].sort((x, y) => y.pf - x.pf)[0], last: c.list.at(-1), money: [...c.list].sort((x, y) => y.highs - x.highs)[0] });
  }

  const trophyTable = `<div class="scroll"><table class="t wrapcells">
    <tr><th class="l">Season</th><th class="l">Champion</th><th class="l">Runner-up</th><th class="l">Best record</th><th class="l">Most points</th><th class="l">Most weekly highs</th><th class="l">Last place</th></tr>
    ${trophies.map(x => `<tr><td class="l strong">${esc(x.season)}</td>
      <td class="l">${x.done ? (x.champ ? `<span class="money">★</span> <b>${nm(x.champ)}</b>` : '–') : '<span class="muted">In progress</span>'}</td><td class="l">${x.done ? nm(x.ru) : ''}</td>
      <td class="l">${nm(x.top)} <span class="muted">${rec(x.top)}</span></td><td class="l">${nm(x.most)} <span class="muted">${f2(x.most.pf)}</span></td>
      <td class="l">${nm(x.money)} <span class="muted">${x.money.highs}</span></td><td class="l">${x.done ? nm(x.last) : '<span class="muted">TBD</span>'}</td></tr>`).join('')}
  </table></div>`;

  const winPct = r => (r.w + r.mw) / Math.max(1, r.w + r.l + r.mw + r.ml);
  const all = Object.values(byUid).filter(r => latest[r.uid]).sort((a, b) => b.titles - a.titles || winPct(b) - winPct(a));
  const allTime = `<div class="scroll"><table class="t">
    <tr><th class="l">Manager</th><th>Seasons</th><th>Titles</th><th>Finals</th><th>Playoffs</th><th>Record</th><th>Win %</th><th>H2H</th><th>Points / game</th><th>Weekly highs</th></tr>
    ${all.map(r => { const gw = r.w + r.mw, gl = r.l + r.ml; return `<tr data-uid="${esc(r.uid)}"><td class="l"><b>${esc(who(r.uid))}</b> <span class="muted">${esc(latest[r.uid].owner)}</span></td>
      <td>${r.seasons}</td><td class="${r.titles ? 'money' : 'muted'}">${r.titles ? '★'.repeat(r.titles) : '0'}</td><td>${r.finals}</td><td>${r.playoffs}</td>
      <td class="strong">${gw}-${gl}</td><td>${(winPct(r) * 100).toFixed(1)}%</td><td>${r.w}-${r.l}${r.t ? '-' + r.t : ''}</td>
      <td>${f2(r.pf / Math.max(1, r.games))}</td><td>${r.highs}</td></tr>`; }).join('')}
  </table></div><div class="note">Regular-season records across all ${seasons.length} seasons on Sleeper, including the one in progress. Playoff appearances and finals count finished seasons only.</div>`;

  records.sort((a, b) => b.p - a.p);
  results.sort((a, b) => b.m - a.m);
  const close = [...results].sort((a, b) => a.m - b.m);
  const list = (title, rows) => `<div><div class="sub-h">${title}</div><div class="scroll"><table class="t">${rows}</table></div></div>`;
  const scoreRow = r => `<tr><td class="l wrap">${nm(r.t)}</td><td class="muted">${esc(r.season)} W${r.w}</td><td class="strong">${f2(r.p)}</td></tr>`;
  const gameRow = (g, v) => `<tr><td class="l wrap">${nm(g.win)} over ${nm(g.lose)}</td><td class="muted">${esc(g.season)} W${g.w}</td><td class="strong">${v}</td></tr>`;
  const recs = `<div class="cols even">
    ${list('Highest scores', records.slice(0, 6).map(scoreRow).join(''))}
    ${list('Lowest scores', records.slice(-6).reverse().map(scoreRow).join(''))}
    ${list('Biggest blowouts', results.slice(0, 6).map(g => gameRow(g, `+${f1(g.m)}`)).join(''))}
    ${list('Closest games', close.slice(0, 6).map(g => gameRow(g, f2(g.m))).join(''))}
  </div>`;

  const uids = Object.values(cur.teams).map(t => t.uid).filter(Boolean);
  const cell = (a, b) => h2h[a]?.[b];
  const rivalry = `<div class="scroll"><table class="t mx">
    <tr><th class="l">Manager ↓ &nbsp; vs →</th>${uids.map(u => `<th class="vert">${esc(who(u))}</th>`).join('')}</tr>
    ${uids.map(a => `<tr data-uid="${esc(a)}"><td class="l">${esc(who(a))}</td>${uids.map(bb => {
      if (a === bb) return '<td class="muted">·</td>';
      const v = cell(a, bb); if (!v || !(v.w + v.l)) return '<td class="muted">–</td>';
      const p = v.w / (v.w + v.l), tint = p > 0.5 ? `color-mix(in srgb, var(--accent) ${Math.round((p - 0.5) * 80)}%, transparent)` : p < 0.5 ? `color-mix(in srgb, var(--down) ${Math.round((0.5 - p) * 80)}%, transparent)` : 'transparent';
      return `<td style="background:${tint}" title="${esc(who(a))} vs ${esc(who(bb))}: ${v.w}-${v.l}">${v.w}-${v.l}</td>`; }).join('')}</tr>`).join('')}
  </table></div><div class="note">All-time regular-season head-to-head. Purple means the row manager leads the series; red means they trail.</div>`;
  let top = null;
  for (const a of uids) for (const bb of uids) { const v = cell(a, bb); if (a < bb && v) { const n = v.w + v.l, gap = Math.abs(v.w - v.l);
    if (!top || n > top.n || (n === top.n && gap < top.gap)) top = { a, b: bb, v, n, gap }; } }
  const rivalNote = top ? `<p style="font: 400 18px/1.45 var(--serif); margin: 0 0 12px">The most-played series: <b>${esc(who(top.a))}</b> vs. <b>${esc(who(top.b))}</b>, ${top.v.w}-${top.v.l} over ${top.n} meetings.</p>` : '';

  const warn = seasons.missing ? warnBox('Some past seasons didn\'t fully load from Sleeper, so history may be incomplete.') : '';
  return warn + sec('Trophy case', `${seasons.length} seasons on Sleeper`, trophyTable) + sec('All-time standings', '', allTime) + sec('Record book', 'Regular season, every season', recs) + sec('Rivalries', '', rivalNote + rivalry);
}

// ============================== FLOW ==============================
const warnBox = msg => `<div class="warn" role="status"><span>${esc(msg)}</span><button type="button" data-retry>Try again</button></div>`;

async function analyze(d) {
  const c = compute(d);
  let players = null;
  try { players = await loadPlayers(neededIds(d)); } catch (e) { console.warn('players', e); }
  d.players = players;
  const power = computePower(d);
  const lu = players ? lineups(d, players) : null;
  const b = { d, c, power, players, lu, mv: moves(d, players), sw: swapMatrix(d), updated: new Date() };
  b.heads = headlines(b);
  return b;
}

// Highlight the viewer's team in every table and list.
function markMine() {
  const b = state.cur, t = b && myTeam(b.d), uid = myUid();
  document.querySelectorAll('#app [data-tid]').forEach(el => el.classList.toggle('me', !!t && el.dataset.tid === String(t.id)));
  document.querySelectorAll('#app [data-uid]').forEach(el => el.classList.toggle('me', !!uid && el.dataset.uid === uid));
}

async function renderTab() {
  const b = state.cur; if (!b) return;
  renderChrome(b);
  const t = state.tab;
  if (t === 'history') {
    setLoading(`Digging through ${state.chain.length} seasons of records…`);
    try { const seasons = await loadHistory(); if (state.tab === 'history') { $('#app').innerHTML = tabHistory(seasons); markMine(); } }
    catch (e) { $('#app').innerHTML = `<div class="err">Couldn't load league history: ${esc(e.message)}</div>`; }
    return;
  }
  const warn = b.d.failed ? warnBox('Some data didn\'t load from Sleeper, so a few numbers may be off.') : '';
  $('#app').innerHTML = warn + (t === 'rankings' ? tabRankings(b) : t === 'standings' ? tabStandings(b) : t === 'money' ? tabMoney(b) : t === 'managers' ? tabManagers(b) : tabFront(b));
  if (t === 'rankings') wireBump();
  markMine();
}

async function openSeason(id) {
  setLoading('Fetching the latest from Sleeper…');
  stopLive();
  try {
    let b = state.cache[id];
    if (!b) {
      // The current season is always fetched fresh; past seasons reuse the league record from the season list.
      const d = await load(id, { league: id === state.chain[0]?.id ? null : state.chain.find(x => x.id === id)?.league });
      b = await analyze(d);
      state.cache[id] = b;
      state.history = null;
    }
    state.cur = b;
    await renderTab();
    startLive();
  } catch (e) {
    console.error(e);
    $('#app').innerHTML = `<div class="err">Couldn't load from Sleeper: ${esc(e.message)}</div>`;
  }
}

// ============================== LIVE UPDATES ==============================
// During a live week, re-fetch just that week's matchups every 90 seconds (while the page is visible)
// and redraw the live parts. When Sleeper finalizes the week, reload the whole season.
const LIVE_MS = 90000;
let liveTimer = null;
function stopLive() { clearInterval(liveTimer); liveTimer = null; }
function startLive() {
  stopLive();
  const b = state.cur;
  if (b?.d.liveWeek && b.d.league.league_id === state.chain[0]?.id) liveTimer = setInterval(() => { if (!document.hidden) refreshLive(); }, LIVE_MS);
}
async function refreshLive() {
  const b = state.cur, d = b.d, id = d.league.league_id, w = d.liveWeek;
  try {
    const [lg, rows, games] = await Promise.all([get(`/league/${id}`), get(`/league/${id}/matchups/${w}`), nflGames(d.league.season, w)]);
    if (state.cur !== b) return;
    if ((lg.settings.last_scored_leg || 0) !== (d.league.settings.last_scored_leg || 0) || lg.status !== d.league.status) {
      delete state.cache[id]; state.history = null;
      return openSeason(id);
    }
    d.byWeek[w] = rows;
    if (games) d.games = games;
    b.power = computePower(d); b.heads = headlines(b); b.updated = new Date();
    if (['front', 'rankings', 'money'].includes(state.tab)) {
      const open = [...document.querySelectorAll('#app details[open]')].map(x => x.dataset.k);
      await renderTab();
      open.forEach(k => { const el = document.querySelector(`#app details[data-k="${k}"]`); if (el) el.open = true; });
    } else renderChrome(b);
  } catch (e) { console.warn('live refresh', e); }
}

// ============================== START ==============================
function fillSeasons() {
  $('#season').innerHTML = state.chain.map(x => `<option value="${x.id}">${esc(x.season)}</option>`).join('');
  $('#season').value = state.cur?.d.league.league_id ?? state.chain[0]?.id;
}
// The season list builds in the background, so the current season shows without waiting on older ones.
async function init() {
  $('#season').onchange = e => {
    const x = state.chain.find(s => s.id === e.target.value), url = new URL(location.href);
    if (x && x !== state.chain[0]) url.searchParams.set('season', x.season); else url.searchParams.delete('season');
    history.replaceState(null, '', url);
    openSeason(e.target.value);
  };
  $('#mine').onchange = e => { try { localStorage.setItem(MINE_KEY, e.target.value); } catch {} renderTab(); };
  $('#refresh').onclick = () => { state.cache = {}; state.history = null; openSeason($('#season').value); };
  document.addEventListener('click', e => { if (e.target.closest('[data-retry]')) $('#refresh').click(); });
  window.addEventListener('hashchange', () => { state.tab = tabFromHash(); renderTab(); window.scrollTo(0, 0); });
  try {
    const first = await get(`/league/${CONFIG.leagueId}`);
    state.chain = [{ id: first.league_id, season: first.season, league: first }];
    fillSeasons();
    state.chainDone = seasonChain(first.previous_league_id)
      .then(rest => { state.chain.push(...rest); fillSeasons(); })
      .catch(e => console.warn('season list', e));
    const want = qs.get('season');
    if (want && want !== first.season) {
      await state.chainDone;
      const x = state.chain.find(s => s.season === want);
      if (x) { $('#season').value = x.id; return openSeason(x.id); }
    }
    await openSeason(first.league_id);
  } catch (e) {
    $('#app').innerHTML = `<div class="err">Couldn't reach Sleeper: ${esc(e.message)}</div>`;
  }
}
init();
</script>
