<html lang="en">

<meta property="og:title" content="The League Ledger">
<meta property="og:description" content="Standings, playoff odds, weekly high-score money and league history for our Sleeper fantasy football league.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#171512">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23171512'/%3E%3Ctext x='32' y='47' font-family='Georgia,serif' font-size='42' font-weight='900' text-anchor='middle' fill='%23f3efe6'%3EL%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  /* Color has three jobs: gold is money, purple is you, red/green are up/down. Everything else is ink on paper. */
  :root {
    --paper: #f4f1ea; --paper-2: #ebe6da; --card: #faf8f3; --ink: #1a1814; --ink-2: #433e36; --muted: #6b6455;
    --rule: #1a1814; --hair: #dcd5c5; --hair-2: #bfb6a2; --bar: #4a443b;
    --you: #4b2a7b; --you-bg: #e6dff0; --gold: #845a00; --gold-bar: #d9a62e; --gold-bg: #f5e9c8;
    --up: #2c6a3d; --down: #a3361f;
    --strip: #1a1814; --strip-ink: #f1ece0; --strip-line: rgb(255 255 255 / .14);
    --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
    --cond: "Barlow Condensed", "Arial Narrow", sans-serif;
    --sans: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #14130f; --paper-2: #1e1c18; --card: #1a1915; --ink: #ece6d8; --ink-2: #cbc3b2; --muted: #a0988a;
      --rule: #ece6d8; --hair: #312d27; --hair-2: #4a443b; --bar: #b9b09e;
      --you: #bba3f0; --you-bg: #2a2338; --gold: #e8bc45; --gold-bar: #c99a22; --gold-bg: #2b2516;
      --up: #74c389; --down: #ec8466;
      --strip: #0a0907; --strip-ink: #ece6d8; --strip-line: rgb(255 255 255 / .09);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 var(--sans); }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--you); outline-offset: 2px; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px 64px; overflow-x: clip; }
  [hidden] { display: none !important; }

  /* Scoreboard strip: always dark, in both themes. */
  .strip { background: var(--strip); color: var(--strip-ink); border-bottom: 1px solid var(--strip-line); }
  .strip-in { display: flex; overflow-x: auto; max-width: 1180px; margin: 0 auto; scrollbar-width: none; }
  .strip-in::-webkit-scrollbar { display: none; }
  .strip .tag { flex: none; display: flex; align-items: center; gap: 6px; padding: 0 14px 0 16px; font: 700 13px/1 var(--cond);
                letter-spacing: .1em; text-transform: uppercase; border-right: 1px solid var(--strip-line); }
  .strip .tag b { color: rgb(255 255 255 / .6); }
  .strip .tag b.live { color: #ff7a5c; }
  .game { flex: 1 1 0; min-width: 140px; padding: 7px 12px; font-size: 13px; line-height: 1.35; border-right: 1px solid var(--strip-line); }
  .game .r { display: flex; justify-content: space-between; gap: 10px; opacity: .7; }
  .game .r span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .game .r.ahead { opacity: 1; font-weight: 600; }
  .game .r span:last-child { font-variant-numeric: tabular-nums; }

  /* Header */
  .mast { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px 20px; flex-wrap: wrap; padding: 18px 0 14px; }
  .mast h1 { font: 900 clamp(28px, 4.4vw, 46px)/1 var(--serif); letter-spacing: -0.022em; margin: 0; }
  .mast .meta { font-size: 13px; color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; }
  .mast .meta .live { color: var(--down); font-weight: 600; }
  .mast .meta .live::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: currentColor; margin-right: 5px; vertical-align: 1px; }
  .ctl select, .btn, .sel { font: 500 14px/1 var(--sans); color: var(--ink); background: var(--card); border: 1px solid var(--hair-2);
    border-radius: 6px; min-height: 40px; padding: 0 10px; cursor: pointer; }
  #mine { min-width: 200px; }
  /* A text-style button: "Back to 2026", "Copy recap". */
  .lnk { font: inherit; color: inherit; background: none; border: 0; padding: 0; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
  .lnk.small { font-size: 13px; color: var(--ink-2); min-height: 44px; }
  .t .lnk { min-height: 40px; }
  @media (max-width: 640px) {
    .mast { padding: 12px 0 10px; align-items: stretch; flex-direction: column; gap: 10px; }
    .mast .meta { margin-top: 4px; }
    #mine { width: 100%; }
  }
  nav.tabs { position: sticky; top: 0; z-index: 5; background: var(--paper); display: flex; gap: 6px;
             border-top: 2px solid var(--rule); border-bottom: 1px solid var(--hair-2); }
  nav.tabs a { font: 700 15px/1 var(--cond); letter-spacing: .07em; text-transform: uppercase; color: var(--muted);
               text-decoration: none; padding: 13px 12px 10px; border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap; }
  nav.tabs a:first-child { padding-left: 0; }
  nav.tabs a:hover { color: var(--ink); }
  nav.tabs a.on { color: var(--ink); border-bottom-color: var(--ink); }
  /* Phones: each tab's tap area grows to fill the bar; the underline stays the width of the label. */
  @media (max-width: 640px) {
    nav.tabs { gap: 0; }
    nav.tabs a, nav.tabs a:first-child { flex: 1 1 auto; text-align: center; padding: 0; border-bottom: 0; margin: 0; font-size: 14px; letter-spacing: .04em; }
    nav.tabs a:first-child { text-align: left; }
    nav.tabs a:last-child { text-align: right; }
    nav.tabs a:first-child, nav.tabs a:last-child { flex-grow: .5; }
    nav.tabs a span { display: inline-block; padding: 14px 0 10px; border-bottom: 3px solid transparent; margin-bottom: -1px; }
    nav.tabs a.on span { border-bottom-color: var(--ink); }
  }

  /* Sections */
  .sec { margin-top: 40px; }
  #app > .sec:first-child, #app > .cols:first-child > * > .sec:first-child, #app > .mine + .cols > * > .sec:first-child { margin-top: 24px; }
  @media (min-width: 881px) { #app > .cols:first-child > * > .o:first-child > .sec:first-child, #app > .mine + .cols > * > .o:first-child > .sec:first-child { margin-top: 24px; } }
  .sec-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; margin-bottom: 12px; padding-top: 10px; border-top: 1px solid var(--rule); }
  .sec-h h2 { font: 700 25px/1.15 var(--serif); letter-spacing: -0.01em; margin: 0; }
  .sec-h .dek { color: var(--muted); font-size: 14px; }
  .sec-h .act { margin-left: auto; }
  #app > .sec:first-child > .sec-h, #app > .cols > div > .o:first-child > .sec:first-child > .sec-h { border-top: 0; padding-top: 0; }
  .sub-h { font: 700 18px/1.25 var(--serif); margin: 26px 0 8px; }
  .cols { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 0 40px; align-items: start; }
  .cols.even { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  @media (max-width: 880px) { .cols, .cols.even { grid-template-columns: minmax(0, 1fr); } }
  .note { font-size: 13px; color: var(--muted); margin-top: 10px; max-width: 75ch; }
  .muted { color: var(--muted); }
  .up { color: var(--up); } .down { color: var(--down); }
  .money { color: var(--gold); font-weight: 700; }
  .loading { padding: 60px 0; text-align: center; font: italic 18px var(--serif); color: var(--muted); }
  .err { margin-top: 24px; padding: 14px; border: 1px solid var(--down); color: var(--down); }
  .warn { margin-top: 16px; padding: 10px 12px; border: 1px solid var(--down); display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; font-size: 14px; }
  details.how { margin-top: 14px; font-size: 13px; color: var(--muted); max-width: 75ch; }
  details.how summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--ink-2); padding: 12px 0; min-height: 44px; box-sizing: border-box; }
  details.how p { margin: 4px 0 8px; }

  /* Your team, everywhere */
  [data-tid].me:not(tr):not(.bt):not(.gl) .nm, [data-tids].me .nm, span[data-tid].me { color: var(--you); font-weight: 700; }
  .t tr.me td, .gl.me, .bt.me, .pot li.me { background: var(--you-bg); }
  .t tr.me td:first-child, .pot li.me { box-shadow: inset 3px 0 0 var(--you); }
  .pot li.me, .pot ol.led li.me { margin: 0 -10px; padding-left: 10px; padding-right: 10px; }
  .mine { margin-top: 22px; padding: 14px 16px; background: var(--you-bg); border-left: 4px solid var(--you); }
  .mine .who { font: 700 22px/1.2 var(--serif); }
  .mine .row { display: flex; flex-wrap: wrap; gap: 8px 30px; margin-top: 8px; }
  .mine .stat .k { font-size: 13px; color: var(--muted); }
  .mine .stat .v { font: 700 26px/1.05 var(--cond); font-variant-numeric: tabular-nums; }
  .mine .stat .s { font-size: 13px; color: var(--ink-2); }
  .mine .need { margin: 10px 0 0; font: 400 16px/1.4 var(--serif); }
  @media (max-width: 600px) { .mine { padding: 10px 12px; } .mine .who { font-size: 19px; } .mine .row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-flow: dense; gap: 8px 12px; margin-top: 6px; }
    .mine .stat { min-width: 0; } .mine .stat .k, .mine .stat .s { font-size: 12px; line-height: 1.3; } .mine .stat .v { font-size: 20px; overflow-wrap: anywhere; } .mine .stat.wide { grid-column: span 2; } .mine .need { font-size: 14px; margin-top: 8px; } }

  /* The pot: this week's high-score race */
  .pot { background: var(--gold-bg); border-top: 3px solid var(--gold-bar); padding: 14px 16px 12px; }
  .pot-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .pot-h .amt { font: 700 44px/1 var(--cond); color: var(--gold); font-variant-numeric: tabular-nums; }
  .pot-h .what { font: 700 18px/1.2 var(--serif); }
  .pot-h .st { font-size: 13px; color: var(--muted); width: 100%; }
  .pot ol { list-style: none; margin: 10px 0 0; padding: 0; }
  .pot li { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid color-mix(in srgb, var(--gold-bar) 35%, transparent); font-variant-numeric: tabular-nums; }
  .pot li .n { width: 1.2em; flex: none; color: var(--muted); font-size: 13px; }
  .pot li .team { flex: 1; min-width: 0; }
  .pot li .pts { font: 700 20px/1 var(--cond); }
  .pot ol.live li.top .pts { color: var(--gold); font-size: 26px; }
  .pot ol:not(.live) li .pts { color: var(--ink-2); }
  .pot li .pct { width: 52px; flex: none; text-align: right; font: 600 16px/1 var(--cond); color: var(--ink); }
  .pot .cols-h { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; font: 600 11px/1 var(--cond); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .pot .cols-h + ol { margin-top: 4px; }
  .pot .cols-h span:last-child { width: 52px; text-align: right; }
  .pot .foot { font-size: 14px; color: var(--ink-2); margin-top: 4px; padding-top: 10px; border-top: 1px solid color-mix(in srgb, var(--gold-bar) 35%, transparent); }
  .pot .foot b { font-weight: 700; color: var(--ink); }
  .pot .foot b.money { color: var(--gold); }
  /* The ledger: every settled week's winner, newest first. */
  .pot .led-h { font: 700 17px/1.2 var(--serif); margin: 18px 0 0; }
  .pot .race + .led-h { margin-top: 20px; padding-top: 14px; border-top: 2px solid color-mix(in srgb, var(--gold-bar) 55%, transparent); }
  .pot ol.led { margin-top: 6px; }
  .pot ol.led li { padding: 6px 0; gap: 10px; }
  .pot ol.led .wk { width: 2.6em; flex: none; font: 600 14px/1 var(--cond); color: var(--muted); letter-spacing: .02em; }
  .pot ol.led .who { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .pot ol.led .pts { font: 600 17px/1 var(--cond); color: var(--ink); }
  .pot ol.led .paid { width: 52px; flex: none; text-align: right; font: 700 17px/1 var(--cond); color: var(--gold); }
  .pot ol.led .split { font-size: 12px; color: var(--muted); }
  .pot details.more summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--ink-2); padding: 10px 0; min-height: 40px; box-sizing: border-box; border-top: 1px solid color-mix(in srgb, var(--gold-bar) 35%, transparent); }
  .pot details.more[open] summary { display: none; }
  .pot details.more ol.led { margin-top: 0; }
  #money { scroll-margin-top: 60px; }

  /* Scoreboard boxes: live games and past results */
  .boxes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .boxes.games { gap: 20px 12px; padding-top: 8px; }
  .boxes.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  @media (max-width: 880px) { .boxes.three { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 600px) { .boxes, .boxes.three { grid-template-columns: minmax(0, 1fr); } }
  .box { background: var(--card); border: 1px solid var(--hair); min-width: 0; }
  .box { position: relative; }
  .box.big { border-color: var(--ink-2); }
  .box.mygame { border-color: var(--you); border-width: 2px; }
  /* Caption sits on the top border like a label, so boxes side by side stay the same height. */
  .box .cap { position: absolute; top: -8px; left: 9px; right: 9px; display: flex; justify-content: space-between; pointer-events: none;
              font: 700 11px/16px var(--cond); letter-spacing: .08em; text-transform: uppercase; color: var(--ink); }
  .box .cap > * { background: var(--paper); padding: 0 4px; }
  .box .cap:empty { display: none; }
  .box.mygame .cap b { color: var(--you); }
  .box .cap span { color: var(--muted); margin-left: auto; }
  .gl { display: flex; align-items: center; gap: 10px; padding: 9px 12px; min-height: 48px; font-variant-numeric: tabular-nums; }
  .gl + .gl { border-top: 1px solid var(--hair); }
  .gl .team { flex: 1; min-width: 0; }
  .gl .team .nm { font-weight: 500; }
  .gl.ahead .team .nm { font-weight: 700; }
  .gl .sc { font: 600 19px/1 var(--cond); min-width: 3.4em; text-align: right; }
  .gl .sc.proj { font: 400 14px/1 var(--sans); color: var(--muted); }
  .gl .sc small { display: block; font: 400 12px/1 var(--sans); color: var(--muted); margin-top: 3px; letter-spacing: 0; }
  .gl .wp { font: 700 19px/1 var(--cond); min-width: 2.8em; text-align: right; }
  .gl:not(.ahead) .wp, .gl.lost .sc { color: var(--muted); font-weight: 500; }
  .gl .tagm { font: 600 12px/1 var(--sans); color: var(--muted); }
  .gl .sc.hi { color: var(--gold); } .gl .sc.lo { color: var(--down); }
  .box .foot { font-size: 12px; color: var(--muted); padding: 0 12px 9px; }

  /* Recap */
  .lead h3 { font: 800 clamp(28px, 3.6vw, 40px)/1.06 var(--serif); letter-spacing: -0.015em; margin: 2px 0 10px; text-wrap: balance; }
  .lead p { font: 400 18px/1.45 var(--serif); color: var(--ink-2); margin: 0; }
  .briefs { display: grid; grid-template-columns: 1fr 1fr; gap: 0 26px; margin-top: 18px; border-top: 1px solid var(--hair-2); }
  @media (max-width: 600px) { .briefs { grid-template-columns: 1fr; } }
  .brief:only-child { grid-column: 1 / -1; }
  .brief { padding: 12px 0 13px; border-bottom: 1px solid var(--hair); }
  .brief h4 { font: 700 18px/1.25 var(--serif); margin: 0 0 4px; text-wrap: balance; }
  .brief p { margin: 0; font-size: 14px; color: var(--ink-2); }

  /* Playoff bracket */
  .bracket { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: 0 24px; }
  @media (max-width: 700px) { .bracket { grid-template-columns: minmax(0, 1fr); } }
  .bround > .rn { display: block; font: 700 17px/1.2 var(--serif); margin: 4px 0 8px; }
  .bround .bye { font-size: 13px; color: var(--muted); margin: -2px 0 10px; }
  .bgame { border: 1px solid var(--hair-2); background: var(--card); margin-bottom: 12px; }
  .bgame.live { border-color: var(--down); }
  .bt { display: flex; gap: 10px; align-items: center; padding: 9px 10px; font-variant-numeric: tabular-nums; }
  .bt + .bt { border-top: 1px solid var(--hair); }
  .bt .sd { width: 1.4em; color: var(--muted); font-size: 13px; flex: none; }
  .bt .nm { flex: 1; font-weight: 600; min-width: 0; line-height: 1.25; }
  .bt .sc { flex: none; font-weight: 600; }
  .bt.won .sc::after { content: " ✓"; color: var(--up); }
  .bt.lost { color: var(--muted); } .bt.lost .nm, .bt.lost .sc { font-weight: 400; }
  .bt.tbd { color: var(--muted); font-style: italic; }
  .bnote { font-size: 12px; color: var(--muted); padding: 0 10px 9px; }

  /* Tables */
  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch;
    background: linear-gradient(to right, var(--paper) 30%, transparent) left / 32px 100% no-repeat local,
                linear-gradient(to left, var(--paper) 30%, transparent) right / 32px 100% no-repeat local,
                radial-gradient(farthest-side at 0 50%, rgb(0 0 0 / .2), transparent) left / 10px 100% no-repeat scroll,
                radial-gradient(farthest-side at 100% 50%, rgb(0 0 0 / .2), transparent) right / 10px 100% no-repeat scroll; }
  .scroll .t th:first-child, .scroll .t td:first-child { position: sticky; left: 0; z-index: 1; background: var(--paper); }
  .scroll .t tr.me td:first-child { background: var(--you-bg); }
  .scroll.scrolled .t th:first-child::after, .scroll.scrolled .t td:first-child::after { content: ""; position: absolute; top: 0; bottom: 0; right: -14px; width: 14px;
    background: linear-gradient(to right, var(--paper), transparent); pointer-events: none; }
  .scroll.scrolled .t tr.me td:first-child::after { background: linear-gradient(to right, var(--you-bg), transparent); }
  table.t { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  .t th { font: 600 12px/1.2 var(--cond); letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
          text-align: right; padding: 8px 9px; border-bottom: 1px solid var(--rule); white-space: nowrap; vertical-align: bottom; }
  .t td { text-align: right; padding: 8px 9px; border-bottom: 1px solid var(--hair); white-space: nowrap; }
  .t th.l, .t td.l { text-align: left; }
  .t td.wrap { white-space: normal; }
  .t tr.cut td { border-bottom: 2px solid var(--rule); }
  .t .strong { font-weight: 700; }
  .wk-h { font-size: 14px; color: var(--ink-2); margin: 0 0 10px; }
  .wk-h b { color: var(--ink); }
  .t td.big { font: 700 18px/1 var(--cond); }
  .t td.dim { color: var(--ink-2); }
  @media (max-width: 600px) {
    .t .opt { display: none; }
    .t th, .t td { padding: 8px 6px; }
    .t td.l .team { max-width: 10.5em; }
    .t td.l .nm { white-space: normal; }
    .t.std .own, .t.std .own + br, .opt-note { display: none; }
  }
  .rk { display: inline-block; width: 1.6em; color: var(--muted); font-variant-numeric: tabular-nums; }
  td.rkc { width: 2.4em; text-align: center !important; line-height: 1.1; }
  td.rkc .rk { display: block; width: auto; font: 700 18px/1 var(--cond); color: var(--ink); }
  .t td .mv { font-size: 12px; font-weight: 600; }
  td.rkc .mv { display: block; font-size: 11px; font-weight: 600; margin-top: 2px; }
  .team { display: inline-flex; align-items: center; gap: 9px; vertical-align: middle; text-align: left; }
  .team img, .team .ph { width: 26px; height: 26px; border-radius: 50%; flex: none; object-fit: cover; }
  .team .ph { display: inline-grid; place-items: center; font: 700 11px/1 var(--sans); color: #fff; background: hsl(var(--h, 30) 32% 42%); }
  .team .nm { font-weight: 600; line-height: 1.2; }
  .team .own { color: var(--muted); font-size: 12px; line-height: 1.2; }
  .as { display: block; font-size: 12px; color: var(--muted); font-weight: 400; }
  .bar { height: 6px; background: var(--hair); min-width: 50px; }
  .bar > i { display: block; height: 100%; background: var(--bar); }
  .bar.gold > i { background: var(--gold-bar); }
  .cellbar { display: flex; align-items: center; gap: 9px; justify-content: flex-end; }
  .cellbar .bar { flex: 1; max-width: 110px; }
  .cellbar span { min-width: 3em; text-align: right; }

<script>
// ============================== CONFIG ==============================
const CONFIG = {
  leagueId: '1384626278153322496',   // current season's Sleeper league ID
  highScorePayout: 10,               // $ per week to the top scorer
  payPlayoffWeeks: false,            // true = keep paying high score during playoff weeks
  splitTies: true,                   // tie for high score splits the payout
  sims: 10000,                       // playoff simulations
};
const qs = new URLSearchParams(location.search);
if (qs.get('league')) CONFIG.leagueId = qs.get('league');

// ====================================================================

const API = 'https://api.sleeper.app/v1';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const TABS = ['week', 'table', 'managers', 'history'];
// Old tab links still land in the right place. #money opens This week at the high-score card.
const TAB_ALIAS = { front: 'week', rankings: 'table', standings: 'table', money: 'week' };
const tabFromHash = () => { const t = location.hash.slice(1); return TABS.includes(t) ? t : TAB_ALIAS[t] || 'week'; };
const state = { chain: [], chainDone: Promise.resolve(), cache: {}, cur: null, tab: tabFromHash(), history: null };

// The viewer's own team, remembered by Sleeper user ID so it carries across seasons.
const MINE_KEY = 'ledger.myteam';
const myUid = () => { try { return localStorage.getItem(MINE_KEY) || ''; } catch { return ''; } };
const myTeam = d => { const u = myUid(); return u ? Object.values(d.teams).find(t => t.uid === u) || null : null; };

// ============================== LOADING ==============================
async function seasonChain(startId) {
  const out = [];
  let id = startId;
  while (id && id !== '0' && out.length < 15) {
    const lg = await get(`/league/${id}`);
    if (!lg) break;
    out.push({ id: lg.league_id, season: lg.season, league: lg });
    id = lg.previous_league_id;
  }
  return out;
}

async function load(leagueId, opts = {}) {
  const [league, users, rosters, nfl] = await Promise.all([
    opts.league || get(`/league/${leagueId}`), get(`/league/${leagueId}/users`), get(`/league/${leagueId}/rosters`), get('/state/nfl'),
  ]);

  const playoffStart = s.playoff_week_start || 15;
  // Playoff length from the league's settings: one round per halving of the field, and Sleeper's round type
  // (0: one week per round, 1: two-week final, 2: two weeks per round).
  const poRounds = Math.max(1, Math.ceil(Math.log2(s.playoff_teams || 6)));
  const playoffWeeks = s.playoff_round_type === 2 ? poRounds * 2 : s.playoff_round_type === 1 ? poRounds + 1 : poRounds;
  const playoffEnd = playoffStart + playoffWeeks - 1;
  const startWeek = s.start_week || 1;
  const complete = league.status === 'complete';
  const lastScored = complete ? Math.max(s.last_scored_leg || 0, playoffEnd) : (s.last_scored_leg || 0);
  const liveWeek = !complete && league.season === nfl.season && nfl.week > lastScored ? nfl.week : null;
  const weeks = range(startWeek, lastScored);
  const remaining = complete ? [] : range(Math.max(startWeek, lastScored + 1), playoffStart - 1);
  const fetchWeeks = [...new Set([...weeks, ...remaining, ...(liveWeek ? [liveWeek] : [])])];
  const txUpTo = opts.light ? 0 : complete ? playoffEnd : Math.max(lastScored, liveWeek || 0);
  // Sleeper projections for last week (for the week-over-week change) and every unplayed regular-season week.
  // Plus the playoff weeks, so title odds use each round's own projections.
  const projWeeks = complete || opts.light ? [] : [...new Set([...(lastScored >= startWeek ? [lastScored] : []), ...remaining, ...range(playoffStart, playoffEnd)])];

  const postseason = lastScored >= playoffStart - 1;

  let failed = 0;

    Promise.all(fetchWeeks.map(w => soft(get(`/league/${leagueId}/matchups/${w}`), []))),
    Promise.all(range(1, txUpTo).map(w => soft(get(`/league/${leagueId}/transactions/${w}`), []))),
    complete || (postseason && !opts.light) ? soft(get(`/league/${leagueId}/winners_bracket`), []) : Promise.resolve([]),
    Promise.all(projWeeks.map(w => soft(get(`/projections/nfl/regular/${league.season}/${w}`), null))),
    liveWeek ? nflGames(league.season, liveWeek) : Promise.resolve(null),

  const byWeek = Object.fromEntries(fetchWeeks.map((w, i) => [w, matchups[i] || []]));

  for (const rows of Object.values(byWeek)) for (const r of rows) if (r.custom_points != null) r.points = r.custom_points;
  const userById = Object.fromEntries(users.map(u => [u.user_id, u]));
  const teams = {};
  for (const r of rosters) {
    const u = userById[r.owner_id] || {};
    const av = u.metadata?.avatar || (u.avatar ? `https://sleepercdn.com/avatars/thumbs/${u.avatar}` : '');
    teams[r.roster_id] = {
      id: r.roster_id, uid: r.owner_id, owner: u.display_name || `Team ${r.roster_id}`,
      name: u.metadata?.team_name || u.display_name || `Team ${r.roster_id}`, avatar: av,
      w: 0, l: 0, t: 0, mw: 0, ml: 0, pf: 0, pa: 0, apW: 0, apL: 0, scores: {}, winnings: 0, highs: 0,
    };

    league, teams, weeks, remaining, byWeek, liveWeek, playoffStart, playoffWeeks, complete, nfl, proj, games: games?.status || null, gameLeft: games?.left || null, rosterPlayers,
    leagueAvg: !!s.league_average_match, transactions: txs.flat().filter(t => t && t.status === 'complete'),
    champion: final?.w ?? null, runnerUp: final?.l ?? null, failed,

}
// For one week: status per NFL team ('pre_game' | 'in_game' | 'complete') and the share of each team's game still
// to play (1 before kickoff, 0 when final), from Sleeper's live scores. Falls back to the schedule (status only).
const gameLeft = md => {
  if (!md || md.is_over) return 0;

async function nflGames(season, week) {
  try {

    const r = await fetch(`https://api.sleeper.com/schedule/nfl/regular/${season}`);

// The NFL player list is ~2.5 MB, so keep just the players this league touches in localStorage.

function compute(d) {

    const rows = regRows(d, w);
    if (!rows.length) continue;
    const regular = w < playoffStart;
    for (const r of rows) teams[r.roster_id].scores[w] = r.points ?? 0;
    const pts = rows.map(r => r.points ?? 0);
    const hi = Math.max(...pts), lo = Math.min(...pts);
    weekStats[w] = { hi, lo };
    if (hi > 0 && (regular || CONFIG.payPlayoffWeeks)) {
      const winners = rows.filter(r => r.points === hi).map(r => r.roster_id);
      const paid = CONFIG.splitTies ? winners : winners.slice(0, 1);
      const each = CONFIG.highScorePayout / paid.length;
      paid.forEach(id => { teams[id].winnings += each; teams[id].highs += 1; });

    if (!regular) continue;
    for (const r of rows) {
      const p = r.points ?? 0;

      teams[r.roster_id].apL += pts.filter(x => x > p).length;
    }
    if (leagueAvg) [...rows].sort((a, b) => b.points - a.points)
      .forEach((r, i) => i < rows.length / 2 ? teams[r.roster_id].mw++ : teams[r.roster_id].ml++);

      const A = teams[a.roster_id], B = teams[b.roster_id];

      A.pf += a.points; A.pa += b.points; B.pf += b.points; B.pa += a.points;

// Cumulative per-team totals through week `upTo` (completed regular-season weeks only).
function tally(d, upTo) {
  const t = {};
  for (const id in d.teams) t[id] = { w: 0, l: 0, t: 0, mw: 0, ml: 0, pf: 0, apW: 0, apL: 0, weeks: [] };
  for (const w of d.weeks) {
    if (w > upTo || w >= d.playoffStart) continue;
    const rows = regRows(d, w);
    if (!rows.length) continue;
    const pts = rows.map(r => r.points ?? 0);
    for (const r of rows) {
      const p = r.points ?? 0, x = t[r.roster_id];
      const beat = pts.filter(v => v < p).length, lost = pts.filter(v => v > p).length;

      .forEach((r, i) => i < rows.length / 2 ? t[r.roster_id].mw++ : t[r.roster_id].ml++);

function powerAt(d, w) {

function headlines(b) {
  const { d, c, power, lu, players } = b;
  const out = [];
  const N = id => esc(d.teams[id].name);
  if (d.complete && d.champion != null) {
    const fr = regRows(d, d.weeks.at(-1) ?? 0), fp = id => fr.find(r => r.roster_id === id)?.points;
    const score = d.runnerUp != null && fp(d.champion) != null && fp(d.runnerUp) != null ? ` ${f2(fp(d.champion))}–${f2(fp(d.runnerUp))}` : '';
    const p = d.runnerUp != null ? `They beat ${N(d.runnerUp)}${score} in the final.` : 'The season is in the books.';
    out.push({ s: 1000, ids: [d.champion], k: 'Champions', h: `${N(d.champion)} won the ${esc(d.league.season)} title`, p });
  }
  if (!power) return out;
  const rich = [...c.list].sort((a, b) => b.winnings - a.winnings)[0];
  const money = () => { if (rich && rich.highs >= 2 && c.list.every(t => t === rich || t.highs < rich.highs)) out.push({ s: 22 + rich.highs * 3, ids: [rich.id], k: 'The money', h: `${N(rich.id)} has banked ${usd(rich.winnings)} in weekly high scores`,
    p: `${rich.highs} weekly wins so far. Nobody else has more than ${Math.max(0, ...c.list.filter(t => t !== rich).map(t => t.highs))}.` }); };
  // Playoff weeks: the stories are the bracket results, and last regular-season week's news is stale.
  const lastWk = d.weeks.at(-1) ?? 0;
  if (d.bracket && lastWk >= d.playoffStart) {
    const r = lastWk - d.playoffStart + 1, rounds = Math.max(...d.bracket.map(m => m.r));
    const rows = regRows(d, lastWk), pts = id => rows.find(x => x.roster_id === id)?.points ?? 0;
    const seed = id => c.list.findIndex(t => t.id === id) + 1;
    for (const m of d.bracket.filter(m => m.r === r && titlePath(m) && m.w != null)) {
      if (m.p === 1 && d.champion != null) continue;  // the champions story above covers it
      const up = seed(m.w) > seed(m.l);
      out.push({ s: 500 + (up ? 20 : 0) + (m.p === 1 ? 100 : 0), ids: [m.w, m.l], k: m.p === 1 ? 'Champions' : up ? 'Playoff upset' : roundName(d, r),
        h: m.p === 1 ? `${N(m.w)} won the ${esc(d.league.season)} title` : `${N(m.w)} ${up ? 'knocked out' : 'beat'} ${N(m.l)}${r < rounds ? ` to reach the ${roundName(d, r + 1).toLowerCase()}` : ''}`,
        p: `${f2(pts(m.w))}–${f2(pts(m.l))}. ${N(m.w)} was the No. ${seed(m.w)} seed${up ? ` and ${N(m.l)} the No. ${seed(m.l)}` : ''}.` });
    }
    money();
    return out.sort((a, b) => b.s - a.s);
  }
  const W = power.last;
  const games = c.games.filter(g => g.week === W);
  const rows = regRows(d, W);
  const payWeek = c.payouts.find(p => p.week === W);
  if (rows.length > 1) {
    const sorted = [...rows].sort((a, b) => b.points - a.points);
    const top = sorted[0];
    const allScores = Object.values(d.teams).flatMap(t => Object.entries(t.scores).filter(([w]) => +w < d.playoffStart).map(([, p]) => p)).sort((a, b) => b - a);
    const rank = allScores.indexOf(top.points) + 1;
    out.push({ s: 40 + (rank === 1 ? 25 : 0), ids: [top.roster_id], k: payWeek ? `High score · ${usd(payWeek.each)}` : 'High score',
      h: `${N(top.roster_id)} put up ${f2(top.points)}, the best score of Week ${W}`,
      p: `${rank === 1 ? 'That is the highest score of the season so far.' : `The ${ord(rank)}-best score of the season.`} ${N(sorted[1].roster_id)} was next at ${f2(sorted[1].points)}.` });
  }
  if (W >= 3) for (const g of games) {
    const [win, lose, a, bb] = winLose(g);
    // Same model as the playoff odds: last week's simulation of this week. Season averages are the fallback.
    const p = power.prevOdds?.firstWeek === W && power.prevOdds.pair[win] ? power.prevOdds.pair[win].p : preWeekProb(d, W, win, lose);
    if (p < 0.38) out.push({ s: 60 + (0.5 - p) * 100, ids: [win, lose], k: 'Upset', h: `${N(win)} upset ${N(lose)}`,
      p: `Given a ${pct(p)} chance before kickoff, ${N(win)} won ${f2(a)}–${f2(bb)}.` });
  }
  if (games.length) {
    const blow = games.reduce((x, y) => margin(y) > margin(x) ? y : x);
    const [w1, l1, a1, b1] = winLose(blow);
    if (margin(blow) >= 35) out.push({ s: 28 + margin(blow) / 4, ids: [w1, l1], k: 'Blowout', h: `${N(w1)} ran ${N(l1)} off the field`, p: `${f2(a1)}–${f2(b1)}, a ${f1(margin(blow))}-point margin.` });
    const close = games.reduce((x, y) => margin(y) < margin(x) ? y : x);
    const [w2, l2, a2, b2] = winLose(close);
    if (margin(close) < 6) out.push({ s: 45 + (6 - margin(close)) * 3, ids: [w2, l2], k: 'Photo finish', h: `${N(w2)} edged ${N(l2)} by ${f2(margin(close))}`, p: `Final: ${f2(a2)}–${f2(b2)}.` });
  }
  if (lu) {
    const bl = lu.blunders.filter(x => x.w === W).sort((a, b) => b.left - a.left)[0];
    if (bl) out.push({ s: 55 + bl.left / 4, ids: [bl.id, bl.opp], k: 'Bench blunder', h: `${N(bl.id)} lost with the winning points on the bench`,
      p: `Lost ${f2(bl.act)}–${f2(bl.oppPts)} to ${N(bl.opp)} with ${f1(bl.left)} points on the bench. The best lineup would have scored ${f2(bl.opt)}.`
        + (bl.bench && players?.[bl.bench.pid] ? ` ${esc(players[bl.bench.pid].n)} scored ${f1(bl.bench.pts)} sitting there.` : '') });
  }
  // The recap is about last week, so it uses the odds as they stood after it (pre-kickoff), not this week's live ones.
  const after = power.preKick || power.odds;
  if (power.prevOdds && !after.final) {
    const sw = Object.keys(d.teams).map(Number).map(id => ({ id, dp: after.made[id] - power.prevOdds.made[id] })).sort((a, b) => Math.abs(b.dp) - Math.abs(a.dp))[0];
    if (sw && Math.abs(sw.dp) >= 0.1) {
      const t = d.teams[sw.id];
      out.push({ s: 40 + Math.abs(sw.dp) * 60, ids: [sw.id], k: 'Playoff race', h: `${N(sw.id)}'s playoff odds ${sw.dp > 0 ? 'jumped' : 'dropped'} ${Math.round(Math.abs(sw.dp) * 100)} points`,
        p: `To ${oddsTxt(after, sw.id)} after Week ${W}, with a ${t.totW}-${t.totL} record.` });
    }
  }
  money();
  return out.sort((a, b) => b.s - a.s);
}

// ============================== RENDER HELPERS ==============================
// A team without a Sleeper avatar gets its initials on a color picked from its name, so no row shows a blank circle.
const initials = name => (String(name).match(/[A-Za-z0-9]+/g) || ['?']).slice(0, 2).map(w => w[0]).join('').toUpperCase();
const hue = name => [...String(name)].reduce((h, ch) => (h * 31 + ch.charCodeAt(0)) % 360, 7);
const avatar = t => t.avatar
  ? `<img src="${esc(t.avatar)}" alt="" loading="lazy" data-i="${esc(initials(t.name))}" data-h="${hue(t.name)}" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'ph',textContent:this.dataset.i,style:'--h:'+this.dataset.h}))">`
  : `<span class="ph" style="--h:${hue(t.name)}">${esc(initials(t.name))}</span>`;
const sameName = (a, b) => String(a ?? '').trim().toLowerCase() === String(b ?? '').trim().toLowerCase();
const teamCell = (t, sub = true) => `<span class="team">${avatar(t)}<span><span class="nm">${esc(t.name)}</span>${
  sub === true ? (!sameName(t.owner, t.name) ? `<br><span class="own">${esc(t.owner)}</span>` : '') : sub ? `<br><span class="own">${sub}</span>` : ''}</span></span>`;
const sec = (title, dek, body, act = '') => `<section class="sec"><div class="sec-h"><h2>${title}</h2>${dek ? `<span class="dek">${dek}</span>` : ''}${act ? `<span class="act">${act}</span>` : ''}</div>${body}</section>`;
const bar = (p, cls = '') => `<div class="bar ${cls}"><i style="width:${Math.max(0, Math.min(1, p)) * 100}%"></i></div>`;
const rec = t => `${t.totW}-${t.totL}`;
// Method detail lives behind a "How this works" toggle; `key` keeps it open across live refreshes.
const how = (key, ...paras) => `<details class="how" data-k="${key}"><summary>How this works</summary>${paras.filter(Boolean).map(p => `<p>${p}</p>`).join('')}</details>`;
function setLoading(msg) { $('#app').innerHTML = `<div class="loading">${esc(msg)}</div>`; }

// ============================== STRIP & MAST ==============================
function renderChrome(b) {
  const { d } = b;
  $('#title').textContent = d.league.name;
  document.title = d.league.name;
  const wk = d.complete ? 'Final' : d.liveWeek ? `Week ${d.liveWeek}` : d.weeks.length ? `After Week ${d.weeks.at(-1)}` : 'Preseason';
  const liveNow = d.liveWeek && regRows(d, d.liveWeek).some(r => r.points > 0);
  const upd = b.updated ? `updated ${b.updated.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}` : '';
  // A past season (opened from History) says so, with the way back.
  const newest = state.chain[0], past = newest && d.league.league_id !== newest.id;
  $('#meta').innerHTML = `${d.league.season} · ${wk}${liveNow ? ' · <span class="live">Live</span>' : ''}${upd && !past ? ` · <span id="updated" aria-live="polite">${upd}</span>` : ''}${
    past ? ` · <button type="button" class="lnk" data-season="${esc(newest.id)}">Back to ${esc(newest.season)}</button>` : ''}`;
  const mine = $('#mine'), uid = myUid();
  mine.innerHTML = '<option value="">Pick your team</option>' + Object.values(d.teams).filter(t => t.uid).sort((x, y) => x.name.localeCompare(y.name))
    .map(t => `<option value="${esc(t.uid)}">${esc(t.name)}</option>`).join('');
  mine.value = Object.values(d.teams).some(t => t.uid === uid) ? uid : '';
  // Scoreboard strip: live scores for readers on the other tabs, only while games are being played.
  // This week leaves it out, since its game boxes show the same scores.
  const pairs = liveNow && state.tab !== 'week' ? pairsOf(regRows(d, d.liveWeek)) : [];
  $('#strip').innerHTML = pairs.length ? `<div class="tag">Week ${d.liveWeek} <b class="live">Live</b></div>` + pairs.map(([a, bb]) => {
    const leadA = a.points >= bb.points;
    return `<div class="game"><div class="r ${leadA ? 'ahead' : ''}"><span title="${esc(d.teams[a.roster_id].name)}">${esc(d.teams[a.roster_id].name)}</span><span>${f2(a.points ?? 0)}</span></div>
      <div class="r ${!leadA ? 'ahead' : ''}"><span title="${esc(d.teams[bb.roster_id].name)}">${esc(d.teams[bb.roster_id].name)}</span><span>${f2(bb.points ?? 0)}</span></div></div>`;
  }).join('') : '';
  $('#strip').parentElement.hidden = !pairs.length;
  document.querySelectorAll('#tabs a').forEach(a => {
    const on = a.dataset.tab === state.tab;
    a.classList.toggle('on', on);
    if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
}

// ============================== THIS WEEK ==============================
// Lead story plus briefs, without telling the same game twice, two stories on one theme, or two on one team.
const STORY_TOPIC = { 'Playoff race': 'move' };
function pickStories(heads, n = 5) {
  const per = {}, topics = new Set(), games = [], out = [];
  for (const h of heads) {
    if (out.length >= n) break;
    const ids = h.ids || [], tp = STORY_TOPIC[h.k];
    if (tp && topics.has(tp)) continue;
    if (ids.length === 2 && games.some(g => g.includes(ids[0]) && g.includes(ids[1]))) continue;
    if (ids.some(id => per[id])) continue;
    ids.forEach(id => { per[id] = (per[id] || 0) + 1; });
    if (tp) topics.add(tp);
    if (ids.length === 2) games.push(ids);
    out.push(h);
  }
  return out;
}

function tabWeek(b) {
  const { d, power } = b;
  if (!power) return sec('This week', '', `<p class="muted">The season hasn't started. Check back after Week 1, or look through <a href="#history">past seasons</a>.</p>`);
  const ps = power.playoffs, odds = power.odds;
  const liveNow = !ps && d.liveWeek && d.liveWeek === odds.firstWeek && regRows(d, d.liveWeek).some(r => r.points > 0);
  const games = ps ? bracketSection(b) : gamesSection(b);
  const pot = potBlock(b), stories = recapSection(b, !!pot);
  // Desktop: games and recap on the left, the money card on the right. While games are being played they lead;
  // between weeks, last week's recap leads. On phones the columns dissolve and CSS orders the blocks by the mode class:
  // between weeks pot, recap, games; while games are played games, pot, recap; in the playoffs as written.
  const blk = (k, h) => h ? `<div class="o o-${k}">${h}</div>` : '';
  const [first, second] = liveNow || ps ? [blk('games', games), blk('recap', stories)] : [blk('recap', stories), blk('games', games)];
  const right = pot ? `<div class="o o-pot"><section class="sec" aria-label="High-score money">${pot}</section></div>` : '';
  const cls = `cols week ${ps ? 'ps' : liveNow ? 'live' : 'pre'}`;
  return (myTeamCard(b) || '') + `<div class="${cls}"><div>${first}${second}</div><div>${right}</div></div>`;
}

// The money, in one card: this week's high-score race, then every settled week's winner (newest first), then the season's totals.
const LEDGER_SHOWN = 5;
function potBlock(b) {
  const { d, c, power } = b, odds = power.odds, pay = CONFIG.highScorePayout;
  // A playoff week shows its live race only when playoff weeks pay (points only: the odds don't simulate them).
  const liveW = d.liveWeek && (d.liveWeek < d.playoffStart || (CONFIG.payPlayoffWeeks && regRows(d, d.liveWeek).some(r => r.points > 0)));
  const w = liveW ? d.liveWeek : odds.firstWeek;
  const racing = !!w && (w < d.playoffStart || CONFIG.payPlayoffWeeks);
  const rankIn = (arr, v) => 1 + arr.filter(x => x > v + 1e-9).length;
  const paid = c.payouts.length * pay;
  let race = '';
  if (racing) {
    const rows = regRows(d, w), live = rows.some(r => r.points > 0), m = odds.firstWeek === w ? odds.firstModel : null;
    const list = live ? rows.map(r => ({ id: r.roster_id, v: r.points ?? 0 }))
      : m ? Object.keys(d.teams).map(Number).map(id => ({ id, v: m.mu[id] })).filter(x => x.v != null) : [];
    list.sort((x, y) => y.v - x.v);
    // Each team's chance of finishing as the week's top scorer, from the same simulations as the odds. Without
    // projections the simulation can't lock in live points, so no % then.
    const top = list.length && m ? odds.top : null;
    // The top three (with ties). During games, also anyone further down who still shows a real chance at the $.
    const shown = list.filter((x, i) => i < 3 || x.v >= list[2].v - 1e-9 || (live && Math.round((top?.[x.id] ?? 0) * 100) >= 10));
    const st = (live ? `Live. The highest score when Week ${w} ends wins ${usd(pay)}.` : `The highest score in Week ${w} wins ${usd(pay)}.`);
    race = `<div class="pot-h"><span class="amt">${usd(pay)}</span><span class="what">Week ${w} high score</span><span class="st">${st}</span></div>
      ${list.length ? `<div class="cols-h"><span>${live ? 'Score' : 'Expected'}</span>${top ? `<span title="Each team's odds of the top score in Week ${w}">Chance</span>` : ''}</div>
      <ol class="race ${live ? 'live' : ''}">${shown.map(x => { const r = rankIn(list.map(y => y.v), x.v);
        return `<li data-tid="${x.id}" class="${r === 1 ? 'top' : ''}"><span class="n">${r}</span>${teamCell(d.teams[x.id], false)}<span class="pts">${live ? f2(x.v) : f1(x.v)}</span>${top ? `<span class="pct">${pct(top[x.id])}</span>` : ''}</li>`; }).join('')}</ol>` : ''}`;
  } else if (c.payouts.length) {
    race = `<div class="pot-h"><span class="amt">${usd(paid)}</span><span class="what">paid out in weekly high scores</span></div>`;
  }
  const pays = [...c.payouts].reverse();
  const ledRow = p => `<li data-tids="${p.winners.join(' ')}"><span class="wk">Wk ${p.week}</span>
    <span class="who">${p.winners.map(id => teamCell(d.teams[id], false)).join('')}${p.winners.length > 1 ? `<span class="split">Tied: split ${usd(pay)}</span>` : ''}</span>
    <span class="pts">${f2(p.score)}</span><span class="paid">${usd(p.each)}</span></li>`;
  const rest = pays.slice(LEDGER_SHOWN);
  const restLabel = rest.length === 1 ? `Show Week ${rest[0].week}` : `Show Weeks ${rest.at(-1)?.week}–${rest[0]?.week}`;
  const ledger = pays.length ? `<h3 class="led-h">Weekly winners</h3><ol class="led">${pays.slice(0, LEDGER_SHOWN).map(ledRow).join('')}</ol>${
    rest.length ? `<details class="more" data-k="ledger"><summary>${restLabel}</summary><ol class="led">${rest.map(ledRow).join('')}</ol></details>` : ''}` : '';
  if (!race && !ledger) return '';
  const earners = [...c.list].filter(t => t.winnings > 0).sort((x, y) => y.winnings - x.winnings || y.highs - x.highs);
  const totalWeeks = (d.playoffStart - (d.league.settings.start_week || 1)) + (CONFIG.payPlayoffWeeks ? d.playoffWeeks : 0);
  const left = Math.max(0, totalWeeks * pay - paid);
  const foot = earners.length ? `<div class="foot">${racing ? `<b class="money">${usd(paid)}</b> paid so far${left ? ` · ${usd(left)} still to play for` : ''}<br>` : ''}${
    earners.map(t => `<span data-tid="${t.id}">${esc(t.name)}</span>&nbsp;<b>${usd(t.winnings)}</b>`).join(' · ')}</div>` : '';
  return `<div class="pot" id="money">${race}${ledger}${foot}</div>`;
}

// Last week's stories (a lead and up to two briefs), deduped, with the copy-for-group-chat button.
function recapSection(b, potShown) {
  const { d, power } = b;
  // The money card beside it already shows last week's high score and the money leaders.
  const stories = pickStories(potShown ? b.heads.filter(h => !/^(High score|The money)/.test(h.k)) : b.heads, 3);
  if (!stories.length) return '';
  const [lead, ...rest] = stories;
  const lastWk = d.weeks.at(-1) ?? 0, ps = power.playoffs, reviewWk = ps && lastWk >= d.playoffStart ? lastWk : power.last;
  const body = `<article class="lead"><h3>${lead.h}</h3><p>${lead.p}</p></article>
    ${rest.length ? `<div class="briefs">${rest.map(x => `<div class="brief"><h4>${x.h}</h4><p>${x.p}</p></div>`).join('')}</div>` : ''}`;
  return sec(ps && lastWk >= d.playoffStart ? `${roundName(d, lastWk - d.playoffStart + 1)} recap` : `Week ${reviewWk} recap`, '', body,
    `<button type="button" class="lnk small" data-copy-recap>${COPY_LABEL}</button>`);
}
const COPY_LABEL = 'Copy for the group chat';

// Shown at the top once a team is picked in the header.
function myTeamCard(b) {
  const { d, c, power } = b;
  const t = myTeam(d);
  if (!t || !power) return '';
  const odds = power.odds, place = c.list.indexOf(t) + 1;
  const stat = (k, v, s = '', cls = '') => `<div class="stat ${cls}"><div class="k">${k}</div><div class="v">${v}</div>${s ? `<div class="s">${s}</div>` : ''}</div>`;
  const items = [stat('Record', rec(t), `${ord(place)} place`)];
  if (power.playoffs) {
    const ps = power.playoffs, made = place <= odds.seeds;
    items.push(stat('Playoffs', made ? `${ord(place)} seed` : 'Missed', made && ps.out.has(t.id) && !ps.done ? 'Eliminated' : ''));
    if (made) items.push(stat('Title', champTxt(odds, power, t.id)));
    const g = bracketGames(b).filter(x => x.a === t.id || x.b === t.id).at(-1);
    if (g && g.w == null) {
      const i = g.a === t.id ? 0 : 1, opp = i ? g.a : g.b, mp = g.p == null ? null : i ? 1 - g.p : g.p;
      items.push(stat(roundName(d, g.r), g.scores ? `${f2(g.scores[i])}–${f2(g.scores[1 - i])}` : mp != null ? `${pct(mp)} to win` : 'Waiting',
        opp != null ? `vs ${esc(d.teams[opp].name)}${g.scores && mp != null ? ` · ${pct(mp)} to win` : ''}` : `Week ${g.wk}`, 'wide'));
    }
  } else if (!odds.final) {
    const dp = power.prevOdds ? odds.made[t.id] - power.prevOdds.made[t.id] : 0;
    items.push(stat('Playoffs', oddsTxt(odds, t.id), Math.abs(dp) >= 0.005 ? `${dp > 0 ? '+' : '−'}${Math.round(Math.abs(dp) * 100)} pt${Math.round(Math.abs(dp) * 100) === 1 ? '' : 's'} after Wk ${power.last}` : ''));
    if (odds.champ) items.push(stat('Title', champTxt(odds, power, t.id)));
  }
  const pair = power.playoffs ? null : odds.pair[t.id];
  if (pair) {
    const rows = regRows(d, odds.firstWeek), pts = id => rows.find(r => r.roster_id === id)?.points ?? 0;
    const live = d.liveWeek === odds.firstWeek && (pts(t.id) > 0 || pts(pair.opp) > 0), m = odds.firstModel;
    const final = live && m?.live?.[t.id] && m?.live?.[pair.opp] && m.sd[t.id] < 0.5 && m.sd[pair.opp] < 0.5;
    const status = pair.p >= 0.999 ? (final ? 'won' : 'all but won') : pair.p <= 0.001 ? (final ? 'lost' : 'all but lost') : `${pct(pair.p)} to win`;
    const left = live && !final ? leftTxt(startersLeft(d, odds.firstWeek, t.id)).toLowerCase() : '';
    items.push(stat(`Week ${odds.firstWeek}`, live ? `${f2(pts(t.id))}–${f2(pts(pair.opp))}` : `${pct(pair.p)} to win`,
      `vs ${esc(d.teams[pair.opp].name)}${live ? ` · ${status}` : ''}${left ? ` · ${left}` : ''}`, 'wide'));
  }
  items.push(stat('Money', `<span class="money">${usd(t.winnings)}</span>`, `${t.highs} weekly high${t.highs === 1 ? '' : 's'}`));
  return `<section class="mine" aria-label="Your team"><div class="who">${esc(t.name)}</div>
    <div class="row">${items.join('')}</div>${pair ? needLine(odds, t.id) : ''}</section>`;
}
// One plain sentence on what this week's result means for the playoffs, for teams whose odds it can still move.
function needLine(odds, id) {
  const k = odds.cond[id];
  if (!k || odds.final || odds.clinched.has(id) || odds.eliminated.has(id)) return '';
  const pr = odds.pair[id];
  if (pr && (pr.p >= 0.999 || pr.p <= 0.001)) return '';
  const shown = k.rec.map((r, n) => ({ ...r, n })).filter(r => r.p >= 0.005 && r.made != null);
  if (shown.length < 2) return '';
  const hi = Math.max(...shown.map(r => r.made)), lo = Math.min(...shown.map(r => r.made));
  if (hi - lo < 0.05) return '';  // this week barely matters either way
  let s;
  if (k.med == null) s = `Win this week and your playoff odds go to <b>${pct(k.win)}</b>. Lose and they drop to <b>${pct(k.lose)}</b>.`;
  else {
    const at = n => shown.find(r => r.n === n);
    const parts = [[2, 'Win your game and score in the top half'], [1, 'get one of the two'], [0, 'get neither']].filter(([n]) => at(n)).map(([n, l]) => `${l} and you're at <b>${pct(at(n).made)}</b>`);
    s = parts.join('; ').replace(/^./, ch => ch.toUpperCase()) + '.';
  }
  if (hi >= 0.995 && lo < 0.9) s += ' This week can all but lock it up.';
  else if (hi < 0.05) s += ' It would take help from around the league too.';
  return `<p class="need">${s}</p>`;
}

// This week's games as scoreboard boxes, biggest stakes first. What your own result means for your playoff odds is on the My team card.
function gamesSection(b) {
  const { d, power } = b;
  const odds = power.odds;
  if (!odds.firstWeek || !odds.firstPairs.length) return '';
  const w = odds.firstWeek, rows = regRows(d, w), m = odds.firstModel, mine = myTeam(d)?.id;
  const ptsOf = id => rows.find(r => r.roster_id === id)?.points ?? 0;
  const live = d.liveWeek === w && rows.some(r => r.points > 0);
  // Expected movement in both teams' playoff odds: the win/loss swing times 2p(1-p), so a close game with a lot
  // riding on it beats a lopsided one. Taken from pre-kickoff odds so the order holds while games are played.
  const pre = power.preKick || odds;
  const swing = id => (pre.cond[id]?.win ?? 0) - (pre.cond[id]?.lose ?? 0);
  const games = odds.firstPairs.map(([a, bb]) => { const p = pre.pair[a]?.p ?? 0.5;
    return { a, b: bb, lev: 2 * p * (1 - p) * (swing(a) + swing(bb)) }; }).sort((x, y) => y.lev - x.lev);
  // Your game goes second, right after the biggest game, so you don't have to scroll for it.
  const mi = games.findIndex(g => g.a === mine || g.b === mine);
  const moved = mi > 1;
  if (moved) games.splice(1, 0, ...games.splice(mi, 1));
  const box = (g, i) => {
    const pa = odds.pair[g.a].p, started = live && (ptsOf(g.a) > 0 || ptsOf(g.b) > 0);
    const decided = live && (pa >= 0.999 || pa <= 0.001);
    const final = decided && m?.live?.[g.a] && m?.live?.[g.b] && m.sd[g.a] < 0.5 && m.sd[g.b] < 0.5;
    const my = g.a === mine || g.b === mine;
    const line = (id, p) => {
      const ahead = started ? ptsOf(id) >= ptsOf(id === g.a ? g.b : g.a) : p >= 0.5;
      // Live: points so far, with the projected final (points scored plus what's left to play) beneath.
      const sc = started ? `<span class="sc">${f2(ptsOf(id))}${m && !final ? `<small>proj ${f1(m.mu[id])}</small>` : ''}</span>`
        : m ? `<span class="sc proj" title="Expected score">${f1(m.mu[id])}</span>` : '';
      const wp = decided ? (p >= 0.5 ? (final ? '✓' : '') : '') : pct(p);
      // Live: how many starters are still to play or playing now, under the name.
      const left = started && !final ? leftTxt(startersLeft(d, w, id)) : '';
      return `<div class="gl ${ahead ? 'ahead' : ''}" data-tid="${id}">${teamCell(d.teams[id], left)}${sc}<span class="wp">${wp}</span></div>`;
    };
    const cap = i === 0 ? `Most at stake${my ? ' · yours' : ''}` : my ? 'Your game' : '';
    const capR = decided ? (final ? 'Final' : 'All but over') : '';
    return `<div class="box ${i === 0 ? 'big' : ''} ${my ? 'mygame' : ''}"><div class="cap">${cap ? `<b>${cap}</b>` : ''}${capR ? `<span>${capR}</span>` : ''}</div>${line(g.a, pa)}${line(g.b, 1 - pa)}</div>`;
  };
  const dek = `${live ? 'Live scores' : 'Expected scores'} and win chances. The game with the most playoff odds riding on it is first${moved ? ', then yours' : ''}.`;
  return sec(`Week ${w} games`, dek, `<div class="boxes games">${games.map(box).join('')}</div>`
    + `<p class="note">Playoff odds for every team are in the <a href="#table">Table</a>.</p>`
    + how('stakes', `Expected scores and win chances come from ${CONFIG.sims.toLocaleString()} simulations of the rest of the season, blending each lineup's Sleeper projection with the team's season average${live ? ', with points already scored locked in' : ''}. The biggest game is the one expected to move both teams' playoff odds the most; the order is set before kickoff.`));
}

// Plain-text recap of the front-page stories, for pasting into the group chat.
function recapText(b) {
  const strip = h => { const el = document.createElement('div'); el.innerHTML = h; return el.textContent.trim(); };
  const { d, power } = b;
  const lastWk = d.weeks.at(-1) ?? 0, wk = power.playoffs && lastWk >= d.playoffStart ? lastWk : power.last;
  const lines = [`${d.league.name}: Week ${wk} recap`, ''];
  for (const x of pickStories(b.heads, 7)) lines.push(`• ${strip(x.h)}. ${strip(x.p)}`);
  lines.push('', location.href.split('#')[0]);
  return lines.join('\n');
}

// Title-path games with their teams, scores and state, for the bracket and the My team card.
function bracketGames(b) {
  const { d, power } = b, ps = power?.playoffs;
  if (!d.bracket) return [];
  const byM = Object.fromEntries(d.bracket.map(m => [m.m, m]));
  const teamsOf = m => [m.t1 ?? fromTeam(m.t1_from), m.t2 ?? fromTeam(m.t2_from)];
  const fromTeam = f => { const m = f && byM[f.w ?? f.l]; return !m ? null : f.w != null ? m.w : m.l; };
  const lastWk = d.weeks.at(-1) ?? 0;
  return d.bracket.filter(titlePath).sort((x, y) => x.r - y.r || x.m - y.m).map(m => {
    const wk = roundWeek(d, m.r), rows = regRows(d, wk), [a, bb] = teamsOf(m);
    const pts = id => rows.find(r => r.roster_id === id)?.points ?? 0;
    const live = m.w == null && wk === d.liveWeek && rows.some(r => r.points > 0);
    const src = f => { const s2 = f && byM[f.w ?? f.l]; return s2 ? { won: f.w != null, teams: teamsOf(s2) } : null; };
    return { m, r: m.r, wk, a, b: bb, from: [src(m.t1_from), src(m.t2_from)], w: m.w, live,
             scores: a != null && bb != null && (wk <= lastWk || live) ? [pts(a), pts(bb)] : null,
             p: a != null && bb != null && m.w == null ? ps?.match[m.m] ?? null : null };
  });
}

function bracketSection(b) {
  const { d, c, power } = b, ps = power.playoffs, games = bracketGames(b);
  if (!games.length) return '';
  const seed = id => c.list.findIndex(t => t.id === id) + 1;
  const name = id => esc(d.teams[id]?.name ?? 'TBD');
  const fromLabel = f => { if (!f) return 'TBD';
    const known = f.teams.filter(id => id != null), who = f.won ? 'Winner' : 'Loser';
    return known.length === 2 ? `${who} of ${name(known[0])} / ${name(known[1])}` : known.length ? `${who} of ${name(known[0])}'s game` : `${who} of an earlier game`; };
  const side = (g, i) => {
    const id = i ? g.b : g.a;
    if (id == null) return `<div class="bt tbd">${fromLabel(g.from[i])}</div>`;
    const val = g.scores ? f2(g.scores[i]) : g.p != null ? pct(i ? 1 - g.p : g.p) : '';
    return `<div class="bt ${g.w === id ? 'won' : g.w != null ? 'lost' : ''}" data-tid="${id}"><span class="sd">${seed(id)}</span><span class="nm">${name(id)}</span><span class="sc">${val}</span></div>`;
  };
  const rounds = [...new Set(games.map(g => g.r))];
  const r1 = new Set(games.filter(g => g.r === rounds[0]).flatMap(g => [g.a, g.b]));
  const byes = games.filter(g => g.r === rounds[1]).flatMap(g => [g.a, g.b]).filter(id => id != null && !r1.has(id));
  const cols = rounds.map(r => `<div class="bround"><span class="rn">${roundName(d, r)} <span class="muted" style="font: 400 14px var(--sans)">Week ${roundWeek(d, r)}</span></span>
    ${r === rounds[0] && byes.length ? `<div class="bye">Bye: ${byes.map(id => `${seed(id)} ${name(id)}`).join(', ')}</div>` : ''}
    ${games.filter(g => g.r === r).map(g => `<div class="bgame ${g.live ? 'live' : ''}">${side(g, 0)}${side(g, 1)}
      ${g.live && g.p != null ? `<div class="bnote">Live · win chance ${pct(g.p)} – ${pct(1 - g.p)}</div>` : !g.scores && g.p != null ? '<div class="bnote">Win chance</div>' : ''}</div>`).join('')}</div>`).join('');
  const dek = ps.done ? `${name(ps.champion)} won the title.` : 'Seed on the left; score or win chance on the right.';
  return sec('Playoffs', dek, `<div class="bracket" style="--n:${rounds.length}">${cols}</div>`
    + (ps.done ? '' : how('bracket', `Win chances come from ${CONFIG.sims.toLocaleString()} simulations of the rest of the bracket, using each team's projected lineup for that week${d.liveWeek ? ' and, for games under way, the points already scored' : ''}.`)));
}

// ============================== TABLE ==============================
function tabTable(b) {
  const { d, c, power } = b;
  if (!power) return sec('Standings', '', '<p class="muted">Available after Week 1.</p>');
  const { history, odds } = power;
  const cur = history.at(-1).rows, prev = history.length > 1 ? history.at(-2).rows : null;
  const nS = Object.keys(odds.sos || {}).length, showS = !odds.final && nS > 0;
  // Counted from whichever end is nearer: "Hardest", "3rd hardest", …, "2nd easiest", "Easiest".
  const sosTxt = id => { if (odds.sos[id] == null) return '<span class="muted">–</span>';
    const r = odds.sosRank[id], hard = r <= (nS + 1) / 2, n = hard ? r : nS + 1 - r;
    return `<span title="Remaining opponents average ${f1(odds.sos[id])} expected points">${n === 1 ? (hard ? 'Hardest' : 'Easiest') : `${ord(n)} ${hard ? 'hardest' : 'easiest'}`}</span>`; };
  const seeds = d.league.settings.playoff_teams || 6;
  const pw = Object.fromEntries(cur.map(r => [r.id, r]));
  // Power: rank by power score, with places moved since last week.
  const powerTxt = id => { const r = pw[id]; if (!r) return '<span class="muted">–</span>';
    const p = prev?.find(z => z.id === id), mv = p ? p.rank - r.rank : 0;
    return `<span title="Power score ${f1(r.score)} of 100">${r.rank}</span>${mv > 0 ? ` <span class="mv up">▲${mv}</span>` : mv < 0 ? ` <span class="mv down">▼${-mv}</span>` : ''}`; };
  const rows = c.list.map((t, i) => `<tr data-tid="${t.id}" class="${i === seeds - 1 ? 'cut' : ''}"><td class="rkc"><span class="rk">${i + 1}</span></td><td class="l">${teamCell(t)}</td>
      <td class="big">${rec(t)}${t.t ? '-' + t.t : ''}</td><td class="opt">${f2(t.pf)}</td><td class="opt">${powerTxt(t.id)}</td>
      <td class="opt ${t.luck > 0.5 ? 'up' : t.luck < -0.5 ? 'down' : 'muted'}">${Math.abs(t.luck) < 0.05 ? '0.0' : `${t.luck > 0 ? '+' : '−'}${f1(Math.abs(t.luck))}`}</td>
      <td><div class="cellbar"><span class="strong">${oddsTxt(odds, t.id)}</span>${odds.final ? '' : bar(odds.made[t.id])}</div></td>
      ${odds.byes ? `<td class="opt">${odds.final ? (odds.bye[t.id] ? 'Yes' : '<span class="muted">–</span>') : pct(odds.bye[t.id])}</td>` : ''}${odds.champ ? `<td>${champTxt(odds, power, t.id)}</td>` : ''}${showS ? `<td class="opt">${sosTxt(t.id)}</td>` : ''}</tr>`).join('');
  const table = `<div class="scroll"><table class="t std">
    <thead><tr><th scope="col">#</th><th scope="col" class="l">Team</th><th scope="col" title="Wins and losses${d.leagueAvg ? ', including the weekly median game' : ''}">Record</th><th scope="col" class="opt" title="Points for">PF</th><th scope="col" class="opt" title="Rank by power score; ▲▼ places moved since last week">Power</th><th scope="col" class="opt" title="Wins above or below what your weekly scores would predict">Luck</th><th scope="col">Playoffs</th>${odds.byes ? '<th scope="col" class="opt">Bye</th>' : ''}${odds.champ ? '<th scope="col">Title</th>' : ''}${showS ? '<th scope="col" class="opt" title="How tough the remaining opponents are">Schedule left</th>' : ''}</tr></thead>
    <tbody>${rows}</tbody></table></div><div class="note">The heavy line is the playoff cut.<span class="opt-note"> PF: points for. Power: rank by recent form and all-play record, ▲▼ places moved since last week. Luck: wins above (+) or below (−) what your weekly scores predict.</span></div>`;
  const oddsLive = d.liveWeek && d.liveWeek === odds.firstWeek && regRows(d, d.liveWeek).some(r => r.points > 0);
  const dek = `After Week ${power.last}.${d.leagueAvg ? ' Records count the weekly median game, so each week is two results.' : ''} The top ${seeds} make the playoffs${oddsLive ? `; odds include live Week ${d.liveWeek} scores` : ''}.`;
  return sec('Standings', dek, table + how('table',
      !odds.final && `Playoff and title odds come from ${CONFIG.sims.toLocaleString()} simulations of the rest of the real schedule${d.leagueAvg ? ', median games included' : ''}, seeded by wins then points for. Each team's expected score blends its Sleeper projection (${Math.round(PROJ_WEIGHT * 100)}%) with its season average, and the setup was tested against the league's 2020–2025 seasons. "Clinched" and "Eliminated" are certain.`,
      `On wider screens: Power ranks teams by a 0–100 score, made of all-play win rate for the season (50%), all-play for the last three weeks (25%) and actual record (25%). All-play is your record if you'd played every team every week. Luck is how many more head-to-head wins you have than that all-play rate predicts.${showS ? ' "Schedule left" ranks how tough each team\'s remaining opponents are.' : ''}`))
    + resultsByWeek(b);
}

// Every regular-season week's results as scoreboard boxes, one week at a time, led by who won that week's money.
function resultsByWeek(b) {
  const { d, c, players } = b;
  const weeks = [...new Set(c.games.map(g => g.week))].sort((x, y) => y - x);
  if (!weeks.length) return '';
  const blocks = weeks.map((w, i) => {
    const games = c.games.filter(g => g.week === w).sort((x, y) => Math.max(y.pa, y.pb) - Math.max(x.pa, x.pb));
    const st = c.weekStats[w], rows = regRows(d, w);
    const sorted = [...rows].sort((x, y) => y.points - x.points), top = new Set(sorted.slice(0, rows.length / 2).map(r => r.roster_id));
    const line = (id, p, won) => `<div class="gl ${won ? 'ahead' : 'lost'}" data-tid="${id}">${teamCell(d.teams[id], false)}${d.leagueAvg && top.has(id) ? '<span class="tagm" title="Top-half score: also won the median game">+M</span>' : ''}<span class="sc ${p === st.hi ? 'hi' : p === st.lo ? 'lo' : ''}">${f2(p)}</span></div>`;
    const body = games.map(g => { const [win, lose, a, bb] = winLose(g);
      return `<div class="box">${line(win, a, true)}${line(lose, bb, false)}</div>`; }).join('');
    let star = null;
    for (const r of rows) (r.starters || []).forEach((pid, k) => { const p = r.starters_points?.[k] ?? 0; if (pid && pid !== '0' && (!star || p > star.p)) star = { pid, p, id: r.roster_id }; });
    const pay = c.payouts.find(p => p.week === w);
    const head = [pay && `<b>${pay.winners.map(id => esc(d.teams[id].name)).join(' and ')}</b> ${pay.winners.length > 1 ? 'split' : 'won'} the <span class="money">${usd(pay.each * pay.winners.length)}</span> with ${f2(pay.score)}`,
      star && players && `Best start: ${esc(players[star.pid]?.n || 'Unknown player')}, ${f1(star.p)} for ${esc(d.teams[star.id].name)}`].filter(Boolean).join(' · ');
    return `<div data-pick-of="week" data-v="${w}" ${i ? 'hidden' : ''}>${head ? `<p class="wk-h">${head}</p>` : ''}<div class="boxes three">${body}</div></div>`;
  }).join('');
  const pick = `<select class="sel" data-pick="week" aria-label="Week">${weeks.map(w => `<option value="${w}">Week ${w}</option>`).join('')}</select>`;
  const legend = `<span class="down">Red</span>: the week's low score${d.leagueAvg ? ' · +M: also won the median&nbsp;game' : ''}`;
  return sec('Results', legend, blocks, pick);
}
