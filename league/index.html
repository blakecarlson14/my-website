function tabManagers(b) {
  const { d, lu, mv } = b;
  const T = id => d.teams[id];
  let html = '';
  if (lu) {
    const rows = Object.entries(lu.per).filter(([, x]) => x.weeks).sort((x, y) => y[1].eff - x[1].eff);
    html += sec('Lineups', 'Points started vs. best possible', `<div class="scroll"><table class="t">
      <thead><tr><th scope="col">#</th><th scope="col" class="l">Team</th><th scope="col">Accuracy</th><th scope="col" title="Losses where the best possible lineup would have won">Bench losses</th><th scope="col" class="opt" title="Best possible lineup minus points started, all season">Pts left on bench</th><th scope="col" class="opt" title="Weeks with the best possible lineup">Perfect wks</th><th scope="col" class="l opt" title="The week with the most points left on the bench">Worst week</th></tr></thead><tbody>
      ${rows.map(([id, x], i) => `<tr data-tid="${id}"><td class="rkc"><span class="rk">${i + 1}</span></td><td class="l">${teamCell(T(id), false)}</td>
        <td class="big">${(x.eff * 100).toFixed(1)}%</td><td class="${x.blown ? 'down strong' : 'muted'}">${x.blown}</td><td class="opt">${f1(x.opt - x.act)}</td><td class="opt">${x.perfect}</td>
        <td class="l muted opt">${x.worst && x.worst.left > 0 ? `Wk ${x.worst.w} · ${f1(x.worst.left)} pts` : '–'}</td></tr>`).join('')}
    </tbody></table></div>` + (lu.blunders.length ? `<div class="note">Worst bench loss: ${esc(T(lu.blunders[0].id).name)} in Week ${lu.blunders[0].w}, ${f2(lu.blunders[0].act)}–${f2(lu.blunders[0].oppPts)} to ${esc(T(lu.blunders[0].opp).name)} with ${f2(lu.blunders[0].opt)} possible.</div>` : '')
      + how('lineups', 'The best possible lineup is the highest-scoring legal lineup from that week\'s roster, worked out after the fact. "Bench losses" are losses that lineup would have won.'));
  } else html += sec('Lineups', '', '<p class="muted">Couldn\'t load the NFL player list, so lineup stats are unavailable right now.</p>');

  html += sec('Best pickups', 'By points started', `<div class="scroll"><table class="t">
    <thead><tr><th scope="col" class="l">Player</th><th scope="col">Pts started</th><th scope="col" class="l">Added by</th><th scope="col" class="opt">Week</th><th scope="col" class="opt">Cost</th></tr></thead><tbody>
    ${mv.pickups.slice(0, 10).map(p => `<tr data-tid="${p.rid}"><td class="l"><b>${esc(p.name)}</b><span class="as">${esc(p.meta)}</span></td><td class="big">${f1(p.pts)}</td><td class="l wrap">${esc(T(p.rid).name)}</td>
      <td class="opt">${p.w}</td><td class="opt">${p.bid == null ? '<span class="muted">Free agent</span>' : `${usd(p.bid)} bid`}</td></tr>`).join('') || '<tr><td colspan="5" class="l muted">No pickups yet.</td></tr>'}
  </tbody></table></div>`);

  if (mv.trades.length) {
    const anyPts = mv.trades.some(t => t.sides.some(s => s.got.some(g => g.pts > 0)));
    html += sec('Trades', anyPts ? 'Points each side has started since' : '', mv.trades.map(t => `<div class="trade">
      <div><b>Week ${t.w}</b><div class="muted" style="font-size:12px">${new Date(t.created).toLocaleDateString([], { month: 'short', day: 'numeric' })}</div></div>
      <div class="sides">${t.sides.map(s => { const tot = s.got.reduce((a, g) => a + g.pts, 0);
        return `<div data-tid="${s.rid}">${teamCell(T(s.rid), false)} <span class="muted">got${anyPts && s.got.length > 1 ? ` · ${f1(tot)} pts started` : ''}</span><ul>
          ${s.got.map(g => `<li><b>${esc(g.name)}</b> <span class="muted">${esc(g.meta)}${anyPts ? ` · ${f1(g.pts)}` : ''}</span></li>`).join('')}
          ${s.picks.map(p => `<li>${esc(p)}</li>`).join('')}${s.faab ? `<li>${usd(s.faab)} FAAB</li>` : ''}
          ${!s.got.length && !s.picks.length && !s.faab ? '<li class="muted">Nothing</li>' : ''}</ul></div>`; }).join('')}</div></div>`).join(''));
  }
  return html;
}

// ============================== HISTORY ==============================
// Every season loads in parallel. A season that fails is left out and flagged, rather than breaking the tab.
async function loadHistory() {
  if (state.history) return state.history;
  await state.chainDone;
  const all = await Promise.all(state.chain.map(async x => {
    if (state.cache[x.id]) return state.cache[x.id];
    try { const d = await load(x.id, { light: true, league: x.league }); return { d, c: compute(d) }; }
    catch (e) { console.warn('history', x.season, e); return null; }
  }));
  const seasons = all.filter(Boolean);
  seasons.missing = all.length - seasons.length + seasons.filter(s => s.d.failed).length;
  state.history = seasons;
  return seasons;
}

function tabHistory(seasons) {
  const cur = state.cur.d;
  const latest = {};
  for (const { d } of [...seasons].reverse()) for (const t of Object.values(d.teams)) if (t.uid) latest[t.uid] = { name: t.name, owner: t.owner };
  const who = uid => latest[uid]?.name || 'Former manager';
  // Old seasons show each manager's current name, with the name they used that year on a second line.
  // after: a value (record, points) that belongs right next to the name, ahead of the old-name line.
  const nm = (t, after = '') => !t ? '<span class="muted">–</span>' : !t.uid || sameName(who(t.uid), t.name) ? esc(t.name) + after
    : `${esc(who(t.uid))}${after}<span class="as">as ${esc(t.name.trim())}</span>`;
  // In a "X over Y" line a second line can't say whose old name it is, so it goes in brackets right after its own name.
  const nmi = t => !t ? '<span class="muted">–</span>' : !t.uid || sameName(who(t.uid), t.name) ? esc(t.name)
    : `${esc(who(t.uid))} <span class="muted">(as ${esc(t.name.trim())})</span>`;
  const byUid = {};
  const rowFor = uid => byUid[uid] ||= { uid, seasons: 0, titles: 0, finals: 0, playoffs: 0, w: 0, l: 0, t: 0, mw: 0, ml: 0, pf: 0, games: 0, highs: 0 };
  const records = [], results = [], h2h = {}, trophies = [];
  for (const { d, c } of seasons) {
    const seeds = d.league.settings.playoff_teams || 6;
    const done = d.complete;
    c.list.forEach((t, i) => {
      if (!t.uid) return;
      const r = rowFor(t.uid);
      r.seasons++; r.w += t.w; r.l += t.l; r.t += t.t; r.mw += t.mw; r.ml += t.ml; r.pf += t.pf; r.highs += t.highs;
      r.games += Object.keys(t.scores).filter(w => +w < d.playoffStart).length;
      if (done && i < seeds) r.playoffs++;
    });
    if (done && d.champion != null && d.teams[d.champion]?.uid) { rowFor(d.teams[d.champion].uid).titles++; rowFor(d.teams[d.champion].uid).finals++; }
    if (done && d.runnerUp != null && d.teams[d.runnerUp]?.uid) rowFor(d.teams[d.runnerUp].uid).finals++;
    for (const t of c.list) for (const [w, p] of Object.entries(t.scores)) if (+w < d.playoffStart && p > 0) records.push({ season: d.league.season, w: +w, p, t });
    for (const g of c.games) {
      const A = d.teams[g.a], B = d.teams[g.b];
      const [win, lose, a, bb] = g.pa >= g.pb ? [A, B, g.pa, g.pb] : [B, A, g.pb, g.pa];
      results.push({ season: d.league.season, w: g.week, win, lose, m: a - bb });
      if (A.uid && B.uid) {
        const k1 = (h2h[A.uid] ||= {}), k2 = (h2h[B.uid] ||= {});
        k1[B.uid] ||= { w: 0, l: 0 }; k2[A.uid] ||= { w: 0, l: 0 };
        if (g.pa > g.pb) { k1[B.uid].w++; k2[A.uid].l++; } else if (g.pb > g.pa) { k2[A.uid].w++; k1[B.uid].l++; }
      }
    }
    trophies.push({ id: d.league.league_id, season: d.league.season, done, champ: d.champion != null ? d.teams[d.champion] : null, ru: d.runnerUp != null ? d.teams[d.runnerUp] : null,
      top: c.list[0], most: [...c.list].sort((x, y) => y.pf - x.pf)[0], last: c.list.at(-1), money: [...c.list].sort((x, y) => y.highs - x.highs)[0] });
  }

  const trophyTable = `<div class="scroll"><table class="t">
    <thead><tr><th scope="col" class="l">Year</th><th scope="col" class="l">Champion</th><th scope="col" class="l opt">Runner-up</th><th scope="col" class="l opt">Best record</th><th scope="col" class="l opt">Most points</th><th scope="col" class="l">Last place</th></tr></thead><tbody>
    ${trophies.map(x => `<tr><td class="l strong">${x.id === cur.league.league_id ? esc(x.season) : `<button type="button" class="lnk" data-season="${esc(x.id)}">${esc(x.season)}</button>`}</td>
      <td class="l wrap">${x.done ? (x.champ ? `<b>${nm(x.champ)}</b>` : '–') : '<span class="muted">In progress</span>'}</td><td class="l wrap opt">${x.done ? nm(x.ru) : ''}</td>
      <td class="l wrap opt">${nm(x.top, ` <span class="muted">${rec(x.top)}</span>`)}</td><td class="l wrap opt">${nm(x.most, ` <span class="muted">${f2(x.most.pf)}</span>`)}</td>
      <td class="l wrap">${x.done ? nm(x.last) : '<span class="muted">TBD</span>'}</td></tr>`).join('')}
  </tbody></table></div>`;

  const winPct = r => (r.w + r.mw) / Math.max(1, r.w + r.l + r.mw + r.ml);
  // "Former" means not in the newest season, whichever season is open in the header.
  const newest = seasons.find(s => s.d.league.league_id === state.chain[0]?.id) || seasons[0];
  const curUids = new Set(Object.values(newest.d.teams).map(t => t.uid).filter(Boolean));
  const all = Object.values(byUid).filter(r => latest[r.uid]).sort((a, b) => b.titles - a.titles || winPct(b) - winPct(a));
  const allTime = `<div class="scroll"><table class="t">
    <thead><tr><th scope="col" class="l">Manager</th><th scope="col" class="opt">Seasons</th><th scope="col">Titles</th><th scope="col" class="opt">Finals</th><th scope="col" title="Seasons that made the playoffs">Playoff trips</th><th scope="col">Record</th><th scope="col" class="opt">Win %</th><th scope="col" class="opt">Pts / game</th><th scope="col" class="opt">Weekly highs</th></tr></thead><tbody>
    ${all.map(r => { const gw = r.w + r.mw, gl = r.l + r.ml; return `<tr data-uid="${esc(r.uid)}"><td class="l wrap"><b>${esc(who(r.uid))}</b>${(sub => sub ? `<span class="as">${sub}</span>` : '')([sameName(latest[r.uid].owner, who(r.uid)) ? '' : esc(latest[r.uid].owner), curUids.has(r.uid) ? '' : 'former member'].filter(Boolean).join(' · '))}</td>
      <td class="opt">${r.seasons}</td><td class="${r.titles ? 'big' : 'muted'}">${r.titles || '0'}</td><td class="opt">${r.finals}</td><td>${r.playoffs}</td>
      <td class="strong">${gw}-${gl}</td><td class="opt">${(winPct(r) * 100).toFixed(1)}%</td>
      <td class="opt">${f2(r.pf / Math.max(1, r.games))}</td><td class="opt">${r.highs}</td></tr>`; }).join('')}
  </tbody></table></div><div class="note">Sorted by titles, then win %. Regular-season records over ${seasons.length} seasons on Sleeper, median games included. Playoff trips and finals count finished seasons.</div>`;

  records.sort((a, b) => b.p - a.p);
  results.sort((a, b) => b.m - a.m);
  const close = [...results].sort((a, b) => a.m - b.m);
  const list = (title, rows) => `<div><div class="sub-h">${title}</div><table class="t">${rows}</table></div>`;
  const scoreRow = r => `<tr><td class="l wrap">${nm(r.t)}</td><td class="muted">${esc(r.season)} W${r.w}</td><td class="strong">${f2(r.p)}</td></tr>`;
  const gameRow = (g, v) => `<tr><td class="l wrap">${nmi(g.win)} <span class="muted">over</span> ${nmi(g.lose)}</td><td class="muted">${esc(g.season)} W${g.w}</td><td class="strong">${v}</td></tr>`;
  const recs = `<div class="cols even">
    ${list('Highest scores', records.slice(0, 5).map(scoreRow).join(''))}
    ${list('Lowest scores', records.slice(-5).reverse().map(scoreRow).join(''))}
    ${list('Biggest blowouts', results.slice(0, 5).map(g => gameRow(g, `+${f1(g.m)}`)).join(''))}
    ${list('Closest games', close.slice(0, 5).map(g => gameRow(g, f2(g.m))).join(''))}
  </div>`;

  // Rivalries: pick a manager, see their all-time record against everyone else.
  const uids = Object.values(cur.teams).map(t => t.uid).filter(Boolean);
  const cell = (a, b) => h2h[a]?.[b];
  let top = null;
  for (const a of uids) for (const bb of uids) { const v = cell(a, bb); if (a < bb && v) { const n = v.w + v.l, gap = Math.abs(v.w - v.l);
    if (!top || n > top.n || (n === top.n && gap < top.gap)) top = { a, b: bb, v, n, gap }; } }
  const ordered = [...uids].sort((x, y) => who(x).localeCompare(who(y)));
  const first = uids.includes(myUid()) ? myUid() : top ? top.a : ordered[0];
  const rivalBlock = a => {
    const opp = uids.filter(bb => bb !== a).map(bb => ({ bb, v: cell(a, bb) || { w: 0, l: 0 } })).sort((x, y) => (y.v.w + y.v.l) - (x.v.w + x.v.l) || y.v.w - x.v.w);
    return `<div data-pick-of="rival" data-v="${esc(a)}" ${a === first ? '' : 'hidden'}><table class="t" style="max-width:560px">
      <thead><tr><th scope="col" class="l">Against</th><th scope="col">Record</th></tr></thead><tbody>
      ${opp.map(({ bb, v }) => { const n = v.w + v.l, p = n ? v.w / n : 0;
        return `<tr data-uid="${esc(bb)}"><td class="l">${esc(who(bb))}</td><td class="strong ${!n ? 'muted' : p > 0.5 ? 'up' : p < 0.5 ? 'down' : ''}">${n ? `${v.w}-${v.l}` : '–'}</td></tr>`; }).join('')}
    </tbody></table></div>`;
  };
  const rivalPick = `<select class="sel" data-pick="rival" aria-label="Manager">${ordered.map(u => `<option value="${esc(u)}" ${u === first ? 'selected' : ''}>${esc(who(u))}</option>`).join('')}</select>`;
  const rivalNote = top ? `<p class="note" style="margin: 0 0 10px">Most-played series: ${esc(who(top.a))} vs. ${esc(who(top.b))}, ${top.v.w}-${top.v.l} over ${top.n} meetings.</p>` : '';

  const warn = seasons.missing ? warnBox('Some past seasons didn\'t fully load from Sleeper, so history may be incomplete.') : '';
  return warn + sec('Champions', `${seasons.length} seasons on Sleeper · pick a year to open that season`, trophyTable)
    + sec('Head to head', 'All-time regular season · most meetings first', rivalNote + ordered.map(rivalBlock).join(''), rivalPick)
    + sec('All-time standings', '', allTime) + sec('Record book', 'Regular season, every season', recs);
}

// ============================== FLOW ==============================
const warnBox = msg => `<div class="warn" role="status"><span>${esc(msg)}</span><button type="button" data-retry>Try again</button></div>`;

async function analyze(d) {
  const c = compute(d);
  let players = null, pool = null;
  try { ({ map: players, pool } = await loadPlayers(neededIds(d))); } catch (e) { console.warn('players', e); }
  d.players = players;
  d.repl = pool ? replacementLevels(d, pool) : null;
  const power = computePower(d);
  const lu = players ? lineups(d, players) : null;
  const b = { d, c, power, players, lu, mv: moves(d, players), updated: new Date() };
  b.heads = headlines(b);
  return b;
}

// Highlight the viewer's team in every table and list.
function markMine() {
  const b = state.cur, t = b && myTeam(b.d), uid = myUid();
  document.querySelectorAll('#app [data-tid]').forEach(el => el.classList.toggle('me', !!t && el.dataset.tid === String(t.id)));
  document.querySelectorAll('#app [data-uid]').forEach(el => el.classList.toggle('me', !!uid && el.dataset.uid === uid));
  document.querySelectorAll('#app [data-tids]').forEach(el => el.classList.toggle('me', !!t && el.dataset.tids.split(' ').includes(String(t.id))));
}

// keepView (live refreshes): the redraw keeps open toggles, sideways scroll positions and picked weeks, so a reader isn't moved.
async function renderTab({ keepView = false } = {}) {
  const b = state.cur; if (!b) return;
  const view = keepView ? {
    open: [...document.querySelectorAll('#app details[open]')].map(x => x.dataset.k),
    scroll: [...document.querySelectorAll('#app .scroll')].map(x => x.scrollLeft),
    picks: [...document.querySelectorAll('#app select[data-pick]')].map(x => [x.dataset.pick, x.value]),
  } : null;
  renderChrome(b);
  const t = state.tab;
  if (t === 'history') {
    setLoading(`Digging through ${state.chain.length} seasons of records…`);
    try { const seasons = await loadHistory(); if (state.tab === 'history') { $('#app').innerHTML = tabHistory(seasons); markMine(); } }
    catch (e) { $('#app').innerHTML = `<div class="err">Couldn't load league history: ${esc(e.message)}</div>`; }
    return;
  }
  const warn = b.d.failed ? warnBox('Some data didn\'t load from Sleeper, so a few numbers may be off.') : '';
  $('#app').innerHTML = warn + (t === 'table' ? tabTable(b) : t === 'managers' ? tabManagers(b) : tabWeek(b));
  if (view) {
    view.open.forEach(k => { const el = document.querySelector(`#app details[data-k="${k}"]`); if (el) el.open = true; });
    view.picks.forEach(([k, v]) => { const el = document.querySelector(`#app select[data-pick="${k}"]`); if (el && [...el.options].some(o => o.value === v)) { el.value = v; showPick(el); } });
    document.querySelectorAll('#app .scroll').forEach((el, i) => { if (view.scroll[i] != null) el.scrollLeft = view.scroll[i]; });
  }
  document.querySelectorAll('#app .scroll').forEach(el => el.classList.toggle('scrolled', el.scrollLeft > 2));
  markMine();
  if (!view && location.hash === '#money' && $('#money')) { $('#money').scrollIntoView(); history.replaceState(null, '', '#week'); }
}
// A <select data-pick="k"> shows the matching [data-pick-of="k"][data-v] block and hides the others.
function showPick(sel) {
  document.querySelectorAll(`#app [data-pick-of="${sel.dataset.pick}"]`).forEach(el => { el.hidden = el.dataset.v !== sel.value; });
}

async function openSeason(id) {
  setLoading('Fetching the latest from Sleeper…');
  stopLive();
  try {
    let b = state.cache[id];
    if (!b) {
      // The current season is always fetched fresh; past seasons reuse the league record from the season list.
      const d = await load(id, { league: id === state.chain[0]?.id ? null : state.chain.find(x => x.id === id)?.league });
      b = await analyze(d);
      state.cache[id] = b;
      state.history = null;
    }
    state.cur = b;
    await renderTab();
    startLive();
  } catch (e) {
    console.error(e);
    $('#app').innerHTML = `<div class="err">Couldn't load from Sleeper: ${esc(e.message)}</div>`;
  }
}

// ============================== LIVE UPDATES ==============================
// During a live week, re-fetch just that week's matchups every 90 seconds (while the page is visible)
// and redraw the live parts. When Sleeper finalizes the week, reload the whole season.
const LIVE_MS = 90000;
let liveTimer = null;
function stopLive() { clearInterval(liveTimer); liveTimer = null; }
function startLive() {
  stopLive();
  const b = state.cur;
  if (b?.d.liveWeek && b.d.league.league_id === state.chain[0]?.id) liveTimer = setInterval(() => { if (!document.hidden) refreshLive(); }, LIVE_MS);
}
async function refreshLive() {
  const b = state.cur, d = b.d, id = d.league.league_id, w = d.liveWeek;
  try {
    const [lg, rows, games] = await Promise.all([get(`/league/${id}`), get(`/league/${id}/matchups/${w}`), nflGames(d.league.season, w)]);
    if (state.cur !== b) return;
    if ((lg.settings.last_scored_leg || 0) !== (d.league.settings.last_scored_leg || 0) || lg.status !== d.league.status) {
      delete state.cache[id]; state.history = null;
      return openSeason(id);
    }
    d.byWeek[w] = rows;
    if (games) { d.games = games.status; d.gameLeft = games.left; }
    b.power = computePower(d, b.power); b.heads = headlines(b); b.updated = new Date();
    if (['week', 'table'].includes(state.tab)) await renderTab({ keepView: true });
    else renderChrome(b);
  } catch (e) { console.warn('live refresh', e); }
}

// ============================== START ==============================
// Past seasons open from the History tab's Champions table, and the header links back. The URL keeps ?season=.
function goSeason(id) {
  const x = state.chain.find(s => s.id === id), url = new URL(location.href);
  if (x && x !== state.chain[0]) url.searchParams.set('season', x.season); else url.searchParams.delete('season');
  url.hash = 'week';
  history.replaceState(null, '', url);
  state.tab = 'week';
  window.scrollTo(0, 0);
  openSeason(id);
}
// The season list builds in the background, so the current season shows without waiting on older ones.
async function init() {
  const setMine = uid => { try { localStorage.setItem(MINE_KEY, uid); } catch {} renderTab(); };
  $('#mine').onchange = e => setMine(e.target.value);
  document.addEventListener('click', async e => {
    if (e.target.closest('[data-retry]')) { state.cache = {}; state.history = null; openSeason(state.cur?.d.league.league_id || state.chain[0]?.id); }
    const sn = e.target.closest('[data-season]');
    if (sn) goSeason(sn.dataset.season);
    const cp = e.target.closest('[data-copy-recap]');
    if (cp && state.cur) {
      try { await navigator.clipboard.writeText(recapText(state.cur)); cp.textContent = 'Copied'; }
      catch { cp.textContent = 'Couldn\'t copy'; }
      setTimeout(() => { cp.textContent = COPY_LABEL; }, 2000);
    }
  });
  document.addEventListener('change', e => {
    if (e.target.matches('select[data-pick]')) showPick(e.target);
  });
  // Sideways-scrolled tables fade the edge of the sticky team column.
  document.addEventListener('scroll', e => { const el = e.target; if (el.classList?.contains('scroll')) el.classList.toggle('scrolled', el.scrollLeft > 2); }, true);
  window.addEventListener('hashchange', () => { state.tab = tabFromHash(); window.scrollTo(0, 0); renderTab(); });
  try {
    const first = await get(`/league/${CONFIG.leagueId}`);
    state.chain = [{ id: first.league_id, season: first.season, league: first }];
    state.chainDone = seasonChain(first.previous_league_id)
      .then(rest => { state.chain.push(...rest); })
      .catch(e => console.warn('season list', e));
    const want = qs.get('season');
    if (want && want !== first.season) {
      await state.chainDone;
      const x = state.chain.find(s => s.season === want);
      if (x) return openSeason(x.id);
    }
    await openSeason(first.league_id);
  } catch (e) {
    $('#app').innerHTML = `<div class="err">Couldn't reach Sleeper: ${esc(e.message)}</div>`;
  }
}
init();
</script>
</body>
