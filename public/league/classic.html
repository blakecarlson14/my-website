<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>League Dashboard</title>
<style>
  :root {
    --paper: #f6f7f9; --panel: #ffffff; --paper-2: #eef1f5; --ink: #16181d; --ink-2: #3b414c; --muted: #646b78;
    --rule: #e3e6eb; --hair: #e3e6eb; --hair-2: #b8bec8;
    --accent: #2f6fde; --gold: #c58a00; --gold-bar: #e0a800; --gold-bg: #fff4d6; --low-bg: #fde8e8; --up: #1a7f4b; --down: #b42318;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --serif: var(--sans); --cond: var(--sans);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #0f1115; --panel: #171a20; --paper-2: #222731; --ink: #e8eaee; --ink-2: #c3c8d1; --muted: #9aa1ad;
      --rule: #2a2f38; --hair: #2a2f38; --hair-2: #5b6370;
      --accent: #6c9cf0; --gold: #f0b429; --gold-bar: #d9a21f; --gold-bg: #3a2f10; --low-bg: #3a1a1a; --up: #4cc38a; --down: #f28b82;
    }
  }
  :root[data-theme="dark"] {
    --paper: #0f1115; --panel: #171a20; --paper-2: #222731; --ink: #e8eaee; --ink-2: #c3c8d1; --muted: #9aa1ad;
    --rule: #2a2f38; --hair: #2a2f38; --hair-2: #5b6370;
    --accent: #6c9cf0; --gold: #f0b429; --gold-bar: #d9a21f; --gold-bg: #3a2f10; --low-bg: #3a1a1a; --up: #4cc38a; --down: #f28b82;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 var(--sans); }
  a { color: inherit; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px 48px; overflow-x: clip; }

  /* Scoreboard strip */
  .strip { background: var(--panel); border-bottom: 1px solid var(--hair); }
  .strip-in { display: flex; overflow-x: auto; max-width: 1100px; margin: 0 auto; scrollbar-width: none; }
  .strip-in::-webkit-scrollbar { display: none; }
  .strip .tag { flex: none; display: flex; align-items: center; padding: 0 12px 0 16px; font-size: 12px; font-weight: 600; color: var(--muted); border-right: 1px solid var(--hair); }
  .strip .tag b { margin-left: 6px; background: var(--low-bg); color: var(--down); border-radius: 999px; padding: 1px 7px; font-weight: 600; }
  .game { flex: 1 1 0; min-width: 140px; padding: 7px 12px; font-size: 13px; line-height: 1.35; border-right: 1px solid var(--hair); }
  .game .r { display: flex; justify-content: space-between; gap: 10px; color: var(--muted); }
  .game .r span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .game .r.ahead { color: var(--ink); font-weight: 600; }
  .game .r span:last-child { font-variant-numeric: tabular-nums; }

  /* Header */
  .mast { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "title ctl" "date date" "nav nav"; align-items: end; gap: 2px 12px; padding-top: 20px; }
  .mast .top { display: contents; }
  .mast h1 { grid-area: title; margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
  #dateline { grid-area: date; color: var(--muted); font-size: 13px; }
  .mast .ctl { grid-area: ctl; display: flex; gap: 8px; align-items: center; }
  .mast select, .mast button { font: inherit; font-size: 14px; color: var(--ink); background: var(--panel); border: 1px solid var(--hair); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  .mast .motto, .mast .rule2 { display: none; }
  nav.tabs { grid-area: nav; display: flex; gap: 4px; margin-top: 14px; border-bottom: 1px solid var(--hair); overflow-x: auto; scrollbar-width: none; }
  nav.tabs::-webkit-scrollbar { display: none; }
  nav.tabs a { font-size: 14px; font-weight: 600; color: var(--muted); text-decoration: none; padding: 10px 12px; border-bottom: 2px solid transparent; white-space: nowrap; }
  nav.tabs a:hover { color: var(--ink); }
  nav.tabs a.on { color: var(--accent); border-bottom-color: var(--accent); }

  /* Cards */
  .sec { margin-top: 16px; background: var(--panel); border: 1px solid var(--hair); border-radius: 12px; padding: 16px; min-width: 0; }
  .sec-h { margin-bottom: 12px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
  .sec-h h2 { font-size: 16px; font-weight: 600; margin: 0; }
  .sec-h .dek { color: var(--muted); font-size: 13px; }
  .sub-h { font-size: 14px; font-weight: 600; margin: 20px 0 6px; }
  .cols { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 16px; margin-top: 16px; }
  .cols:not(.even) > * { background: var(--panel); border: 1px solid var(--hair); border-radius: 12px; padding: 16px; min-width: 0; }
  .cols.even { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); margin-top: 0; }
  .cols.even > div > .sec { height: calc(100% - 16px); }
  .sec .cols.even { gap: 0 24px; }
  @media (max-width: 860px) { .cols, .cols.even { grid-template-columns: minmax(0, 1fr); } }
  .note { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .muted { color: var(--muted); }
  .up { color: var(--up); } .down { color: var(--down); }
  .money { color: var(--gold); font-weight: 700; }
  .loading { padding: 60px 0; text-align: center; color: var(--muted); }
  .err { margin-top: 16px; padding: 12px; border-radius: 10px; background: var(--low-bg); color: var(--down); }

  /* Front page */
  .lead .kicker, .brief .kicker, .label { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--accent); }
  .lead h3 { font-size: 28px; line-height: 1.15; font-weight: 700; letter-spacing: -0.01em; margin: 6px 0 8px; text-wrap: balance; }
  .lead .dek { font-size: 16px; color: var(--ink-2); margin: 0; }
  .byline { font-size: 12px; color: var(--muted); margin-top: 10px; }
  .briefs { display: grid; grid-template-columns: 1fr 1fr; gap: 0 20px; margin-top: 16px; border-top: 1px solid var(--hair); }
  @media (max-width: 600px) { .briefs { grid-template-columns: 1fr; } }
  .brief { padding: 12px 0; border-bottom: 1px solid var(--hair); }
  .brief h4 { font-size: 16px; font-weight: 600; line-height: 1.3; margin: 3px 0 4px; text-wrap: balance; }
  .brief p { margin: 0; font-size: 13px; color: var(--muted); }
  .race { width: 100%; border-collapse: collapse; font-size: 14px; }
  .race td { padding: 5px 0; border-bottom: 1px solid var(--hair); }
  .race td.p { text-align: right; width: 5.6em; white-space: nowrap; font-variant-numeric: tabular-nums; font-weight: 600; }
  .race td.b { width: 32%; padding-left: 10px; }
  .race tr.cut td { border-bottom: 2px dashed var(--accent); }
  .side .block + .block { margin-top: 22px; }
  .side .label { color: var(--ink); text-transform: none; letter-spacing: 0; font-size: 16px; margin-bottom: 8px; display: block; }

  /* Stakes */
  .stake { display: grid; grid-template-columns: minmax(0, 1fr) 190px minmax(0, 1fr); gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--hair); }
  .stake.gotw { background: var(--paper-2); border-radius: 10px; border-bottom: 0; padding: 14px 12px; margin-bottom: 4px; }
  .stake .side-a { text-align: right; } .stake .side-a .team { flex-direction: row-reverse; text-align: right; }
  .stake .if { font-size: 12px; color: var(--muted); margin-top: 3px; font-variant-numeric: tabular-nums; }
  .stake .if b { color: var(--ink); font-weight: 600; }
  .stake .mid { text-align: center; }
  .stake .mid .pp { display: flex; justify-content: space-between; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stake .mid .live { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .split { display: flex; height: 6px; margin-top: 6px; gap: 2px; }
  .split i { display: block; height: 100%; border-radius: 3px; }
  .split i:first-child { background: var(--accent); } .split i:last-child { background: var(--hair-2); }
  .gotw-tag { grid-column: 1 / -1; justify-self: center; font-size: 12px; font-weight: 600; background: var(--accent); color: var(--panel); border-radius: 999px; padding: 2px 10px; margin-bottom: 6px; }
  @media (max-width: 680px) { .stake { grid-template-columns: 1fr 1fr; } .stake .mid { grid-column: 1 / -1; order: -1; } .gotw-tag { order: -2; } }

  /* Tables */
  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table.t { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  .t th { font-size: 12px; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); text-align: right; padding: 7px 8px; border-bottom: 1px solid var(--hair); white-space: nowrap; vertical-align: bottom; }
  .t td { text-align: right; padding: 7px 8px; border-bottom: 1px solid var(--hair); white-space: nowrap; }
  .t tr:last-child td { border-bottom: 0; }
  .t th.l, .t td.l { text-align: left; }
  .t.wrapcells td, .t.wrapcells th { white-space: normal; }
  .t tr.cut td { border-bottom: 2px dashed var(--accent); }
  .t td.strong, .t .strong { font-weight: 700; }
  .t tr[data-team] { cursor: pointer; }
  .t tr.on td { background: var(--paper-2); }
  .rk { display: inline-block; width: 1.6em; color: var(--muted); font-variant-numeric: tabular-nums; }
  .team { display: inline-flex; align-items: center; gap: 8px; vertical-align: middle; text-align: left; }
  .team img, .team .ph { width: 24px; height: 24px; border-radius: 50%; flex: none; background: var(--paper-2); object-fit: cover; }
  .team .nm { font-weight: 600; line-height: 1.15; }
  .team .own { color: var(--muted); font-size: 12px; line-height: 1.1; }
  .bar { height: 6px; background: var(--paper-2); border-radius: 3px; overflow: hidden; min-width: 60px; }
  .bar > i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
  .bar.gold > i { background: var(--gold-bar); }
  .cellbar { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
  .cellbar .bar { flex: 1; max-width: 110px; }
  .cellbar span { min-width: 3em; text-align: right; }
  td.hi { background: var(--gold-bg); color: var(--gold); font-weight: 700; }
  td.lo { background: var(--low-bg); color: var(--down); }
  td.hi::after { content: "▲"; font-size: 8px; vertical-align: 2px; margin-left: 2px; }

  /* Matrices */
  .mx td, .mx th { padding: 6px 7px; text-align: center; }
  .mx td.l, .mx th.l { text-align: left; }
  .mx td.self { outline: 2px solid var(--accent); outline-offset: -2px; font-weight: 700; }
  .mx th.vert { writing-mode: vertical-rl; transform: rotate(180deg); text-align: left; height: 120px; padding: 6px 4px; }

  /* Superlatives */
  .sup { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
  .sup > div { border: 1px solid var(--hair); border-radius: 10px; padding: 12px; }
  .sup .label { color: var(--muted); }
  .sup .v { font-size: 20px; font-weight: 700; margin: 2px 0; font-variant-numeric: tabular-nums; }
  .sup .d { font-size: 13px; color: var(--muted); }

  /* Trades */
  .trade { border-bottom: 1px solid var(--hair); padding: 12px 0; display: grid; grid-template-columns: 70px 1fr; gap: 12px; }
  .trade .sides { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .trade ul { margin: 4px 0 0; padding-left: 18px; font-size: 14px; }

  /* Bump chart */
  .bump-wrap { position: relative; }
  .bump { display: block; font-size: 12px; font-family: var(--sans); }
  .bump .ax { fill: var(--muted); }
  .bump .gl { stroke: var(--hair); stroke-width: 1; }
  .bump .ln { fill: none; stroke: var(--hair-2); stroke-width: 2; stroke-linejoin: round; }
  .bump .hit { fill: none; stroke: transparent; stroke-width: 14; cursor: pointer; }
  .bump .pt { fill: var(--hair-2); stroke: var(--panel); stroke-width: 2; cursor: pointer; }
  .bump .lb { fill: var(--muted); cursor: pointer; }
  .bump.focus .bl { opacity: .18; }
  .bump.focus .bl.on { opacity: 1; }
  .bump .bl.on .ln { stroke: var(--accent); stroke-width: 3; }
  .bump .bl.on .pt { fill: var(--accent); }
  .bump .bl.on .lb { fill: var(--ink); font-weight: 600; }
  .tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--panel); font-size: 12px; padding: 4px 8px; border-radius: 6px; white-space: nowrap; z-index: 3; }
</style>
</head>
<body>
<div class="strip"><div class="strip-in" id="strip"></div></div>
<div class="wrap">
  <header class="mast">
    <div class="top">
      <span id="dateline">Loading</span>
      <span class="ctl"><select id="season" aria-label="Season"></select><button id="refresh" title="Reload from Sleeper">Refresh</button></span>
    </div>
    <h1 id="title">The League Ledger</h1>
    <div class="motto" id="motto">Standings, money, and grudges, kept honest.</div>
    <div class="rule2"></div>
    <nav class="tabs" id="tabs">
      <a href="#front" data-tab="front">Front Page</a>
      <a href="#rankings" data-tab="rankings">Rankings &amp; Odds</a>
      <a href="#standings" data-tab="standings">Standings</a>
      <a href="#money" data-tab="money">Money</a>
      <a href="#managers" data-tab="managers">Managers</a>
      <a href="#history" data-tab="history">History</a>
    </nav>
  </header>
  <main id="app"><div class="loading">Fetching the latest from Sleeper…</div></main>
</div>

<script>
// ============================== CONFIG ==============================
const CONFIG = {
  leagueId: '1384626278153322496',   // current season's Sleeper league ID
  highScorePayout: 10,               // $ per week to the top scorer
  payPlayoffWeeks: false,            // true = keep paying high score during playoff weeks
  splitTies: true,                   // tie for high score splits the payout
  sims: 10000,                       // playoff simulations
};
const qs = new URLSearchParams(location.search);
if (qs.get('league')) CONFIG.leagueId = qs.get('league');
if (qs.get('payout')) CONFIG.highScorePayout = Number(qs.get('payout'));
// ====================================================================

const API = 'https://api.sleeper.app/v1';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const f1 = n => (+n).toFixed(1), f2 = n => (+n).toFixed(2);
const usd = n => '$' + (Number.isInteger(n) ? n : n.toFixed(2));
const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
const range = (a, b) => { const r = []; for (let i = a; i <= b; i++) r.push(i); return r; };
const ord = n => { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };
const get = async path => {
  const r = await fetch(API + path);
  if (!r.ok) throw new Error(`${path} returned HTTP ${r.status}`);
  return r.json();
};
const erf = x => { const s = Math.sign(x); x = Math.abs(x); const t = 1 / (1 + 0.3275911 * x);
  return s * (1 - ((((1.061405429 * t - 1.453152027) * t + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x)); };
const phi = z => 0.5 * (1 + erf(z / Math.SQRT2));
// Simulated 0%/100% isn't a mathematical lock, so it reads <0.1% / >99.9% unless the math proves it.
const pct = (p, exact) => {
  if (p == null) return '–';
  if (exact) return `${Math.round(p * 100)}%`;
  if (p >= 0.9995) return '>99.9%';
  if (p <= 0.0005) return '<0.1%';
  return p >= 0.98 || p <= 0.02 ? `${(p * 100).toFixed(1)}%` : `${Math.round(p * 100)}%`;
};
// Playoff odds text: proven clinches/eliminations beat simulated percentages.
const oddsTxt = (odds, id) => odds.final ? pct(odds.made[id], true) : odds.clinched.has(id) ? 'Clinched' : odds.eliminated.has(id) ? 'Eliminated' : pct(odds.made[id]);

const state = { chain: [], cache: {}, cur: null, tab: (location.hash || '#front').slice(1), history: null };

// ============================== LOADING ==============================
async function seasonChain(startId) {
  const out = [];
  let id = startId;
  while (id && id !== '0' && out.length < 15) {
    const lg = await get(`/league/${id}`);
    if (!lg) break;
    out.push({ id: lg.league_id, season: lg.season, league: lg });
    id = lg.previous_league_id;
  }
  return out;
}

async function load(leagueId, opts = {}) {
  const [league, users, rosters, nfl] = await Promise.all([
    opts.league || get(`/league/${leagueId}`), get(`/league/${leagueId}/users`), get(`/league/${leagueId}/rosters`), get('/state/nfl'),
  ]);
  const s = league.settings;
  const playoffStart = s.playoff_week_start || 15;
  const startWeek = s.start_week || 1;
  const complete = league.status === 'complete';
  const lastScored = complete ? Math.max(s.last_scored_leg || 0, playoffStart + 2) : (s.last_scored_leg || 0);
  const liveWeek = !complete && league.season === nfl.season && nfl.week > lastScored ? nfl.week : null;
  const weeks = range(startWeek, lastScored);
  const remaining = complete ? [] : range(Math.max(startWeek, lastScored + 1), playoffStart - 1);
  const fetchWeeks = [...new Set([...weeks, ...remaining, ...(liveWeek ? [liveWeek] : [])])];
  const txUpTo = opts.light ? 0 : complete ? playoffStart + 2 : Math.max(lastScored, liveWeek || 0);
  // Sleeper projections for last week (for the week-over-week change) and every unplayed regular-season week.
  // Plus the three playoff weeks, so title odds use each round's own projections.
  const projWeeks = complete || opts.light ? [] : [...(lastScored >= startWeek ? [lastScored] : []), ...remaining, playoffStart, playoffStart + 1, playoffStart + 2];
  const [matchups, txs, bracket, projs, sched] = await Promise.all([
    Promise.all(fetchWeeks.map(w => get(`/league/${leagueId}/matchups/${w}`).catch(() => []))),
    Promise.all(range(1, txUpTo).map(w => get(`/league/${leagueId}/transactions/${w}`).catch(() => []))),
    complete ? get(`/league/${leagueId}/winners_bracket`).catch(() => []) : Promise.resolve([]),
    Promise.all(projWeeks.map(w => get(`/projections/nfl/regular/${league.season}/${w}`).catch(() => null))),
    liveWeek ? fetch(`https://api.sleeper.com/schedule/nfl/regular/${league.season}`).then(r => r.ok ? r.json() : null).catch(() => null) : Promise.resolve(null),
  ]);
  const proj = {};
  projWeeks.forEach((w, i) => { if (projs[i] && Object.keys(projs[i]).length) proj[w] = projs[i]; });
  let games = null;  // NFL team -> 'pre_game' | 'in_game' | 'complete' for the live week
  if (sched) { games = {}; for (const g of sched) if (g.week === liveWeek) { games[g.home] = g.status; games[g.away] = g.status; } }
  const rosterPlayers = Object.fromEntries(rosters.map(r => [r.roster_id, r.players || []]));
  const byWeek = Object.fromEntries(fetchWeeks.map((w, i) => [w, matchups[i] || []]));
  const userById = Object.fromEntries(users.map(u => [u.user_id, u]));
  const teams = {};
  for (const r of rosters) {
    const u = userById[r.owner_id] || {};
    const av = u.metadata?.avatar || (u.avatar ? `https://sleepercdn.com/avatars/thumbs/${u.avatar}` : '');
    teams[r.roster_id] = {
      id: r.roster_id, uid: r.owner_id, owner: u.display_name || `Team ${r.roster_id}`,
      name: u.metadata?.team_name || u.display_name || `Team ${r.roster_id}`, avatar: av,
      w: 0, l: 0, t: 0, mw: 0, ml: 0, pf: 0, pa: 0, apW: 0, apL: 0, scores: {}, winnings: 0, highs: 0,
    };
  }
  const final = (bracket || []).find(m => m.p === 1);
  return {
    league, teams, weeks, remaining, byWeek, liveWeek, playoffStart, complete, nfl, proj, games, rosterPlayers,
    leagueAvg: !!s.league_average_match, transactions: txs.flat().filter(t => t && t.status === 'complete'),
    champion: final?.w ?? null, runnerUp: final?.l ?? null,
  };
}

// The NFL player list is ~2.5 MB, so keep just the players this league touches in localStorage.
const PLAYER_KEY = 'ledger.players.v1';
async function loadPlayers(ids) {
  let map = {};
  try { map = JSON.parse(localStorage.getItem(PLAYER_KEY)) || {}; } catch {}
  const missing = ids.filter(id => !map[id]);
  if (missing.length) {
    setLoading('Loading the NFL player list (first visit or new pickups only)…');
    const all = await get('/players/nfl');
    for (const id of new Set([...ids, ...Object.keys(map)])) {
      const p = all[id];
      if (p) map[id] = { n: p.full_name || `${p.first_name || ''} ${p.last_name || ''}`.trim() || id, p: p.fantasy_positions || [p.position], t: p.team || 'FA' };
    }
    for (const id of missing) if (!map[id]) map[id] = { n: id, p: [], t: '' };
    try { localStorage.setItem(PLAYER_KEY, JSON.stringify(map)); } catch {}
  }
  return map;
}
const neededIds = d => [...new Set([
  ...Object.values(d.byWeek).flat().flatMap(r => r.players || []),
  ...d.transactions.flatMap(t => [...Object.keys(t.adds || {}), ...Object.keys(t.drops || {})]),
])];

// ============================== CORE STATS ==============================
const regRows = (d, w) => (d.byWeek[w] || []).filter(r => d.teams[r.roster_id]);
const pairsOf = rows => { const p = {}; for (const r of rows) if (r.matchup_id != null) (p[r.matchup_id] ||= []).push(r); return Object.values(p).filter(x => x.length === 2); };

function compute(d) {
  const { teams, weeks, playoffStart, leagueAvg } = d;

// Cumulative per-team totals through week `upTo` (completed regular-season weeks only).

  for (const w of d.weeks) {
    if (w > upTo || w >= d.playoffStart) continue;
    const rows = regRows(d, w);
    if (!rows.length) continue;
    const pts = rows.map(r => r.points ?? 0);
    for (const r of rows) {
      const p = r.points ?? 0, x = t[r.roster_id];

      x.apW += beat; x.apL += lost; x.pf += p;

    }

      .forEach((r, i) => i < rows.length / 2 ? t[r.roster_id].mw++ : t[r.roster_id].ml++);
    for (const [a, b] of pairsOf(rows)) {
      if (a.points > b.points) { t[a.roster_id].w++; t[b.roster_id].l++; }
      else if (a.points < b.points) { t[b.roster_id].w++; t[a.roster_id].l++; }
      else { t[a.roster_id].t++; t[b.roster_id].t++; }

// ============================== POWER RANKINGS ==============================
// Power (0–100) at the end of each week: 50% season all-play win rate, 25% last-3-weeks

    const recent = mean(x.weeks.slice(-3).map(k => k.ap));

    const rec = games ? (x.w + x.mw + x.t / 2) / games : 0;

// ============================== LINEUPS ==============================
const SLOT_ELIG = { QB: ['QB'], RB: ['RB'], WR: ['WR'], TE: ['TE'], K: ['K'], DEF: ['DEF'], DL: ['DL'], LB: ['LB'], DB: ['DB'],
  FLEX: ['RB', 'WR', 'TE'], WRRB_FLEX: ['RB', 'WR'], REC_FLEX: ['WR', 'TE'], SUPER_FLEX: ['QB', 'RB', 'WR', 'TE'], IDP_FLEX: ['DL', 'LB', 'DB'] };

  // Fill the narrowest slots first, then flex slots, each with the best eligible remaining player.
  const slots = (d.league.roster_positions || []).filter(s => SLOT_ELIG[s]).sort((a, b) => SLOT_ELIG[a].length - SLOT_ELIG[b].length);
  const posOf = id => players[id]?.p?.length ? players[id].p : (/^[A-Z]+$/.test(id) ? ['DEF'] : []);
  const best = row => {
    const pool = (row.players || []).map(id => ({ id, pts: row.players_points?.[id] ?? 0, pos: posOf(id) })).sort((a, b) => b.pts - a.pts);
    const used = new Set(); let tot = 0;
    for (const s of slots) { const p = pool.find(x => !used.has(x.id) && x.pos.some(q => SLOT_ELIG[s].includes(q))); if (p) { used.add(p.id); tot += p.pts; } }
    return tot;

  for (const id in d.teams) per[id] = { act: 0, opt: 0, blown: 0, perfect: 0, weeks: 0, worst: null };
  for (const w of d.weeks) {
    if (w >= d.playoffStart) continue;
    const rows = regRows(d, w);
    const pts = Object.fromEntries(rows.map(r => [r.roster_id, r.points ?? 0]));
    for (const r of rows) {

// ============================== MOVES ==============================
function moves(d, players) {
  const startedFor = (rid, pid, fromWeek) => {
    let s = 0;
    for (const w of d.weeks) {
      if (w < fromWeek) continue;
      const r = regRows(d, w).find(x => x.roster_id === rid);
      const i = r?.starters?.indexOf(pid) ?? -1;
      if (i >= 0) s += r.starters_points?.[i] ?? 0;
    }

  };
  const pName = pid => players?.[pid] ? players[pid].n : `Player ${pid}`;
  const pMeta = pid => players?.[pid] ? `${(players[pid].p || [])[0] || ''} · ${players[pid].t}` : '';
  const perTeam = {};
  for (const id in d.teams) perTeam[id] = { adds: 0, faab: 0, pts: 0, best: null };
  const pickups = [], trades = [];
  const tx = [...d.transactions].sort((a, b) => a.created - b.created);
  for (const t of tx) {
    if (t.type === 'waiver' || t.type === 'free_agent') {
      for (const [pid, rid] of Object.entries(t.adds || {})) {
        if (!perTeam[rid]) continue;
        const bid = t.type === 'waiver' ? (t.settings?.waiver_bid ?? 0) : null;
        const pts = startedFor(rid, pid, t.leg);
        const pk = { pid, name: pName(pid), meta: pMeta(pid), rid, w: t.leg, bid, pts };
        pickups.push(pk);

        if (!x.best || pts > x.best.pts) x.best = pk;
      }
    } else if (t.type === 'trade') {
      const sides = (t.roster_ids || []).map(rid => ({
        rid,
        got: Object.entries(t.adds || {}).filter(([, r]) => r === rid).map(([pid]) => ({ pid, name: pName(pid), meta: pMeta(pid), pts: startedFor(rid, pid, t.leg) })),
        picks: (t.draft_picks || []).filter(p => p.owner_id === rid).map(p => `${p.season} round ${p.round} pick`),
        faab: (t.waiver_budget || []).filter(b => b.receiver === rid).reduce((s, b) => s + b.amount, 0),
      }));
      trades.push({ w: t.leg, created: t.created, sides });
    }

}

// ============================== SCHEDULE SWAP ==============================

      let w = 0, l = 0;
      for (const wk of weeks) {
        let o = d.opp[wk][b];
        if (o == null) continue;
        if (o === a) o = b;
        if (sc(a, wk) > sc(o, wk)) w++; else if (sc(a, wk) < sc(o, wk)) l++;
      }
      m[a][b] = { w, l };
    }
  }
  return m;
}

// ============================== HEADLINES ==============================
// Templated from the data. Past tense dodges "59ers wins/win" agreement problems.
function headlines(b) {
  const { d, c, power, lu, players } = b;
  const out = [];
  const N = id => esc(d.teams[id].name);
  if (d.complete && d.champion != null) {
    const ru = d.runnerUp != null ? ` They beat ${N(d.runnerUp)} in the final.` : '';
    out.push({ s: 1000, k: 'Champions', h: `${N(d.champion)} won the ${esc(d.league.season)} title`, p: `The season is in the books.${ru}` });
  }
  if (!power) return out;
  const W = power.last;
  const games = c.games.filter(g => g.week === W);
  const rows = regRows(d, W);
  const payWeek = c.payouts.find(p => p.week === W);
  if (rows.length > 1) {
    const sorted = [...rows].sort((a, b) => b.points - a.points);
    const top = sorted[0];
    const allScores = Object.values(d.teams).flatMap(t => Object.entries(t.scores).filter(([w]) => +w < d.playoffStart).map(([, p]) => p)).sort((a, b) => b - a);
    const rank = allScores.indexOf(top.points) + 1;
    out.push({ s: 40 + (rank === 1 ? 25 : 0), k: payWeek ? `High score · ${usd(payWeek.each)}` : 'High score',
      h: `${N(top.roster_id)} put up ${f2(top.points)}, the best score of Week ${W}`,
      p: `${rank === 1 ? 'That is the highest score of the season so far.' : `The ${ord(rank)}-best score of the season.`} ${N(sorted[1].roster_id)} was next at ${f2(sorted[1].points)}.` });
  }
  if (W >= 3) for (const g of games) {
    const [win, lose, a, bb] = g.pa >= g.pb ? [g.a, g.b, g.pa, g.pb] : [g.b, g.a, g.pb, g.pa];
    const p = preWeekProb(d, W, win, lose);
    if (p < 0.38) out.push({ s: 60 + (0.5 - p) * 100, k: 'Upset', h: `${N(win)} upset ${N(lose)}`,
      p: `Given a ${pct(p)} chance before kickoff, ${N(win)} won ${f2(a)}–${f2(bb)}.` });
  }
  const margin = g => Math.abs(g.pa - g.pb), wl = g => g.pa >= g.pb ? [g.a, g.b, g.pa, g.pb] : [g.b, g.a, g.pb, g.pa];
  if (games.length) {
    const blow = games.reduce((x, y) => margin(y) > margin(x) ? y : x);
    const [w1, l1, a1, b1] = wl(blow);
    if (margin(blow) >= 35) out.push({ s: 28 + margin(blow) / 4, k: 'Blowout', h: `${N(w1)} ran ${N(l1)} off the field`, p: `${f2(a1)}–${f2(b1)}, a ${f1(margin(blow))}-point margin.` });
    const close = games.reduce((x, y) => margin(y) < margin(x) ? y : x);
    const [w2, l2, a2, b2] = wl(close);
    if (margin(close) < 6) out.push({ s: 45 + (6 - margin(close)) * 3, k: 'Photo finish', h: `${N(w2)} edged ${N(l2)} by ${f2(margin(close))}`, p: `Final: ${f2(a2)}–${f2(b2)}.` });
  }
  if (lu) {
    const bl = lu.blunders.filter(x => x.w === W).sort((a, b) => b.left - a.left)[0];
    if (bl) out.push({ s: 55 + bl.left / 4, k: 'Bench blunder', h: `${N(bl.id)} lost with the winning points on the bench`,
      p: `Their best possible lineup would have scored ${f2(bl.opt)}. ${N(bl.opp)} scored ${f2(bl.oppPts)}. ${f1(bl.left)} points sat on the bench.` });
    const mvp = lu.benchMvp[W];
    if (mvp && mvp.pts >= 15 && players) out.push({ s: 32 + mvp.pts / 3, k: 'Wasted', h: `${esc(players[mvp.pid]?.n || 'A benched player')} scored ${f1(mvp.pts)} on ${N(mvp.id)}'s bench`,
      p: `The highest-scoring benched player of Week ${W}.` });
  }
  if (power.prevOdds && !power.odds.final) {
    const sw = Object.keys(d.teams).map(Number).map(id => ({ id, dp: power.odds.made[id] - power.prevOdds.made[id] })).sort((a, b) => Math.abs(b.dp) - Math.abs(a.dp))[0];
    if (sw && Math.abs(sw.dp) >= 0.1) {
      const t = d.teams[sw.id];
      out.push({ s: 40 + Math.abs(sw.dp) * 60, k: 'Playoff race', h: `${N(sw.id)}'s playoff odds ${sw.dp > 0 ? 'climbed' : 'fell'} to ${oddsTxt(power.odds, sw.id)}`,
        p: `${sw.dp > 0 ? 'Up' : 'Down'} ${Math.round(Math.abs(sw.dp) * 100)} points after Week ${W}. Now ${t.totW}-${t.totL}.` });
    }
  }
  if (power.history.length > 1) {
    const cur = power.history.at(-1).rows, prev = power.history.at(-2).rows;
    const mv = cur.map(r => ({ r, m: (prev.find(z => z.id === r.id)?.rank ?? r.rank) - r.rank })).sort((a, b) => b.m - a.m)[0];
    if (mv && mv.m >= 3) out.push({ s: 30 + mv.m * 3, k: 'Power rankings', h: `${N(mv.r.id)} jumped ${mv.m} spots to No. ${mv.r.rank}`, p: `Power score: ${f1(mv.r.score)}.` });
  }
  const rich = [...c.list].sort((a, b) => b.winnings - a.winnings)[0];
  if (rich && rich.highs >= 2) out.push({ s: 22 + rich.highs * 3, k: 'The money', h: `${N(rich.id)} has banked ${usd(rich.winnings)} in weekly high scores`,
    p: `${rich.highs} weekly wins so far. Nobody else has more than ${Math.max(0, ...c.list.filter(t => t !== rich).map(t => t.highs))}.` });
  return out.sort((a, b) => b.s - a.s);
}

// ============================== RENDER HELPERS ==============================
const teamCell = (t, sub = true) => `<span class="team">${t.avatar
  ? `<img src="${esc(t.avatar)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'ph'}))">`
  : '<span class="ph"></span>'}<span><span class="nm">${esc(t.name)}</span>${sub && t.owner !== t.name ? `<br><span class="own">${esc(t.owner)}</span>` : ''}</span></span>`;
const sec = (title, dek, body) => `<section class="sec"><div class="sec-h"><h2>${title}</h2>${dek ? `<span class="dek">${dek}</span>` : ''}</div>${body}</section>`;
const bar = (p, cls = '') => `<div class="bar ${cls}"><i style="width:${Math.max(0, Math.min(1, p)) * 100}%"></i></div>`;
const rec = t => `${t.totW}-${t.totL}`;
function setLoading(msg) { $('#app').innerHTML = `<div class="loading">${esc(msg)}</div>`; }

// ============================== STRIP & MAST ==============================
function renderChrome(b) {
  const { d, power } = b;
  $('#title').textContent = d.league.name;
  const today = new Date().toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
  const wk = d.complete ? 'Final edition' : d.liveWeek ? `Week ${d.liveWeek}` : d.weeks.length ? `After week ${d.weeks.at(-1)}` : 'Preseason';
  $('#dateline').textContent = `${d.league.season} season · ${wk} · ${today}`;
  $('#motto').textContent = `${Object.keys(d.teams).length} teams, ${d.leagueAvg ? 'two games a week, ' : ''}${usd(CONFIG.highScorePayout)} to the week's top score.`;
  // Scoreboard: live week, else next week, else last completed week
  const w = d.liveWeek || d.remaining[0] || d.weeks.at(-1), mode = d.liveWeek ? 'live' : d.remaining[0] ? 'next' : 'final';
  const rows = regRows(d, w), pairs = pairsOf(rows);
  const odds = power?.odds;
  const anyPts = rows.some(r => r.points > 0);
  const label = mode === 'live' ? `Week ${w} <b>Live</b>` : mode === 'next' ? `Week ${w} <b>Next</b>` : `Week ${w} <b>Final</b>`;
  $('#strip').innerHTML = pairs.length ? `<div class="tag">${label}</div>` + pairs.map(([a, bb]) => {
    const scored = anyPts || mode === 'final';
    const val = r => scored ? f2(r.points ?? 0) : (odds?.firstWeek === w && odds.pair[r.roster_id] ? pct(odds.pair[r.roster_id].p) : '');
    const leadA = scored ? a.points >= bb.points : (odds?.pair[a.roster_id]?.p ?? 0.5) >= 0.5;
    return `<div class="game"><div class="r ${leadA ? 'ahead' : ''}"><span title="${esc(d.teams[a.roster_id].name)}">${esc(d.teams[a.roster_id].name)}</span><span>${val(a)}</span></div>
      <div class="r ${!leadA ? 'ahead' : ''}"><span title="${esc(d.teams[bb.roster_id].name)}">${esc(d.teams[bb.roster_id].name)}</span><span>${val(bb)}</span></div></div>`;
  }).join('') : '';
  document.querySelectorAll('#tabs a').forEach(a => a.classList.toggle('on', a.dataset.tab === state.tab));
}

// ============================== TABS ==============================
function tabFront(b) {
  const { d, c, power, heads } = b;
  if (!power) return sec('Front page', '', `<p class="lead"><span class="dek">The season hasn't kicked off yet. Check back after Week 1.</span></p>`);
  const [lead, ...rest] = heads;
  const odds = power.odds;
  const byOdds = [...c.list].sort((x, y) => odds.made[y.id] - odds.made[x.id] || y.totW - x.totW);
  const race = `<table class="race">${byOdds.map((t, i) => `<tr class="${i === odds.seeds - 1 ? 'cut' : ''}">
    <td>${esc(t.name)} <span class="muted">${rec(t)}</span></td><td class="p">${oddsTxt(odds, t.id)}</td><td class="b">${bar(odds.made[t.id])}</td></tr>`).join('')}</table>`;
  const maxChamp = odds.champ ? Math.max(...Object.values(odds.champ)) : 1;
  const titleBlock = odds.champ ? `<div class="block"><span class="label">Title odds</span><table class="race">${[...c.list].sort((x, y) => odds.champ[y.id] - odds.champ[x.id]).slice(0, 5)
    .map(t => `<tr><td>${esc(t.name)}</td><td class="p">${pct(odds.champ[t.id])}</td><td class="b">${bar(odds.champ[t.id] / maxChamp, 'gold')}</td></tr>`).join('')}</table></div>` : '';
  const front = `<div class="cols">
    <div>
      ${lead ? `<article class="lead"><div class="kicker">${lead.k}</div><h3>${lead.h}</h3><p class="dek">${lead.p}</p>
        <div class="byline">Week ${power.last} in review</div></article>` : ''}
      <div class="briefs">${rest.slice(0, 6).map(x => `<div class="brief"><div class="kicker">${x.k}</div><h4>${x.h}</h4><p>${x.p}</p></div>`).join('')}</div>
    </div>
    <aside class="side">
      <div class="block"><span class="label">The playoff race</span>${race}
        <div class="note">${odds.final ? 'Final regular-season seeding.' : `Top ${odds.seeds} make it. From ${CONFIG.sims.toLocaleString()} simulations of the rest of the season.`}</div></div>
      ${titleBlock}
    </aside>
  </div>`;
  return front + stakesSection(b) + superlatives(b);
}

function stakesSection(b) {
  const { d, power } = b;
  const odds = power.odds;
  if (!odds.firstWeek || !odds.firstPairs.length) return '';
  const w = odds.firstWeek, rows = regRows(d, w);
  const live = d.liveWeek === w && rows.some(r => r.points > 0);
  const started = (a, b2) => live && (ptsOf(a) > 0 || ptsOf(b2) > 0);
  const ptsOf = id => rows.find(r => r.roster_id === id)?.points ?? 0;
  // Expected movement in both teams' playoff odds: the win/loss swing times 2p(1-p), so a close game with a lot
  // riding on it beats a lopsided one. Taken from pre-kickoff odds so the order holds while games are played.
  const pre = power.preKick || odds;
  const swing = id => (pre.cond[id]?.win ?? 0) - (pre.cond[id]?.lose ?? 0);
  const games = odds.firstPairs.map(([a, bb]) => { const p = pre.pair[a]?.p ?? 0.5;
    return { a, b: bb, lev: 2 * p * (1 - p) * (swing(a) + swing(bb)) }; }).sort((x, y) => y.lev - x.lev);
  const ifTxt = id => { if (odds.clinched.has(id)) return 'Playoffs: clinched'; if (odds.eliminated.has(id)) return 'Playoffs: eliminated';
    const k = odds.cond[id]; if (!k || k.win == null || k.lose == null) return '';
    const shown = k.rec.map((r, n) => ({ ...r, n })).filter(r => r.p >= 0.005 && r.made != null);
    if (shown.every(r => r.made >= 0.995)) return `${k.med != null ? `Beats median: <b>${pct(k.med)}</b> · ` : ''}Playoffs: all but locked whatever happens`;
    if (shown.every(r => r.made < 0.005)) return `${k.med != null ? `Beats median: <b>${pct(k.med)}</b> · ` : ''}Playoffs: a long shot whatever happens`;
    if (k.med == null) return `Playoffs: <b>${pct(k.win)}</b> with a win · <b>${pct(k.lose)}</b> with a loss`;
    const label = n => ['0-2', '1-1', '2-0'][n];
    return `Beats median: <b>${pct(k.med)}</b><br>Playoffs if ${shown.slice().reverse().map(r => `${label(r.n)}: <b>${pct(r.made)}</b>`).join(' · ')}`; };
  const row = (g, i) => {
    const pa = odds.pair[g.a].p, A = d.teams[g.a], B = d.teams[g.b];
    return `<div class="stake ${i === 0 ? 'gotw' : ''}">${i === 0 ? '<div class="gotw-tag">Game of the week</div>' : ''}
      <div class="side-a">${teamCell(A, false)}<div class="if">${ifTxt(g.a)}</div></div>
      <div class="mid"><div class="pp"><span>${pct(pa)}</span><span>${pct(1 - pa)}</span></div>
        <div class="split"><i style="width:${pa * 100}%"></i><i style="width:${(1 - pa) * 100}%"></i></div>
        <div class="live">Win chance${odds.firstModel ? ` · projected ${f1(odds.firstModel.mu[g.a])}–${f1(odds.firstModel.mu[g.b])}` : ''}</div>
        ${started(g.a, g.b) ? `<div class="live">Live: ${f2(ptsOf(g.a))} – ${f2(ptsOf(g.b))}</div>` : ''}</div>
      <div>${teamCell(B, false)}<div class="if">${ifTxt(g.b)}</div></div>
    </div>`;
  };
  return sec(`Week ${w}: what's at stake`, d.leagueAvg ? 'Each team plays two games: its opponent and the league median. Ordered by how much each head-to-head game is expected to move both teams\' playoff odds (what\'s riding on it, and how close it is), set before kickoff.' : 'Ordered by how much each game is expected to move both teams\' playoff odds (what\'s riding on it, and how close it is), set before kickoff',
    games.map(row).join('') + `<div class="note">The big percentages are the head-to-head win chances. "Beats median" is the chance of finishing in the top half of all scores this week. "Playoffs if 2-0 / 1-1 / 0-2" are playoff odds after each possible weekly record. All of it comes from the same simulation as the playoff race.${odds.firstModel ? ` Projections use each team's actual Week ${w} lineup and Sleeper's player projections${live ? ', with points from finished games locked in, so the odds update as games are played. The order of games doesn\'t move with the scores' : ''}.` : ''}</div>`);
}

function superlatives(b) {
  const { d, c, lu } = b;
  const T = id => d.teams[id];
  const all = c.list.flatMap(t => Object.entries(t.scores).map(([w, p]) => ({ t, w: +w, p }))).filter(x => x.w < d.playoffStart && x.p > 0);
  if (!all.length) return '';
  const best = all.reduce((x, y) => y.p > x.p ? y : x), worst = all.reduce((x, y) => y.p < x.p ? y : x);
  const margin = g => Math.abs(g.pa - g.pb), wl = g => g.pa >= g.pb ? [T(g.a), T(g.b), g.pa, g.pb] : [T(g.b), T(g.a), g.pb, g.pa];
  const items = [['Season high', f2(best.p), `${best.t.name}, week ${best.w}`], ['Season low', f2(worst.p), `${worst.t.name}, week ${worst.w}`]];
  if (c.games.length) {
    const blow = c.games.reduce((x, y) => margin(y) > margin(x) ? y : x), close = c.games.reduce((x, y) => margin(y) < margin(x) ? y : x);
    let [w, l, a, bb] = wl(blow); items.push(['Biggest blowout', `+${f1(margin(blow))}`, `${w.name} over ${l.name}, ${f2(a)}–${f2(bb)}, week ${blow.week}`]);
    [w, l, a, bb] = wl(close); items.push(['Closest game', f2(margin(close)), `${w.name} over ${l.name}, ${f2(a)}–${f2(bb)}, week ${close.week}`]);
  }
  const lucky = [...c.list].sort((x, y) => y.luck - x.luck)[0], unlucky = [...c.list].sort((x, y) => x.luck - y.luck)[0];
  items.push(['Luckiest', `+${f1(lucky.luck)} wins`, `${lucky.name}: ${lucky.w}-${lucky.l} head to head, but ${lucky.apW}-${lucky.apL} against the whole league`]);
  items.push(['Unluckiest', `${f1(unlucky.luck)} wins`, `${unlucky.name}: ${unlucky.w}-${unlucky.l} head to head, but ${unlucky.apW}-${unlucky.apL} against the whole league`]);
  const robbed = [...c.list].sort((x, y) => y.pa - x.pa)[0];
  items.push(['Most points against', f2(robbed.pa), robbed.name]);
  if (lu) {
    const per = Object.entries(lu.per).filter(([, x]) => x.weeks);
    const sharp = [...per].sort((x, y) => y[1].eff - x[1].eff)[0];
    const dull = [...per].sort((x, y) => (y[1].opt - y[1].act) - (x[1].opt - x[1].act))[0];
    items.push(['Sharpest lineups', `${(sharp[1].eff * 100).toFixed(1)}%`, `${T(sharp[0]).name} started the highest share of their best possible points`]);
    items.push(['Most points benched', f1(dull[1].opt - dull[1].act), `${T(dull[0]).name} left the most on the bench all season`]);
  }
  return sec('Season superlatives', 'Regular season', `<div class="sup">${items.map(([k, v, dd]) => `<div><div class="label">${k}</div><div class="v">${v}</div><div class="d">${esc(dd)}</div></div>`).join('')}</div>`);
}

function tabRankings(b) {
  const { d, power } = b;
  if (!power) return sec('Power rankings', '', '<p class="muted">Available after Week 1.</p>');
  const { history, odds, prevOdds } = power;
  const cur = history.at(-1).rows, prev = history.length > 1 ? history.at(-2).rows : null;
  const showD = prevOdds && !odds.final;
  const rows = cur.map(r => {
    const t = d.teams[r.id], p = prev?.find(z => z.id === r.id), mv = p ? p.rank - r.rank : 0;
    const move = !prev ? '<span class="muted">–</span>' : mv > 0 ? `<span class="up">▲ ${mv}</span>` : mv < 0 ? `<span class="down">▼ ${-mv}</span>` : '<span class="muted">—</span>';
    const po = odds.made[r.id], dp = prevOdds ? po - prevOdds.made[r.id] : 0;
    const dTxt = Math.abs(dp) < 0.005 ? '<span class="muted">0</span>' : `<span class="${dp > 0 ? 'up' : 'down'}">${dp > 0 ? '+' : '−'}${Math.round(Math.abs(dp) * 100)}</span>`;
    return `<tr data-team="${r.id}"><td class="l"><span class="rk">${r.rank}</span>${teamCell(t)}</td><td>${move}</td>
      <td class="strong">${f1(r.score)}</td><td>${rec(t)}</td><td>${f2(r.last3)}</td>
      <td><div class="cellbar"><span>${oddsTxt(odds, r.id)}</span>${bar(po)}</div></td>
      ${showD ? `<td>${dTxt}</td>` : ''}${odds.byes ? `<td>${pct(odds.bye[r.id], odds.final)}</td>` : ''}${odds.champ ? `<td>${pct(odds.champ[r.id])}</td>` : ''}</tr>`;
  }).join('');
  const table = `<div class="scroll"><table class="t">
    <tr><th class="l">Team</th><th>Move</th><th>Power</th><th>Record</th><th>Last 3 avg</th><th>Playoffs</th>${showD ? '<th title="Change in playoff odds since last week, in percentage points">Δ Week</th>' : ''}${odds.byes ? '<th>Bye</th>' : ''}${odds.champ ? '<th>Title</th>' : ''}</tr>
    ${rows}</table></div>
    <div class="note">Power blends season all-play win rate (50%), the last three weeks of all-play (25%) and actual record including median games (25%), on a 0–100 scale.
    ${odds.final ? 'The regular season is over, so playoff and bye columns show the final result.'
      : `Odds come from ${CONFIG.sims.toLocaleString()} simulations of the remaining schedule${d.leagueAvg ? ', counting both weekly games: the head-to-head matchup and the league median (top half of the week\'s scores win)' : ''}. Seeds go by total wins, then points for; the top ${odds.seeds} make it. "Clinched" and "Eliminated" are mathematically certain. Title odds play each simulated season through Sleeper\'s fixed bracket, one week per round${odds.playoffProj ? ', using each team\'s projected lineup for that playoff week' : ''}. ${odds.usesProj ? `Each week, a team's expected score is ${Math.round(PROJ_WEIGHT * 100)}% its Sleeper projection (the best lineup from its current roster; this week, its actual lineup with finished games locked in) and ${Math.round(100 - PROJ_WEIGHT * 100)}% its season scoring average. Scores vary about ${WEEKLY_SD} points week to week, and each simulated season also gives every team a lasting shift, typically within ${TEAM_SD} points either way, since a roster can beat or miss its projections all year. That mix forecast best when tested on the league's 2020–2025 seasons. Projections can't see future trades or pickups.` : 'Sleeper projections were unavailable, so each team scores around its season average, blended heavily with the league average (the setting that tested best on the league\'s 2020–2025 seasons).'}${odds.byes ? ` The top ${odds.byes} seeds get first-round byes.` : ''}`}</div>`;
  return sec('Power rankings', `After week ${power.last}`, table) + sec('The climb', 'Power rank after each week. Hover or tap a team to follow it.', bumpChart(d, power));
}

function bumpChart(d, power) {
  const { history } = power;
  const n = Object.keys(d.teams).length;
  const rowH = 27, padT = 14, padB = 28, padL = 30, padR = 190;
  const colW = Math.max(56, Math.min(100, 760 / Math.max(1, history.length - 1)));
  const W = padL + padR + colW * Math.max(1, history.length - 1), H = padT + padB + rowH * (n - 1);
  const x = i => padL + i * colW, y = r => padT + (r - 1) * rowH;
  const series = Object.keys(d.teams).map(id => ({ id: +id, pts: history.map((h, i) => {
    const r = h.rows.find(z => z.id === +id); return r ? { i, w: h.w, r: r.rank, s: r.score } : null; }).filter(Boolean) }));
  const grid = range(1, n).map(k => `<text x="${padL - 12}" y="${y(k) + 4}" class="ax" text-anchor="end">${k}</text>`).join('')
    + history.map((h, i) => `<line x1="${x(i)}" x2="${x(i)}" y1="${padT - 8}" y2="${H - padB + 6}" class="gl"/><text x="${x(i)}" y="${H - 6}" class="ax" text-anchor="middle">W${h.w}</text>`).join('');
  const lines = series.map(s => {
    const path = s.pts.map((p, k) => `${k ? 'L' : 'M'}${x(p.i)},${y(p.r)}`).join('');
    const end = s.pts.at(-1);
    return `<g class="bl" data-id="${s.id}"><path d="${path}" class="hit"/><path d="${path}" class="ln"/>
      ${s.pts.map(p => `<circle cx="${x(p.i)}" cy="${y(p.r)}" r="4" class="pt" data-tip="${esc(d.teams[s.id].name)} · Week ${p.w}: No. ${p.r} (power ${f1(p.s)})"/>`).join('')}
      ${end ? `<text x="${x(end.i) + 12}" y="${y(end.r) + 4}" class="lb">${esc(d.teams[s.id].name)}</text>` : ''}</g>`;
  }).join('');
  return `<div class="scroll bump-wrap"><svg class="bump" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Power rank by week for each team">${grid}${lines}</svg><div class="tip" hidden></div></div>`;
}
function wireBump() {
  const wrap = document.querySelector('.bump-wrap'); if (!wrap) return;
  const svg = wrap.querySelector('svg'), tip = wrap.querySelector('.tip');
  let pinned = null;
  const focus = id => {
    svg.classList.toggle('focus', id != null);
    svg.querySelectorAll('.bl').forEach(g => g.classList.toggle('on', g.dataset.id === String(id)));
    document.querySelectorAll('tr[data-team]').forEach(tr => tr.classList.toggle('on', tr.dataset.team === String(id)));
  };
  const bind = (el, id) => {
    el.addEventListener('mouseenter', () => pinned == null && focus(id));
    el.addEventListener('mouseleave', () => pinned == null && focus(null));
    el.addEventListener('click', () => { pinned = pinned === id ? null : id; focus(pinned); });
  };
  svg.querySelectorAll('.bl').forEach(g => bind(g, g.dataset.id));
  document.querySelectorAll('tr[data-team]').forEach(tr => bind(tr, tr.dataset.team));
  svg.querySelectorAll('.pt').forEach(c => {
    c.addEventListener('mouseenter', () => {
      tip.textContent = c.dataset.tip; tip.hidden = false;
      const r = c.getBoundingClientRect(), wr = wrap.getBoundingClientRect();
      tip.style.left = (r.left - wr.left + wrap.scrollLeft + 10) + 'px'; tip.style.top = (r.top - wr.top - 32) + 'px';
    });
    c.addEventListener('mouseleave', () => tip.hidden = true);
  });
}

function tabStandings(b) {
  const { d, c, sw } = b;
  const seeds = d.league.settings.playoff_teams || 6;
  const standings = `<div class="scroll"><table class="t">
    <tr><th class="l">Team</th><th>Record</th>${d.leagueAvg ? '<th>H2H</th><th>vs Median</th>' : ''}<th>PF</th><th>PA</th><th title="Record if you played every team every week">All-play</th><th title="Actual H2H wins minus expected wins from all-play rate">Luck</th></tr>
    ${c.list.map((t, i) => `<tr class="${i === seeds - 1 ? 'cut' : ''}"><td class="l"><span class="rk">${i + 1}</span>${teamCell(t)}</td>
      <td class="strong">${rec(t)}${t.t ? '-' + t.t : ''}</td>${d.leagueAvg ? `<td>${t.w}-${t.l}${t.t ? '-' + t.t : ''}</td><td>${t.mw}-${t.ml}</td>` : ''}
      <td>${f2(t.pf)}</td><td>${f2(t.pa)}</td><td>${t.apW}-${t.apL}</td>
      <td class="${t.luck > 0.5 ? 'up' : t.luck < -0.5 ? 'down' : 'muted'}">${t.luck >= 0 ? '+' : ''}${f1(t.luck)}</td></tr>`).join('')}
  </table></div><div class="note">Sorted by total wins, then points for. The heavy line is the playoff cut (top ${seeds}). Sleeper's own tiebreakers may order tied teams differently.</div>`;

  const ids = c.list.map(t => t.id);
  const maxW = Math.max(1, ...ids.flatMap(a => ids.map(bb => sw[a][bb].w)));
  const avgSwap = id => mean(ids.map(bb => sw[id][bb].w));
  const swap = c.games.length ? `<div class="scroll"><table class="t mx">
    <tr><th class="l">Team ↓ &nbsp; with schedule of →</th>${ids.map(id => `<th class="vert">${esc(d.teams[id].name)}</th>`).join('')}<th>Avg W</th><th title="Actual H2H wins minus average across all schedules">Sched. luck</th></tr>
    ${ids.map(a => { const sl = d.teams[a].w - avgSwap(a); return `<tr><td class="l">${esc(d.teams[a].name)}</td>${ids.map(bb => { const v = sw[a][bb];
      return `<td class="${a === bb ? 'self' : ''}" style="background:color-mix(in srgb, var(--accent) ${Math.round(v.w / maxW * 42)}%, transparent)" title="${esc(d.teams[a].name)} with ${esc(d.teams[bb].name)}'s schedule: ${v.w}-${v.l}">${v.w}-${v.l}</td>`; }).join('')}
      <td>${f1(avgSwap(a))}</td><td class="${sl > 0.5 ? 'up' : sl < -0.5 ? 'down' : 'muted'}">${sl >= 0 ? '+' : ''}${f1(sl)}</td></tr>`; }).join('')}
  </table></div><div class="note">Each row is a team's head-to-head record if it had played the column team's schedule (outlined cells are the real schedule). Positive schedule luck means the real schedule was kinder than average. Median games don't depend on the schedule, so they're left out.</div>` : '';

  const weeks = d.weeks.filter(w => c.weekStats[w]);
  const grid = `<div class="scroll"><table class="t">
    <tr><th class="l">Team</th>${weeks.map(w => `<th>W${w}</th>`).join('')}<th>Avg</th></tr>
    ${c.list.map(t => { const vals = weeks.filter(w => w < d.playoffStart).map(w => t.scores[w]).filter(v => v != null);
      return `<tr><td class="l">${esc(t.name)}</td>${weeks.map(w => { const v = t.scores[w], st = c.weekStats[w];
        return v == null ? '<td class="muted">–</td>' : `<td class="${v === st.hi ? 'hi' : v === st.lo ? 'lo' : ''}">${f2(v)}</td>`; }).join('')}<td class="strong">${f2(mean(vals))}</td></tr>`; }).join('')}
  </table></div><div class="note"><span class="money">Gold ▲</span> weekly high · <span class="down">red</span> weekly low.</div>`;

  return sec('Standings', 'Regular season', standings) + (swap ? sec('Schedule swap', 'What if you\'d had someone else\'s schedule?', swap) : '') + sec('Every score', '', grid);

  return `<div class="cols even"><div>${sec('High-score money', 'Season to date', table)}</div><div>${sec('Week by week', '', log)}</div></div>`;

// ============================== HISTORY ==============================
async function loadHistory() {
  if (state.history) return state.history;
  const seasons = [];
  for (const x of state.chain) {
    let bnd = state.cache[x.id];
    if (!bnd) { const d = await load(x.id, { light: true, league: x.league }); bnd = { d, c: compute(d) }; }
    seasons.push(bnd);
  }
  state.history = seasons;
  return seasons;
}

function tabHistory(seasons) {
  const cur = state.cur.d;
  const latest = {};
  for (const { d } of [...seasons].reverse()) for (const t of Object.values(d.teams)) if (t.uid) latest[t.uid] = { name: t.name, owner: t.owner };
  const who = uid => latest[uid]?.name || 'Former manager';
  const byUid = {};
  const rowFor = uid => byUid[uid] ||= { uid, seasons: 0, titles: 0, finals: 0, playoffs: 0, w: 0, l: 0, t: 0, mw: 0, ml: 0, pf: 0, games: 0, highs: 0 };
  const records = [], results = [], h2h = {}, trophies = [];
  for (const { d, c } of seasons) {
    const seeds = d.league.settings.playoff_teams || 6;
    const done = d.complete;
    c.list.forEach((t, i) => {
      if (!t.uid) return;
      const r = rowFor(t.uid);
      r.seasons++; r.w += t.w; r.l += t.l; r.t += t.t; r.mw += t.mw; r.ml += t.ml; r.pf += t.pf; r.highs += t.highs;
      r.games += Object.keys(t.scores).filter(w => +w < d.playoffStart).length;
      if (done && i < seeds) r.playoffs++;
    });
    if (done && d.champion != null && d.teams[d.champion]?.uid) { rowFor(d.teams[d.champion].uid).titles++; rowFor(d.teams[d.champion].uid).finals++; }
    if (done && d.runnerUp != null && d.teams[d.runnerUp]?.uid) rowFor(d.teams[d.runnerUp].uid).finals++;
    for (const t of c.list) for (const [w, p] of Object.entries(t.scores)) if (+w < d.playoffStart && p > 0) records.push({ season: d.league.season, w: +w, p, name: t.name });
    for (const g of c.games) {
      const A = d.teams[g.a], B = d.teams[g.b];
      const [win, lose, a, bb] = g.pa >= g.pb ? [A, B, g.pa, g.pb] : [B, A, g.pb, g.pa];
      results.push({ season: d.league.season, w: g.week, win: win.name, lose: lose.name, m: a - bb });
      if (A.uid && B.uid) {
        const k1 = (h2h[A.uid] ||= {}), k2 = (h2h[B.uid] ||= {});
        k1[B.uid] ||= { w: 0, l: 0 }; k2[A.uid] ||= { w: 0, l: 0 };
        if (g.pa > g.pb) { k1[B.uid].w++; k2[A.uid].l++; } else if (g.pb > g.pa) { k2[A.uid].w++; k1[B.uid].l++; }
      }
    }
    trophies.push({ season: d.league.season, done, champ: d.champion != null ? d.teams[d.champion] : null, ru: d.runnerUp != null ? d.teams[d.runnerUp] : null,
      top: c.list[0], most: [...c.list].sort((x, y) => y.pf - x.pf)[0], last: c.list.at(-1), money: [...c.list].sort((x, y) => y.highs - x.highs)[0] });
  }

  const nm = t => t ? esc(t.name) : '<span class="muted">–</span>';
  const trophyTable = `<div class="scroll"><table class="t wrapcells">
    <tr><th class="l">Season</th><th class="l">Champion</th><th class="l">Runner-up</th><th class="l">Best record</th><th class="l">Most points</th><th class="l">Most weekly highs</th><th class="l">Last place</th></tr>
    ${trophies.map(x => `<tr><td class="l strong">${esc(x.season)}</td>
      <td class="l">${x.done ? (x.champ ? `<span class="money">★</span> <b>${nm(x.champ)}</b>` : '–') : '<span class="muted">In progress</span>'}</td><td class="l">${x.done ? nm(x.ru) : ''}</td>
      <td class="l">${nm(x.top)} <span class="muted">${rec(x.top)}</span></td><td class="l">${nm(x.most)} <span class="muted">${f2(x.most.pf)}</span></td>
      <td class="l">${nm(x.money)} <span class="muted">${x.money.highs}</span></td><td class="l">${x.done ? nm(x.last) : '<span class="muted">TBD</span>'}</td></tr>`).join('')}
  </table></div>`;

  const winPct = r => (r.w + r.mw) / Math.max(1, r.w + r.l + r.mw + r.ml);
  const all = Object.values(byUid).filter(r => latest[r.uid]).sort((a, b) => b.titles - a.titles || winPct(b) - winPct(a));
  const allTime = `<div class="scroll"><table class="t">
    <tr><th class="l">Manager</th><th>Seasons</th><th>Titles</th><th>Finals</th><th>Playoffs</th><th>Record</th><th>Win %</th><th>H2H</th><th>Points / game</th><th>Weekly highs</th></tr>
    ${all.map(r => { const gw = r.w + r.mw, gl = r.l + r.ml; return `<tr><td class="l"><b>${esc(who(r.uid))}</b> <span class="muted">${esc(latest[r.uid].owner)}</span></td>
      <td>${r.seasons}</td><td class="${r.titles ? 'money' : 'muted'}">${r.titles ? '★'.repeat(r.titles) : '0'}</td><td>${r.finals}</td><td>${r.playoffs}</td>
      <td class="strong">${gw}-${gl}</td><td>${(winPct(r) * 100).toFixed(1)}%</td><td>${r.w}-${r.l}${r.t ? '-' + r.t : ''}</td>
      <td>${f2(r.pf / Math.max(1, r.games))}</td><td>${r.highs}</td></tr>`; }).join('')}
  </table></div><div class="note">Regular-season records across all ${seasons.length} seasons on Sleeper, including the one in progress. Playoff appearances and finals count finished seasons only. Names are each manager's most recent team name.</div>`;

  records.sort((a, b) => b.p - a.p);
  results.sort((a, b) => b.m - a.m);
  const close = [...results].sort((a, b) => a.m - b.m);
  const list = (title, rows) => `<div><div class="sub-h">${title}</div><table class="t">${rows}</table></div>`;
  const recs = `<div class="cols even">
    ${list('Highest scores', records.slice(0, 6).map(r => `<tr><td class="l">${esc(r.name)}</td><td class="muted">${esc(r.season)} W${r.w}</td><td class="strong">${f2(r.p)}</td></tr>`).join(''))}
    ${list('Lowest scores', records.slice(-6).reverse().map(r => `<tr><td class="l">${esc(r.name)}</td><td class="muted">${esc(r.season)} W${r.w}</td><td class="strong">${f2(r.p)}</td></tr>`).join(''))}
    ${list('Biggest blowouts', results.slice(0, 6).map(g => `<tr><td class="l">${esc(g.win)} over ${esc(g.lose)}</td><td class="muted">${esc(g.season)} W${g.w}</td><td class="strong">+${f1(g.m)}</td></tr>`).join(''))}
    ${list('Closest games', close.slice(0, 6).map(g => `<tr><td class="l">${esc(g.win)} over ${esc(g.lose)}</td><td class="muted">${esc(g.season)} W${g.w}</td><td class="strong">${f2(g.m)}</td></tr>`).join(''))}
  </div>`;

  const uids = Object.values(cur.teams).map(t => t.uid).filter(Boolean);
  const cell = (a, b) => h2h[a]?.[b];
  const rivalry = `<div class="scroll"><table class="t mx">
    <tr><th class="l">Manager ↓ &nbsp; vs →</th>${uids.map(u => `<th class="vert">${esc(who(u))}</th>`).join('')}</tr>
    ${uids.map(a => `<tr><td class="l">${esc(who(a))}</td>${uids.map(bb => {
      if (a === bb) return '<td class="muted">·</td>';
      const v = cell(a, bb); if (!v || !(v.w + v.l)) return '<td class="muted">–</td>';
      const p = v.w / (v.w + v.l), tint = p > 0.5 ? `color-mix(in srgb, var(--accent) ${Math.round((p - 0.5) * 80)}%, transparent)` : p < 0.5 ? `color-mix(in srgb, var(--down) ${Math.round((0.5 - p) * 80)}%, transparent)` : 'transparent';
      return `<td style="background:${tint}" title="${esc(who(a))} vs ${esc(who(bb))}: ${v.w}-${v.l}">${v.w}-${v.l}</td>`; }).join('')}</tr>`).join('')}
  </table></div><div class="note">All-time regular-season head-to-head. Purple means the row manager leads the series; red means they trail.</div>`;
  let top = null;
  for (const a of uids) for (const bb of uids) { const v = cell(a, bb); if (a < bb && v) { const n = v.w + v.l, gap = Math.abs(v.w - v.l);
    if (!top || n > top.n || (n === top.n && gap < top.gap)) top = { a, b: bb, v, n, gap }; } }
  const rivalNote = top ? `<p style="font: 400 18px/1.45 var(--serif); margin: 0 0 12px">The most-played series: <b>${esc(who(top.a))}</b> vs. <b>${esc(who(top.b))}</b>, ${top.v.w}-${top.v.l} over ${top.n} meetings.</p>` : '';

  return sec('Trophy case', `${seasons.length} seasons on Sleeper`, trophyTable) + sec('All-time standings', '', allTime) + sec('Record book', 'Regular season, every season', recs) + sec('Rivalries', '', rivalNote + rivalry);
}

// ============================== FLOW ==============================
async function analyze(d) {
  const c = compute(d);
  let players = null;
  try { players = await loadPlayers(neededIds(d)); } catch (e) { console.warn('players', e); }
  d.players = players;
  const power = computePower(d);
  const lu = players ? lineups(d, players) : null;
  const b = { d, c, power, players, lu, mv: moves(d, players), sw: swapMatrix(d) };
  b.heads = headlines(b);
  return b;
}

async function renderTab() {
  const b = state.cur; if (!b) return;
  renderChrome(b);
  const t = state.tab;
  if (t === 'history') {
    setLoading(`Digging through ${state.chain.length} seasons of records…`);
    try { const seasons = await loadHistory(); if (state.tab === 'history') $('#app').innerHTML = tabHistory(seasons); }
    catch (e) { $('#app').innerHTML = `<div class="err">Couldn't load league history: ${esc(e.message)}</div>`; }
    return;
  }
  $('#app').innerHTML = t === 'rankings' ? tabRankings(b) : t === 'standings' ? tabStandings(b) : t === 'money' ? tabMoney(b) : t === 'managers' ? tabManagers(b) : tabFront(b);
  if (t === 'rankings') wireBump();
}

async function openSeason(id) {
  setLoading('Fetching the latest from Sleeper…');
  try {
    let b = state.cache[id];
    if (!b) {
      const d = await load(id, { league: state.chain.find(x => x.id === id)?.league });
      b = await analyze(d);
      state.cache[id] = b;
      state.history = null;
    }
    state.cur = b;
    await renderTab();
  } catch (e) {
    console.error(e);
    $('#app').innerHTML = `<div class="err">Couldn't load from Sleeper: ${esc(e.message)}</div>`;
  }
}

async function init() {
  try {
    state.chain = await seasonChain(CONFIG.leagueId);
    $('#season').innerHTML = state.chain.map(x => `<option value="${x.id}">${esc(x.season)}</option>`).join('');
    $('#season').onchange = e => openSeason(e.target.value);
    $('#refresh').onclick = async () => {
      state.cache = {}; state.history = null;
      state.chain = await seasonChain(CONFIG.leagueId);
      openSeason($('#season').value);
    };
    window.addEventListener('hashchange', () => { state.tab = location.hash.slice(1) || 'front'; renderTab(); window.scrollTo(0, 0); });
    await openSeason(CONFIG.leagueId);
  } catch (e) {
    $('#app').innerHTML = `<div class="err">Couldn't reach Sleeper: ${esc(e.message)}</div>`;
  }
}
init();

// Layout diagnostics: open index.html?debug to show page/viewport widths and anything wider than the window.
if (qs.has('debug')) {
  const box = document.createElement('pre');
  box.style.cssText = 'position:fixed;left:8px;bottom:8px;z-index:99;margin:0;padding:8px 10px;max-width:92vw;white-space:pre-wrap;font:12px/1.4 ui-monospace,Menlo,monospace;background:#ffeb3b;color:#000;border:2px solid #000';
  document.body.appendChild(box);
  const report = () => {
    const de = document.documentElement, vv = window.visualViewport, wr = document.querySelector('.wrap').getBoundingClientRect();
    const wide = [...document.querySelectorAll('body *')].filter(el => el !== box && !box.contains(el) && el.getBoundingClientRect().right > de.clientWidth + 1 && !el.closest('.scroll, .strip-in'))
      .slice(0, 6).map(el => `  ${el.tagName.toLowerCase()}.${el.className.baseVal ?? el.className} right=${Math.round(el.getBoundingClientRect().right)} width=${Math.round(el.getBoundingClientRect().width)}`);
    box.textContent = [`window ${innerWidth} · page ${de.clientWidth} · content ${de.scrollWidth} · body ${document.body.scrollWidth}`,
      `zoom ${vv ? vv.scale.toFixed(2) : '?'} · visible ${vv ? Math.round(vv.width) : '?'} · dpr ${devicePixelRatio} · scrollX ${Math.round(scrollX)}`,
      `wrap left ${Math.round(wr.left)} width ${Math.round(wr.width)}`, ...(wide.length ? ['wider than window:', ...wide] : ['nothing wider than window']),
      navigator.userAgent.replace(/^Mozilla\/5\.0 /, '')].join('\n');
  };
  setInterval(report, 1000);
}
